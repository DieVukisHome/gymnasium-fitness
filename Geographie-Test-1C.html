<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geographie-Test 1C</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
:root{--papier:#f6f2e9;--karte:#fffdf8;--tinte:#26323a;--leise:#6b7780;--teal:#1f7a6d;--teal2:#e3f1ee;--orange:#e8822a;--orange2:#fdeedd;--rot:#c8453b;--rot2:#fbe7e5;--gruen:#2e8b57;--gruen2:#e3f4ea;--linie:#e3dccd;--r:16px}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
#main{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:30px 0 12px;color:var(--teal)}
h3{margin:22px 0 8px}
small{color:var(--leise);font-weight:400}
button{font:inherit;cursor:pointer;border:1.5px solid var(--linie);background:var(--karte);color:var(--tinte);border-radius:12px;padding:9px 16px;transition:transform .08s,background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--teal)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{cursor:default}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:#186357}
button.link{border:0;background:none;padding:2px 4px;color:var(--leise);text-decoration:underline}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#1f7a6d,#2f9a7c);color:#fff;border-radius:22px;padding:24px 26px}
.hero .datum{margin:4px 0 0;opacity:.9}
.count{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 18px;font-size:1.15rem;text-align:right}
.count .heute{font-size:.85rem;opacity:.9;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.karte-box,.karte-btn{background:var(--karte);border:1.5px solid var(--linie);border-radius:var(--r);padding:16px 18px}
.karte-box.test{background:var(--orange2);border-color:#f3c9a0}
.karte-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.karte-btn .ico{font-size:1.5rem}
.kopf{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.kopf .ico{font-size:1.8rem}
.kt{font-weight:700;font-size:1.05rem}
.ks{color:var(--leise);font-size:.88rem}
.fbar{height:8px;width:100%;background:#ece6d8;border-radius:5px;overflow:hidden;margin-top:10px}
.fbar div{height:100%;background:var(--gruen);border-radius:5px;transition:width .4s}
.fzahl{font-size:.8rem;color:var(--leise);margin-top:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btns.gross button{flex:1;padding:16px;font-size:1.05rem}
footer{margin-top:40px;text-align:center;font-size:.9rem;color:var(--leise)}
.leiste{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.leiste h2{margin:0;flex:1;color:var(--tinte);font-size:1.25rem}
.zurueck{padding:7px 12px;font-size:.92rem}
.stand{color:var(--leise);font-variant-numeric:tabular-nums}
.pbar{height:7px;background:#ece6d8;border-radius:5px;overflow:hidden;margin-bottom:18px}
.pbar div{height:100%;background:var(--orange);width:0;transition:width .35s}
.hinweis{color:var(--leise);font-size:.93rem}
.hinweis.inl{margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:8px 14px;display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--linie);background:var(--karte);cursor:pointer;font-size:.95rem}
.chip.an{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip.an small{color:#d7efe9}
.chips.klein .chip{padding:5px 12px;font-size:.88rem}
.aufgabe{background:var(--karte);border:1.5px solid var(--linie);border-radius:20px;padding:22px}
.nochmal{display:inline-block;background:var(--orange2);color:#a3561a;border-radius:8px;padding:2px 10px;font-size:.85rem;margin-bottom:8px}
.frage{font-size:1.3rem;font-weight:600;margin-bottom:14px}
.frage.klein{font-size:1rem;font-weight:500;color:var(--leise);margin-bottom:6px}
.def{font-size:1.35rem;font-weight:600;margin-bottom:16px}
.sortwort{font-size:1.6rem;font-weight:700;margin:6px 0 18px;color:var(--teal)}
.eing{display:flex;gap:10px;margin-top:16px}
.eing input{flex:1;font:inherit;font-size:1.25rem;padding:11px 14px;border:2px solid var(--linie);border-radius:12px;background:#fff;outline:none}
.eing input:focus,textarea:focus{border-color:var(--teal)}
.eing.zahl input{max-width:200px}
.eing select{font:inherit;font-size:1.1rem;border:2px solid var(--linie);border-radius:12px;padding:0 10px;background:#fff}
.wackel{animation:wackel .35s}
@keyframes wackel{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--linie);border-radius:12px;resize:vertical;outline:none;background:#fff}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wahl.drei{grid-template-columns:repeat(3,1fr)}
.wahl.ordnen{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.wahl,.wahl.drei,.wahl.ordnen{grid-template-columns:1fr}}
.wahl button{text-align:left;padding:13px 15px;font-size:1.05rem;display:flex;gap:10px;align-items:center}
.wahl.ordnen button{justify-content:center}
.wahl .nr{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:#efe9dc;color:var(--leise);font-size:.8rem}
.wahl button.ok,.rosengitter button.ok{background:var(--gruen2);border-color:var(--gruen)}
.wahl button.bad,.rosengitter button.bad{background:var(--rot2);border-color:var(--rot)}
.wahl.ordnen button:disabled{opacity:.35}
ol.reihe{min-height:10px;margin:0 0 14px;padding-left:26px;font-size:1.1rem}
ol.reihe li.ok{color:var(--gruen)} ol.reihe li.bad{color:var(--rot)}
.feedback{margin-top:16px;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;animation:rein .2s}
@keyframes rein{from{opacity:0;transform:translateY(6px)}}
.feedback .fk{font-weight:700;font-size:1.15rem}
.feedback .ft{grid-column:1}
.feedback button{grid-row:1/span 2;grid-column:2;padding:12px 20px;font-size:1.05rem}
.feedback.ok{background:var(--gruen2);border:1.5px solid #a9d8bb}.feedback.ok .fk{color:var(--gruen)}
.feedback.fast{background:var(--orange2);border:1.5px solid #f3c9a0}.feedback.fast .fk{color:#b5601c}
.feedback.falsch{background:var(--rot2);border:1.5px solid #ecb7b1}.feedback.falsch .fk{color:var(--rot)}
.wort{font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.falschbst{background:#f8c99a;color:#7a3a07;border-radius:3px;padding:0 1px}
.musterbox{margin-top:16px;background:var(--teal2);border-radius:14px;padding:14px 16px}
.ml{font-size:.82rem;color:var(--leise);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.ml:first-child{margin-top:0}
.muster{font-size:1.08rem;font-weight:500;margin-top:3px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.kw{border-radius:999px;padding:3px 11px;font-size:.9rem}
.kw.ja{background:var(--gruen2);color:var(--gruen);border:1px solid #a9d8bb}
.kw.nein{background:#fff;color:var(--leise);border:1px dashed #b9b2a3}
.schreib{margin-top:10px;background:var(--orange2);border-radius:10px;padding:8px 12px;font-size:.95rem}
.selbst button.bad{border-color:#ecb7b1}.selbst button.mid{border-color:#f3c9a0}.selbst button.okb{border-color:#a9d8bb;background:var(--gruen2)}
.selbst button:disabled{opacity:.5}
details.tipp{margin-top:12px;color:var(--leise)}
details.tipp summary{cursor:pointer}
.ende{text-align:center;padding:10px}
.ende .gross{font-size:2.6rem;font-weight:800;color:var(--teal)}
.ende .btns{justify-content:center}
.fehlerliste{text-align:left;display:inline-block;margin:0 auto}
.info{margin-top:10px;font-size:1.15rem;min-height:1.6em}
.zettel dt{font-weight:700;margin-top:12px}
.zettel dd{margin:3px 0 0 0;padding-left:14px;border-left:3px solid var(--teal2)}
.tab{border-collapse:collapse}.tab td{padding:4px 18px 4px 0;border-bottom:1px solid var(--linie)}
.konf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:99;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}

/* ---------- Karten ---------- */
.kartewrap{background:#fff;border:1.5px solid var(--linie);border-radius:14px;overflow:hidden}
.kartewrap.schmal{max-width:380px;margin:0 auto}
svg.karte{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.klickbar{cursor:crosshair}
.wasser{fill:#d4e6f1}
.kont{fill:#f2ecdc;stroke:#6f6656;stroke-width:.8;stroke-linejoin:round}
.ural{fill:none;stroke:#6f6656;stroke-width:1.2;stroke-dasharray:4 3}
.aeq{stroke:#c8453b;stroke-width:1.5;stroke-dasharray:6 4;opacity:0}
.aeqhit{stroke:transparent;stroke-width:14}
.zeigeAeq .aeq{opacity:1}
.aeqg.hl .aeq,.aeqg.okm .aeq,.aeqg.badm .aeq{opacity:1;stroke-width:3.5;stroke-dasharray:none}
.aeqg.hl .aeq{stroke:var(--orange)}.aeqg.okm .aeq{stroke:var(--gruen)}
.welt .kont.hl{fill:#f6b26b;stroke:#c4661a;stroke-width:1.5}
.welt .kont.okm{fill:#9fd8b2;stroke:var(--gruen)}
.welt .kont.badm{fill:#f2aaa3}
.marke circle{fill:var(--orange);stroke:#fff;stroke-width:3;animation:puls 1.2s infinite}
.marke text{fill:#fff;font-weight:800;font-size:24px;pointer-events:none}
.marke.okm circle{fill:var(--gruen);animation:none}
.marke.badm circle{fill:var(--rot);animation:none}
@keyframes puls{50%{opacity:.6}}
.lbl{font-size:16px;font-weight:700;fill:#2c3e50;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;opacity:0}
.lbl.meer{fill:#1d5f99;font-style:italic;font-size:15px}
.lbl.klein{font-size:13px;fill:#c8453b}
.lernen .lbl,.lbl.zeig{opacity:1}
.lernen.versteckt .lbl{opacity:0}
.lernen.versteckt .lbl.zeig{opacity:1}
.lbl.aus,.lernen .lbl.aus{opacity:0!important}
.lbl.stark{fill:#14523f}
.oe .lbl{font-size:10.5px;stroke-width:3px}
.oe .lbl.a-land{font-size:11.5px;fill:#5b4a2c;letter-spacing:.03em}
.oe .lbl.a-fluss,.oe .lbl.a-see{fill:#1d5f99;font-style:italic}
.oe .lbl.a-berg{fill:#4a3b2c;font-size:9.5px}
.hinter{fill:#fbfaf6}
.land{fill:#f4efe1;stroke:#9a8f7a;stroke-width:.7;stroke-dasharray:3 2}
.umriss{fill:none;stroke:#2e2a24;stroke-width:1.6;pointer-events:none}
.see{fill:#a9cbe8;stroke:#2f6fb2;stroke-width:.8}
.fluss{fill:none;stroke:#2f6fb2;stroke-width:1.6;stroke-linecap:round}
.flusshit{fill:none;stroke:transparent;stroke-width:11;stroke-linecap:round}
.balken{stroke:#3d342b;stroke-width:6;stroke-linecap:butt}
.balkenhit{stroke:transparent;stroke-width:16}
.gipfel{fill:#3d342b}
.stadt{fill:#fff;stroke:#2e2a24;stroke-width:1.4}
.stadt2{fill:#fff;stroke:#2e2a24;stroke-width:1.2}
.hit{fill:transparent}
.oe .land.hl{fill:#f6c08a;stroke:#c4661a;stroke-dasharray:none;stroke-width:1.4}
.oe .land.okm{fill:#a7dcb9}
.oe .land.badm{fill:#f2aaa3}
.flussg.hl .fluss{stroke:var(--orange);stroke-width:4.5}
.flussg.okm .fluss{stroke:var(--gruen);stroke-width:4}
.flussg.badm .fluss{stroke:var(--rot);stroke-width:4}
.see.hl{fill:var(--orange);stroke:#c4661a}.see.okm{fill:#7fcf9c}.see.badm{fill:#f2aaa3}
.bergg.hl .balken{stroke:var(--orange);stroke-width:8}.bergg.okm .balken{stroke:var(--gruen)}.bergg.badm .balken{stroke:var(--rot)}
.gipfelg.hl .gipfel{fill:var(--orange);transform-box:fill-box;transform-origin:center;transform:scale(1.6)}.gipfelg.okm .gipfel{fill:var(--gruen)}.gipfelg.badm .gipfel{fill:var(--rot)}
.stadtg.hl .stadt{fill:var(--orange);r:6;stroke:#c4661a}.stadtg.hl .stadt2{stroke:#c4661a}
.stadtg.okm .stadt{fill:var(--gruen);r:5}.stadtg.badm .stadt{fill:var(--rot);r:5}
.hl{animation:puls 1.2s infinite}
.blink{animation:puls .8s 3}
.still .lbl:not(.zeig){opacity:0}
.pA{fill:var(--teal);stroke:#fff;stroke-width:2}.pB{fill:var(--orange);stroke:#fff;stroke-width:2}
.lbl.tA{fill:var(--teal)}.lbl.tB{fill:#b5601c}
b.tA{color:var(--teal)}b.tB{color:#b5601c}
.pfeil{stroke:#555;stroke-width:1.5;stroke-dasharray:4 3}
.rosengitter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:16px auto 0}
.rosengitter button{display:flex;flex-direction:column;align-items:center;padding:8px}
.rosengitter button b{font-size:1.2rem}
.rosengitter .mitte{display:grid;place-items:center;font-weight:700;color:var(--teal);text-align:center;font-size:.9rem}
/* Globus */
.halb{fill:#5d9fd3}
.halb.hl{fill:var(--orange)}.halb.okm{fill:var(--gruen)}.halb.badm{fill:var(--rot)}
.gl-aeq{fill:none;stroke:#c8453b;stroke-width:2.5}
.gl-achse{stroke:#fff;stroke-width:2.5;stroke-dasharray:6 4}
.gl-pol{fill:#2c3e50}
.gl-hit{fill:none;stroke:transparent;stroke-width:14}
.gl-hit2{fill:transparent}
.gteil.hl .gl-aeq,.gteil.hl .gl-achse{stroke:var(--orange);stroke-width:5;stroke-dasharray:none}
.gteil.hl .gl-pol{fill:var(--orange);r:9}
.gteil.okm .gl-aeq,.gteil.okm .gl-achse{stroke:var(--gruen);stroke-width:5}.gteil.okm .gl-pol{fill:var(--gruen);r:9}
.gteil.badm .gl-aeq,.gteil.badm .gl-achse{stroke:var(--rot);stroke-width:5}.gteil.badm .gl-pol{fill:var(--rot);r:9}
/* Windrose */
.rosekreis{fill:#fbf8f1;stroke:#d8cfbd}
.zacke{fill:#c8453b}.zacke2{fill:#2c3e50}
.zacke.neben{fill:#e08b82}.zacke2.neben{fill:#7d8a96}
.spunkt{fill:transparent}
.rose .lbl{font-size:17px}
.rose.versteckt .lbl:not(.zeig){opacity:0}
.rose:not(.versteckt) .lbl{opacity:1}
.spitze.hl .spunkt{fill:var(--orange);r:11}.spitze.okm .spunkt{fill:var(--gruen);r:10}.spitze.badm .spunkt{fill:var(--rot);r:10}
</style>
</head>

function norm(s) { return String(s).normalize("NFC").replace(/\s+/g, " ").replace(/\s*\.\s*/g, ". ").replace(/[.!?\s]+$/, "").trim(); }

  for (let j = 1; j <= n; j++) d[0][j] = j;

    } else if (j > 0 && d[i][j] === d[i][j - 1] + 1) { mark[j - 1] = true; j--; }

  const L = best ? best[1].length : 0, grenze = L <= 4 ? 0 : L <= 7 ? 1 : 2;
  if (best && bd <= grenze) return { res: "fast", best: best[1], eingabe: best[0], grund: "Achte genau auf die Schreibweise." };

function schreibHinweise(text) {
  const out = [], gesehen = new Set();
  const woerter = text.match(/[A-Za-zÄÖÜäöüß]+/g) || [];
  for (const w of woerter) {
    if (w.length < 5 || gesehen.has(w)) continue; gesehen.add(w);
    const wl = w.toLowerCase();
    if (FACHWOERTER.includes(w)) continue;
    const exakt = FACHWOERTER.find((f) => f.toLowerCase() === wl);
    if (exakt) { if (exakt[0] === exakt[0].toUpperCase() && w[0] !== w[0].toUpperCase()) out.push(`<b>${esc(exakt)}</b> ist ein Nomen – groß schreiben!`); continue; }
    if (w.length < 6) continue;
    for (const f of FACHWOERTER) {
      const fl = f.toLowerCase(); if (f.length < 6) continue;
      if (fl.startsWith(wl) || wl.startsWith(fl)) continue;
      const dd = lev(wl, fl), v = dd[wl.length][fl.length];
      const uml = umlaute(wl) === fl;
      if (uml || v <= (fl.length >= 9 ? 2 : 1)) { out.push(`„${esc(w)}“ schreibt man <b>${esc(f)}</b>`); break; }
    }
  }
  return out;
}
function kwTreffer(text, kw) {
  const t = text.toLowerCase().replace(/\s+/g, "").replace(/\./g, "");
  const tLocker = t.replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss");
  let vorher = 0;
  return kw.map((k) => {
    const [label, st] = k.split(":"); const stems = st.split(",");
    if (stems[0] === "§zwei") return { label, ok: vorher >= 2 };
    let n = 0;
    for (const s of stems) { const sl = s.replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss"); if (t.includes(s) || tLocker.includes(sl)) n++; }
    vorher = n; return { label, ok: n > 0 };
  });
}

// ---------- Projektionen ----------
function wp(lon, lat) { const P = GEO.wproj; lat = Math.max(Math.min(lat, 83), -78); const r = Math.PI / 180; return [(lon * r + Math.PI) * P.sx, (P.yt - 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * r))) * P.sx]; }
function wpInv(x, y) { const P = GEO.wproj; const lon = (x / P.sx - Math.PI) * 180 / Math.PI; const m = P.yt - y / P.sx; const lat = (2.5 * Math.atan(Math.exp(0.8 * m)) - 0.625 * Math.PI) * 180 / Math.PI; return [lon, lat]; }
function ap(lon, lat) { const P = GEO.aproj; return [(lon - P.lon0) * P.cx * P.k, (P.lat1 - lat) * P.k]; }
function meerBei(lon, lat) {
  if (lat > 66) return "nordpolarmeer";
  if (lat < -60) return "suedpolarmeer";
  if (lon >= 20 && lon <= 100) return lat <= 30 ? "indik" : lat > 53 && lon < 32 ? "ostsee" : (lon > 27 && lat > 40.8 && lon < 42 ? "schwarzesmeer" : lon < 37 ? "mittelmeer" : "binnen");
  if (lon > 100 && lon <= 147) return lat < -8 ? "indik" : "pazifik";
  if (lon > 147) return "pazifik";
  let b;
  if (lat >= 50) b = -100; else if (lat >= 17) b = -97; else if (lat >= 14) b = -92; else if (lat > 8.5) b = -84.2; else if (lat > -8) b = -77.3; else if (lat > -40) b = -60; else b = -70;
  if (lat > 30 && lat < 46 && lon > -5.6 && !(lon < 0 && lat > 43)) return "mittelmeer";
  return lon < b ? "pazifik" : "atlantik";
}
function svgPunkt(svg, ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
function lbl(x, y, text, cls = "", anchor = "middle", forId = "") { return `<text class="lbl ${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" ${forId ? `data-for="${forId}"` : ""}>${esc(text)}</text>`; }

// ---------- Weltkarte ----------
const WELT_BY = Object.fromEntries(WELT.map((w) => [w.id, w]));
function weltSVG() {
  const G = GEO.world;
  const [, ey] = wp(0, 0);
  let s = `<svg class="karte welt" viewBox="0 0 ${G.w} ${G.h}"><rect class="wasser" x="0" y="0" width="${G.w}" height="${G.h}"/>`;
  for (const [id, d] of Object.entries(G.paths)) s += `<path class="kont" data-id="${id}" d="${d}"/>`;
  s += `<polyline class="ural" points="${G.ural.map((p) => p.join(",")).join(" ")}"/>`;
  s += `<g data-id="aequator" class="aeqg"><line class="aeq" x1="0" y1="${ey}" x2="${G.w}" y2="${ey}"/><line class="aeqhit" x1="0" y1="${ey}" x2="${G.w}" y2="${ey}"/></g>`;
  s += `<g class="marken"></g><g class="lbls">`;
  for (const w of WELT) {
    if (w.pts) for (const p of w.pts) { const [x, y] = wp(...p); s += lbl(x, y, w.name, "meer", "middle", w.id); }
    else { const [x, y] = wp(...w.lp); s += lbl(x, w.id === "aequator" ? y - 6 : y, w.name, w.id === "aequator" ? "klein" : "", w.id === "aequator" ? "start" : "middle", w.id); }
  }
  return s + `</g></svg>`;
}
function weltMarkiere(svg, id, cls) {
  const w = WELT_BY[id];
  if (w.pts) {
    const g = $(".marken", svg);
    for (const p of w.pts) { const [x, y] = wp(...p); g.insertAdjacentHTML("beforeend", `<g class="marke ${cls}" data-mfor="${id}"><circle cx="${x}" cy="${y}" r="22"/><text x="${x}" y="${y + 8}" text-anchor="middle">?</text></g>`); }
  } else { const el = $(`[data-id="${id}"]`, svg); el && el.classList.add(cls); if (id === "aequator") svg.classList.add("zeigeAeq"); }
}
function weltTreffer(svg, ev) {
  const t = ev.target.closest("[data-id]");
  if (t) return t.dataset.id;
  const [x, y] = svgPunkt(svg, ev); const [lon, lat] = wpInv(x, y); return meerBei(lon, lat);
}

// ---------- Österreichkarte ----------
const OE_ALLE = []; for (const [art, list] of Object.entries(OE)) for (const it of list) OE_ALLE.push({ ...it, art, key: "oe:" + art + ":" + it.id });
const OE_BY = Object.fromEntries(OE_ALLE.map((x) => [x.art + ":" + x.id, x]));
function oeSVG(opt = {}) {
  const G = GEO.austria;
  let s = `<svg class="karte oe" viewBox="-6 -4 ${G.w + 12} ${G.h + 8}"><rect class="hinter" x="-6" y="-4" width="${G.w + 12}" height="${G.h + 8}"/><g class="laender">`;
  for (const l of OE.land) s += `<path class="land" data-id="land:${l.id}" d="${G.laender[l.id]}"/>`;
  s += `</g><path class="umriss" d="${G.umriss}"/><g class="seen">`;
  for (const l of OE.see) s += `<path class="see" data-id="see:${l.id}" d="${G.seen[l.id]}"/>`;
  s += `</g><g class="fluesse">`;
  for (const f of OE.fluss) s += f.deko ? `<g class="flussg"><path class="fluss" d="${G.fluesse[f.id]}"/></g>` : `<g data-id="fluss:${f.id}" class="flussg"><path class="fluss" d="${G.fluesse[f.id]}"/><path class="flusshit" d="${G.fluesse[f.id]}"/></g>`;
  s += `</g><g class="berge">`;
  for (const b of OE.berg) {
    if (b.gipfel) { const [x, y] = ap(...b.ll); s += `<g data-id="berg:${b.id}" class="gipfelg"><path class="gipfel" d="M${x},${y - 6}L${x + 5.5},${y + 4}L${x - 5.5},${y + 4}Z"/><circle class="hit" cx="${x}" cy="${y}" r="9"/></g>`; continue; }
    const [x1, y1] = ap(...b.a), [x2, y2] = ap(...b.b);
    s += `<g data-id="berg:${b.id}" class="bergg"><line class="balken" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="balkenhit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/></g>`;
  }
  s += `</g><g class="staedte">`;
  for (const c of OE.stadt) { const [x, y] = ap(...c.ll); s += `<g data-id="stadt:${c.id}" class="stadtg">${c.haupt ? `<circle class="stadt2" cx="${x}" cy="${y}" r="6.5"/>` : ""}<circle class="stadt" cx="${x}" cy="${y}" r="3.6"/><circle class="hit" cx="${x}" cy="${y}" r="10"/></g>`; }
  s += `</g><g class="marken"></g><g class="lbls">`;
  for (const it of OE_ALLE) {
    if (it.deko) continue;
    let x, y, anchor = "middle";
    if (it.art === "stadt") { [x, y] = ap(...it.ll); x += it.dx ?? 6; y += it.dy ?? 4; anchor = it.anchor || "start"; }
    else if (it.art === "berg") { if (it.gipfel) { [x, y] = ap(...it.ll); y += it.ly || -9; } else { const a = ap(...it.a), b = ap(...it.b); x = (a[0] + b[0]) / 2; y = (a[1] + b[1]) / 2 - 7; } }
    else { [x, y] = ap(...it.lp); }
    s += lbl(x, y, it.name, "a-" + it.art, anchor, it.art + ":" + it.id);

}

}

  svg.addEventListener("click", (ev) => {

let SES = null;
function starte(titel, tasks, opt = {}) {
  SES = { titel, tasks: tasks.map((t) => ({ ...t, versuch: 0 })), gesamt: tasks.length, fertig: 0, erstRichtig: 0, fehler: [], test: !!opt.test, zurueck: opt.zurueck || "home", nochmal: opt.nochmal, mod: opt.mod || titel };
  zeige(`<div class="leiste"><button class="zurueck" id="abbruch">✕ Beenden</button><h2>${esc(titel)}</h2><div class="stand" id="stand"></div></div>
   <div class="pbar"><div id="pb"></div></div><div id="aufgabe"></div><div id="fb"></div>`);
  $("#abbruch").onclick = () => { if (SES && SES.fertig > 0) S.log.push({ t: Date.now(), mod: SES.mod, r: SES.erstRichtig, g: SES.fertig }), save(); geh(SES.zurueck); };
  weiter();
}
function weiter() {
  $("#fb").innerHTML = "";
  if (!SES.tasks.length) return ende();
  SES.cur = SES.tasks.shift();
  $("#pb").style.width = (100 * SES.fertig / SES.gesamt) + "%";
  $("#stand").textContent = `${Math.min(SES.fertig + 1, SES.gesamt)} / ${SES.gesamt}`;
  const a = $("#aufgabe"); a.innerHTML = ""; a.className = "aufgabe";
  if (SES.cur.versuch > 0) a.insertAdjacentHTML("beforeend", `<div class="nochmal">🔁 Noch einmal</div>`);
  RENDER[SES.cur.typ](a, SES.cur);
}
// res: ok | fast | falsch
function antwort(res, html) {
  const t = SES.cur, ok = res === "ok";
  if (t.id && t.zaehlt !== false) rec(t.id, ok);
  if (t.versuch === 0) { SES.fertig++; if (ok) SES.erstRichtig++; else SES.fehler.push(t); }
  if (!ok && !SES.test && t.versuch < 2) SES.tasks.splice(Math.min(3, SES.tasks.length), 0, { ...t, versuch: t.versuch + 1 });
  ton(ok);
  const kopf = ok ? pick(["Richtig!", "Super!", "Genau!", "Stimmt!", "Sehr gut!"]) : res === "fast" ? "Fast!" : "Leider falsch.";
  $("#fb").innerHTML = `<div class="feedback ${res}"><div class="fk">${ok ? "✓" : res === "fast" ? "≈" : "✗"} ${kopf}</div><div class="ft">${html || ""}</div><button class="pri" id="wbtn">Weiter →</button></div>`;
  $("#pb").style.width = (100 * SES.fertig / SES.gesamt) + "%";
  $$("#aufgabe input, #aufgabe textarea, #aufgabe button").forEach((e) => { if (!e.classList.contains("bleibt")) e.disabled = true; });
  $("#aufgabe").classList.add("beantwortet");
  const b = $("#wbtn"); b.onclick = weiter; setTimeout(() => b.isConnected && b.focus(), 30);
  $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function ende() {
  const s = SES; S.log.push({ t: Date.now(), mod: s.mod, r: s.erstRichtig, g: s.gesamt }); save();
  const quote = s.erstRichtig / s.gesamt;
  if (quote >= 0.8) konfetti();
  const satz = quote === 1 ? "Alles beim ersten Versuch richtig – großartig!" : quote >= 0.8 ? "Sehr gut gemacht!" : quote >= 0.5 ? "Gut! Die Fehler übst du in der nächsten Runde noch einmal." : "Dranbleiben – mit jeder Runde wird es leichter.";
  const liste = s.fehler.length ? `<h3>Das übst du noch einmal:</h3><ul class="fehlerliste">${s.fehler.map((t) => `<li>${aufgabeKurz(t)}</li>`).join("")}</ul>` : "";
  $("#pb").style.width = "100%";
  $("#aufgabe").innerHTML = `<div class="ende"><div class="gross">${s.erstRichtig} von ${s.gesamt}</div><div>beim ersten Versuch richtig</div><p>${satz}</p>${liste}
    <div class="btns"><button id="nochR">Noch eine Runde</button><button class="pri" id="zurR">Zur Übersicht</button></div></div>`;
  $("#fb").innerHTML = "";
  $("#nochR").onclick = () => s.nochmal ? s.nochmal() : geh(s.zurueck);
  $("#zurR").onclick = () => geh(s.zurueck === "oehub" ? "oehub" : "home");
  setTimeout(() => $("#zurR")?.focus(), 30);
}
function aufgabeKurz(t) {
  switch (t.typ) {
    case "welt": return `Weltkarte: <b>${esc(t.w.name)}</b>`;
    case "oe": return `Österreichkarte: <b>${esc(t.o.name)}</b> (${OE_ARTEN[t.o.art]})`;

  let A, B, sek;
  for (let k = 0; k < 200; k++) {
    A = pick(ORTE.slice(0, 9)); B = pick(ORTE); if (A === B) continue;
    const [x1, y1] = ap(...A.ll), [x2, y2] = ap(...B.ll);
    const w = (Math.atan2(x2 - x1, y1 - y2) * 180 / Math.PI + 360) % 360;
    sek = Math.round(w / 45) % 8; if (Math.abs(w - Math.round(w / 45) * 45) <= 13 && Math.hypot(x2 - x1, y2 - y1) > 40) break;
  }
  const soll = ROSE[sek];
  const Bn = B.name.replace(/^der /, "");
  a.insertAdjacentHTML("beforeend", `<div class="frage">Du bist in <b class="tA">${esc(A.name)}</b>. In welcher Himmelsrichtung liegt <b class="tB">${esc(Bn)}</b>?</div><div class="kartewrap">${oeSVG()}</div>
   <div class="rosengitter">${["NW", "N", "NO", "W", "", "O", "SW", "S", "SO"].map((d) => d ? `<button data-d="${d}"><b>${d}</b><small>${ROSE.find((r) => r.id === d).name}</small></button>` : `<div class="mitte">${esc(A.name)}</div>`).join("")}</div>`);
  const svg = $("svg", a); svg.classList.add("still");
  const [xa, ya] = ap(...A.ll), [xb, yb] = ap(...B.ll);
  $(".marken", svg).innerHTML = `<circle class="pA" cx="${xa}" cy="${ya}" r="6"/><circle class="pB" cx="${xb}" cy="${yb}" r="6"/>${lbl(xa, ya - 10, A.name, "zeig stark tA")}${lbl(xb, yb - 10, Bn, "zeig stark tB")}`;
  $$(".rosengitter button", a).forEach((b) => b.onclick = () => {
    const d = b.dataset.d, ok = d === soll.id; b.classList.add(ok ? "ok" : "bad"); $(`.rosengitter button[data-d="${soll.id}"]`, a).classList.add("ok");
    $(".marken", svg).insertAdjacentHTML("afterbegin", `<line class="pfeil" x1="${xa}" y1="${ya}" x2="${xb}" y2="${yb}"/>`);
    const nb = Math.abs(ROSE.findIndex((r) => r.id === d) - sek); const knapp = !ok && (nb === 1 || nb === 7);
    antwort(ok ? "ok" : "falsch", `${esc(Bn)} liegt von ${esc(A.name)} aus im <b>${soll.name}</b> (${soll.id}).${knapp ? " Knapp daneben!" : ""}`);
  });
};

// Tastatur: Zahlen für Auswahl, Enter für Weiter
document.addEventListener("keydown", (e) => {
  if (!SES) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (/^[1-9]$/.test(e.key)) { const b = $$("#aufgabe .wahl button:not(:disabled)")[+e.key - 1]; if (b) b.click(); }
});

// =====================================================
// NAVIGATION
// =====================================================
function weltTasks(mode) { return shuffle(WELT.filter((w) => !(mode === "find" && w.id === "aequator"))).map((w) => ({ ...ITEMS["w:" + w.id].make(mode) })); }
function oeTasks(mode) {
  let ids = idsVon((x) => x.ch === "karte-oe" && (OE_KAT === "alle" || x.art === OE_KAT));
  ids = OE_KAT === "alle" ? schwaechste(ids, 12) : shuffle(ids);
  return ids.map((id) => ITEMS[id].make(mode));
}
function kapitelTasks(ch) {
  let ids = idsVon((x) => x.ch === ch);
  const sk = ids.filter((id) => ITEMS[id].skill);
  const rest = schwaechste(ids.filter((id) => !ITEMS[id].skill), 12 - sk.length * 2);
  const tasks = rest.map((id) => ITEMS[id].make());
  for (const s of sk) tasks.push(ITEMS[s].make(), ITEMS[s].make());
  return shuffle(tasks);
}
function probetest() {
  const welt = [...shuffle(WELT.filter((w) => w.art === "Kontinent")).slice(0, 3), pick(WELT.filter((w) => w.art === "Ozean"))].map((w) => ITEMS["w:" + w.id].make("type"));
  const nach = (art, n) => shuffle(OE_ALLE.filter((o) => o.art === art && !o.deko)).slice(0, n).map((o) => ITEMS[o.key].make("type"));
  const oe = [...nach("land", 2), ...nach("stadt", 2), ...nach(pick(["fluss", "see"]), 1), ...nach("berg", 1)];
  const fr = shuffle(BLATT).slice(0, 6).map((id) => ITEMS[id].make());
  const extra = [ITEMS["skill:massstab"].make(), ITEMS["skill:richtung"].make(), ITEMS["t:" + pick(BEGRIFFE)[0]].make(), ITEMS["r:" + pick(ROSE).id].make("type")];
  return [...welt, ...oe, ...shuffle([...fr, ...extra])];
}
function geh(z) {
  const [a, b] = z.split(":");
  if (a === "home") return home();
  if (a === "oehub") return oeHub();
  if (a === "oekat") { OE_KAT = b; return oeHub(); }
  if (a === "lern") return lernKarte(b);
  if (a === "find" || a === "type") {
    const f = () => b === "welt" ? starte(`Weltkarte – ${a === "find" ? "Finden" : "Beschriften"}`, weltTasks(a), { zurueck: "home", nochmal: f })
      : starte(`Österreich – ${a === "find" ? "Finden" : "Beschriften"}`, oeTasks(a), { zurueck: "oehub", nochmal: f });
    return f();
  }
  if (a === "blatt") { const f = () => starte("Fragen vom Übungsblatt", schwaechste(BLATT, 10).map((id) => ITEMS[id].make()), { nochmal: f }); return f(); }
  if (a === "kap") { const k = KAPITEL.find((x) => x.id === b); const f = () => starte(k.name, kapitelTasks(b), { nochmal: f }); return f(); }
  if (a === "begriffe") { const f = () => starte("Fachbegriffe schreiben", schwaechste(idsVon((x) => x.begriff), 10).map((id) => ITEMS[id].make()), { nochmal: f }); return f(); }
  if (a === "probetest") { const f = () => starte("Probetest", probetest(), { test: true, nochmal: f }); return f(); }
  if (a === "lernzettel") return lernzettel();
  if (a === "ton") { S.ton = !S.ton; save(); return home(); }
  if (a === "reset") { if (confirm("Wirklich den ganzen Fortschritt löschen?")) { S = { items: {}, log: [], ton: S.ton }; save(); } return home(); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); geh(b.dataset.go); } });

function lernzettel() {
  const nachKap = KAPITEL.map((k) => {
    const fr = FRAGEN.filter((f) => f.blatt && f.ch === k.id);
    if (!fr.length) return "";
    return `<h3>${k.icon} ${esc(k.name)} <small>${k.seiten}</small></h3><dl>${fr.map((f) => `<dt>${esc(f.q)}</dt><dd>${esc(f.a)}</dd>`).join("")}</dl>`;
  }).join("");
  zeige(`<div class="leiste"><button class="zurueck" data-go="home">← Übersicht</button><h2>Lernzettel: Fragen vom Übungsblatt</h2></div>
   <p class="hinweis">Lies die Antworten in Ruhe durch. Dann übe sie unter „Üben“ – dort schreibst du sie selbst.</p><div class="zettel">${nachKap}
   <h3>📍 Bundesländer und Landeshauptstädte</h3><table class="tab">${OE.land.map((l) => `<tr><td>${esc(l.name)}</td><td>${esc(OE.stadt.find((c) => c.land === l.id).name)}</td></tr>`).join("")}</table></div>
   <div class="btns"><button class="pri" data-go="blatt">Jetzt üben</button></div>`);
}

home();

</script>
