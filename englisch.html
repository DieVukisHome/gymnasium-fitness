<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Revision 1C</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇧</text></svg>">
<style>
:root{--papier:#f6f2e9;--karte:#fffdf8;--tinte:#26323a;--leise:#6b7780;--teal:#3949ab;--teal2:#e8eaf6;--orange:#e8822a;--orange2:#fdeedd;--rot:#c8453b;--rot2:#fbe7e5;--gruen:#2e8b57;--gruen2:#e3f4ea;--linie:#e3dccd;--r:16px}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
#main{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:30px 0 12px;color:var(--teal)}
h3{margin:22px 0 8px}
small{color:var(--leise);font-weight:400}
button{font:inherit;cursor:pointer;border:1.5px solid var(--linie);background:var(--karte);color:var(--tinte);border-radius:12px;padding:9px 16px;transition:transform .08s,background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--teal)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{cursor:default}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:#2c3a8f}
button.link{border:0;background:none;padding:2px 4px;color:var(--leise);text-decoration:underline}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#3949ab,#5c6bc0);color:#fff;border-radius:22px;padding:24px 26px}
.hero .datum{margin:4px 0 0;opacity:.9}
.count{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 18px;font-size:1.15rem;text-align:right}
.count .heute{font-size:.85rem;opacity:.9;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.karte-box,.karte-btn{background:var(--karte);border:1.5px solid var(--linie);border-radius:var(--r);padding:16px 18px}
.karte-box.test{background:var(--orange2);border-color:#f3c9a0}
.karte-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.karte-btn .ico{font-size:1.5rem}
.kopf{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.kopf .ico{font-size:1.8rem}
.kt{font-weight:700;font-size:1.05rem}
.ks{color:var(--leise);font-size:.88rem}
.fbar{height:8px;width:100%;background:#ece6d8;border-radius:5px;overflow:hidden;margin-top:10px}
.fbar div{height:100%;background:var(--gruen);border-radius:5px;transition:width .4s}
.fzahl{font-size:.8rem;color:var(--leise);margin-top:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btns.gross button{flex:1;padding:16px;font-size:1.05rem}
footer{margin-top:40px;text-align:center;font-size:.9rem;color:var(--leise)}
.leiste{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.leiste h2{margin:0;flex:1;color:var(--tinte);font-size:1.25rem}
.zurueck{padding:7px 12px;font-size:.92rem}
.stand{color:var(--leise);font-variant-numeric:tabular-nums}
.pbar{height:7px;background:#ece6d8;border-radius:5px;overflow:hidden;margin-bottom:18px}
.pbar div{height:100%;background:var(--orange);width:0;transition:width .35s}
.hinweis{color:var(--leise);font-size:.93rem}
.hinweis.inl{margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:8px 14px;display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--linie);background:var(--karte);cursor:pointer;font-size:.95rem}
.chip.an{background:var(--teal);color:#fff;border-color:var(--teal)}

.chips.klein .chip{padding:5px 12px;font-size:.88rem}
.aufgabe{background:var(--karte);border:1.5px solid var(--linie);border-radius:20px;padding:22px}
.nochmal{display:inline-block;background:var(--orange2);color:#a3561a;border-radius:8px;padding:2px 10px;font-size:.85rem;margin-bottom:8px}
.frage{font-size:1.3rem;font-weight:600;margin-bottom:14px}
.frage.klein{font-size:1rem;font-weight:500;color:var(--leise);margin-bottom:6px}
.def{font-size:1.35rem;font-weight:600;margin-bottom:16px}
.sortwort{font-size:1.6rem;font-weight:700;margin:6px 0 18px;color:var(--teal)}
.eing{display:flex;gap:10px;margin-top:16px}
.eing input{flex:1;font:inherit;font-size:1.25rem;padding:11px 14px;border:2px solid var(--linie);border-radius:12px;background:#fff;outline:none}
.eing input:focus,textarea:focus{border-color:var(--teal)}
.eing.zahl input{max-width:200px}
.eing select{font:inherit;font-size:1.1rem;border:2px solid var(--linie);border-radius:12px;padding:0 10px;background:#fff}
.wackel{animation:wackel .35s}
@keyframes wackel{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--linie);border-radius:12px;resize:vertical;outline:none;background:#fff}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wahl.drei{grid-template-columns:repeat(3,1fr)}
.wahl.ordnen{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.wahl,.wahl.drei,.wahl.ordnen{grid-template-columns:1fr}}
.wahl button{text-align:left;padding:13px 15px;font-size:1.05rem;display:flex;gap:10px;align-items:center}
.wahl.ordnen button{justify-content:center}
.wahl .nr{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:#efe9dc;color:var(--leise);font-size:.8rem}
.wahl button.ok,.rosengitter button.ok{background:var(--gruen2);border-color:var(--gruen)}
.wahl button.bad,.rosengitter button.bad{background:var(--rot2);border-color:var(--rot)}
.wahl.ordnen button:disabled{opacity:.35}
ol.reihe{min-height:10px;margin:0 0 14px;padding-left:26px;font-size:1.1rem}
ol.reihe li.ok{color:var(--gruen)} ol.reihe li.bad{color:var(--rot)}
.feedback{margin-top:16px;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;animation:rein .2s}
@keyframes rein{from{opacity:0;transform:translateY(6px)}}
.feedback .fk{font-weight:700;font-size:1.15rem}
.feedback .ft{grid-column:1}

.feedback.ok{background:var(--gruen2);border:1.5px solid #a9d8bb}.feedback.ok .fk{color:var(--gruen)}
.feedback.fast{background:var(--orange2);border:1.5px solid #f3c9a0}.feedback.fast .fk{color:#b5601c}
.feedback.falsch{background:var(--rot2);border:1.5px solid #ecb7b1}.feedback.falsch .fk{color:var(--rot)}
.wort{font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.falschbst{background:#f8c99a;color:#7a3a07;border-radius:3px;padding:0 1px}
.musterbox{margin-top:16px;background:var(--teal2);border-radius:14px;padding:14px 16px}
.ml{font-size:.82rem;color:var(--leise);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.ml:first-child{margin-top:0}
.muster{font-size:1.08rem;font-weight:500;margin-top:3px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.kw{border-radius:999px;padding:3px 11px;font-size:.9rem}
.kw.ja{background:var(--gruen2);color:var(--gruen);border:1px solid #a9d8bb}
.kw.nein{background:#fff;color:var(--leise);border:1px dashed #b9b2a3}
.schreib{margin-top:10px;background:var(--orange2);border-radius:10px;padding:8px 12px;font-size:.95rem}
.selbst button.bad{border-color:#ecb7b1}.selbst button.mid{border-color:#f3c9a0}.selbst button.okb{border-color:#a9d8bb;background:var(--gruen2)}
.selbst button:disabled{opacity:.5}
details.tipp{margin-top:12px;color:var(--leise)}
details.tipp summary{cursor:pointer}
.ende{text-align:center;padding:10px}
.ende .gross{font-size:2.6rem;font-weight:800;color:var(--teal)}
.ende .btns{justify-content:center}
.fehlerliste{text-align:left;display:inline-block;margin:0 auto}
.info{margin-top:10px;font-size:1.15rem;min-height:1.6em}
.zettel dt{font-weight:700;margin-top:12px}
.zettel dd{margin:3px 0 0 0;padding-left:14px;border-left:3px solid var(--teal2)}
.tab{border-collapse:collapse}.tab td{padding:4px 18px 4px 0;border-bottom:1px solid var(--linie)}
.konf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:99;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}


.satz{font-size:1.5rem;font-weight:600;margin:8px 0 6px;line-height:2}
.quelle{font-size:1.35rem;font-weight:600;background:var(--teal2);border-radius:12px;padding:10px 16px;margin:6px 0 4px;display:inline-block}
.quelle.inl{font-size:1.2rem;margin-top:8px}
.tag{background:var(--orange2);color:#a3561a;border-radius:7px;padding:1px 8px;font-weight:600;margin-left:6px}
input.luecke{font:inherit;font-size:1.35rem;font-weight:600;color:var(--teal);border:0;border-bottom:3px solid var(--teal);background:#f4f5fc;border-radius:6px 6px 0 0;padding:2px 8px;outline:none;text-align:center;min-width:4ch;max-width:100%}
input.luecke.lang{text-align:left;width:100%!important;font-size:1.25rem;border:2px solid var(--linie);border-radius:12px;padding:10px 14px;background:#fff;color:var(--tinte)}
input.luecke.lang:focus{border-color:var(--teal)}
input.luecke.ok{border-color:var(--gruen);background:var(--gruen2);color:var(--gruen)}
input.luecke.bad{border-color:var(--rot);background:var(--rot2);color:var(--rot)}
.satzfeld{margin-top:12px}
.gap{display:inline-block;min-width:3ch;color:var(--leise)}
.gap.gefuellt{color:var(--gruen);border-bottom:3px solid var(--gruen)}
.emo-gross{font-size:2.6rem;line-height:1.1}
.plural{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:10px 0;font-size:1.35rem}
.pl-teil{text-align:center}
.pfeil{font-size:2rem;color:var(--leise)}
.bildgross{max-width:360px;margin:4px auto 6px;background:#fff;border:1.5px solid var(--linie);border-radius:14px}
svg.szene{display:block;width:100%;height:auto}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prepwahl{grid-template-columns:repeat(4,1fr)}
.prepwahl button{justify-content:center;font-weight:600}
.bildwahl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:700px){.bildwahl,.prepwahl{grid-template-columns:repeat(2,1fr)}}
.bildwahl button{padding:6px;background:#fff}
.bildwahl button.ok{background:var(--gruen2);border-color:var(--gruen);border-width:3px}
.bildwahl button.bad{background:var(--rot2);border-color:var(--rot);border-width:3px}
.gebaut{min-height:56px;border:2px dashed var(--linie);border-radius:12px;padding:12px 14px;font-size:1.35rem;font-weight:600;margin-bottom:12px}
.gebaut.ok{border-color:var(--gruen);background:var(--gruen2)}.gebaut.bad{border-color:var(--rot);background:var(--rot2)}
.gebaut .leer{font-weight:400;color:var(--leise);font-size:1rem}
.kacheln{display:flex;flex-wrap:wrap;gap:8px}
.kacheln button{font-size:1.2rem;font-weight:600;padding:9px 16px;background:#f4f5fc}
.kacheln button:disabled{opacity:.25}
.regeln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.regeln.links{text-align:left}
.regel{background:var(--karte);border:1.5px solid var(--linie);border-left:5px solid var(--teal);border-radius:12px;padding:12px 16px}
.regel .rt{font-weight:700;color:var(--teal);margin-bottom:4px}
.regel ul{margin:6px 0 0;padding-left:20px}
.regel .falle{margin-top:8px;background:var(--rot2);border-radius:8px;padding:4px 10px;font-size:.92rem}
#rbox .regel{margin-top:12px;grid-column:1/-1}
.bildleiste{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.bildleiste figure{margin:0;background:#fff;border:1.5px solid var(--linie);border-radius:12px;padding:4px;text-align:center}
.bildleiste figcaption{font-size:.95rem;padding-bottom:4px}
.schwach{margin-top:16px;background:var(--orange2);border:1.5px solid #f3c9a0;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button.klein{padding:5px 14px;font-size:.9rem;margin-left:auto}
.karte-btn.gemischt{background:var(--teal2)}
.feedback .fbtns{grid-row:1/span 2;grid-column:2;display:flex;gap:8px}
.feedback .fbtns button{padding:12px 18px}
#rbox{grid-column:1/-1}
.hinw{background:#fff8;border-radius:8px;padding:4px 10px;margin-bottom:6px}
.btns.mitte{justify-content:center}
.tab th{text-align:left;padding:4px 18px 4px 0;color:var(--leise);font-weight:500}
.tab.gross td{font-size:1.05rem}

.beispiel{color:var(--leise);font-size:.95rem;margin:-6px 0 10px}
.bildzeile{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0}
.figur{text-align:center;background:#fff;border:1.5px solid var(--linie);border-radius:14px;padding:8px 14px;min-width:84px}
.figur .emo-gross{font-size:3rem}
.fname{font-weight:700;margin-top:2px}
.haken{font-size:2.4rem;font-weight:800;width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.haken.ja{background:var(--gruen2);color:var(--gruen)}.haken.nein{background:var(--rot2);color:var(--rot)}
.zaehlbild{font-size:2.3rem;display:flex;flex-wrap:wrap;gap:4px;max-width:420px;margin:6px 0 10px}
.impicon{position:relative;font-size:3.6rem;width:96px;height:96px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--linie);border-radius:16px}
.impicon .verbot{position:absolute;inset:0;display:grid;place-items:center;font-size:4.6rem;opacity:.85}
</style>
</head>
<body>
<main id="main"></main>
<script>
// ===================== INHALTE: English Revision =====================
// Stoff laut Lehrerin: verb "be" (positive and negative), plural, prepositions of place,
// imperative, have/has (not) got. Abgeglichen mit MORE! 1, Units 1–4 (Student's Book + Workbook).

const THEMEN = [
  { id: "be", name: "verb „be“", sub: "am · is · are – und verneint", icon: "🙋" },
  { id: "have", name: "have got / has got", sub: "positiv und verneint", icon: "🏴‍☠️" },
  { id: "plural", name: "Plural", sub: "one frog – two frogs", icon: "🐸" },
  { id: "prep", name: "Prepositions of place", sub: "in · on · under · behind …", icon: "📦" },
  { id: "imp", name: "Imperative", sub: "Stand up! · Don't speak!", icon: "📣" },
];

// Jede abgefragte Regel hat einen Merkkasten (sonst kann man sie nicht nachbessern).
const REGELN = {
  "be.am": { thema: "be", name: "I → am",
    text: "Nur <b>I</b> bekommt <b>am</b>. Kurzform: <b>I'm</b>.", bsp: ["I <b>am</b> eleven. → I<b>'m</b> eleven.", "I<b>'m</b> in class 1C."] },
  "be.is": { thema: "be", name: "he / she / it → is",
    text: "<b>he, she, it</b> bekommen <b>is</b>. Auch ein Name oder <i>ein</i> Tier/Ding: Mike = he, Sue = she, the frog = it.", bsp: ["He<b>'s</b> in class 4A. (He <b>is</b> …)", "The parrot <b>is</b> on the car."] },
  "be.are": { thema: "be", name: "you / we / they → are",
    text: "<b>you, we, they</b> bekommen <b>are</b>. Auch alles in der Mehrzahl: Rahim and Sue = they, the monkeys = they.", bsp: ["We<b>'re</b> from York. (We <b>are</b> …)", "Rahim and Sue <b>are</b> 11."] },
  "be.kurz": { thema: "be", name: "Kurzformen von be",
    text: "Statt <b>am / is / are</b> schreibt man oft die Kurzform mit Apostroph.",
    tab: [["I am", "I'm"], ["you are", "you're"], ["he is", "he's"], ["she is", "she's"], ["it is", "it's"], ["we are", "we're"], ["they are", "they're"]] },
  "be.not": { thema: "be", name: "be verneinen: not dahinter",
    text: "Das <b>not</b> kommt <b>hinter</b> am / is / are – nie davor! Kurzformen: <b>isn't</b> (= is not), <b>aren't</b> (= are not), <b>I'm not</b>. (Es gibt kein „amn't“.)",
    bsp: ["Richard <b>isn't</b> hot. He's cold.", "We <b>aren't</b> late.", "I<b>'m not</b> tired."],
    falle: "Falsch: <s>She not is happy.</s> · <s>She don't happy.</s>" },
  "have.have": { thema: "have", name: "I / you / we / they → have got",
    text: "<b>I, you, we, they</b> (und alles in der Mehrzahl) bekommen <b>have got</b>. Kurzform: <b>'ve got</b>.", bsp: ["I <b>have got</b> a cat. → I<b>'ve got</b> a cat.", "They <b>have got</b> a big ship."] },
  "have.has": { thema: "have", name: "he / she / it → has got",
    text: "<b>he, she, it</b> (und ein Name oder <i>ein</i> Tier/Ding) bekommen <b>has got</b>. Kurzform: <b>'s got</b>.", bsp: ["She <b>has got</b> red hair. → She<b>'s got</b> red hair.", "Blackbeard <b>has got</b> a ship."] },
  "have.not": { thema: "have", name: "have got verneinen",
    text: "Das <b>not</b> kommt zwischen have/has und got: <b>haven't got</b> und <b>hasn't got</b>.",
    bsp: ["I <b>haven't got</b> a red ship.", "Tamara <b>hasn't got</b> a laptop."],
    falle: "he / she / it → <b>hasn't</b> got (nicht haven't). Und das <b>got</b> nicht vergessen!" },
  "pl.s": { thema: "plural", name: "Plural: einfach -s",
    text: "Meistens hängt man in der Mehrzahl einfach ein <b>-s</b> an.", bsp: ["a dog → 4 dog<b>s</b>", "a bear → 7 bear<b>s</b>"] },
  "pl.y": { thema: "plural", name: "Plural: -y wird zu -ies",
    text: "Endet ein Nomen auf Mitlaut + <b>y</b> (z. B. -by), wird daraus <b>-ies</b>. <b>Aber:</b> Steht ein Selbstlaut vor dem y (a, e, o, u), kommt nur <b>-s</b> dazu.", bsp: ["a baby → 8 bab<b>ies</b>", "<b>Aber:</b> a boy → 3 boy<b>s</b>"] },
  "pl.es": { thema: "plural", name: "Plural: -es",
    text: "Endet ein Nomen auf <b>s, ss, sh, ch</b> oder <b>x</b>, hängt man <b>-es</b> an – sonst könnte man es nicht aussprechen.", bsp: ["bus → bus<b>es</b>", "box → box<b>es</b>", "sandwich → sandwich<b>es</b>"] },
  "pl.irr": { thema: "plural", name: "Ausnahmen (irregular plurals)",
    text: "Diese Wörter bekommen kein -s – sie muss man auswendig lernen. Die ersten vier stehen in deinem Buch.",
    tab: [["a child", "five children"], ["a fish", "three fish"], ["one foot", "two feet"], ["one tooth", "five teeth"], ["a man", "men"], ["a woman", "women"], ["a mouse", "mice"]] },
  "prep.in": { thema: "prep", name: "in = in", text: "<b>in</b> – drinnen.", bsp: ["It's <b>in</b> the box."] },
  "prep.on": { thema: "prep", name: "on = auf", text: "<b>on</b> – oben drauf.", bsp: ["The parrot is <b>on</b> the car."] },
  "prep.under": { thema: "prep", name: "under = unter", text: "<b>under</b> – darunter.", bsp: ["There's a dog <b>under</b> the desk."] },
  "prep.next": { thema: "prep", name: "next to = neben", text: "<b>next to</b> – daneben. Immer zwei Wörter!", bsp: ["He's <b>next to</b> a giraffe."] },
  "prep.behind": { thema: "prep", name: "behind = hinter", text: "<b>behind</b> – dahinter. Man sieht oft nur ein Stück davon.", bsp: ["It's <b>behind</b> the tree."] },
  "prep.front": { thema: "prep", name: "in front of = vor", text: "<b>in front of</b> – davor. Drei Wörter!", bsp: ["The tree is <b>in front of</b> you."] },
  "imp.pos": { thema: "imp", name: "Imperativ (Befehlsform)",

const GEN = {};

for (const k of ["I", "3", "pl"]) {

for (const [regel, k3] of [["have.have", false], ["have.has", true]]) {

// Bildkarte: Person + Ding + ✓/✗ → ganzer Satz (wie Workbook S. 25, Übung 11)
function haveKarte(regel) {
  const pool = KARTEN_LEUTE.filter((x) => regel === "have.not" ? true : regel === "have.has" ? x[2] === "3" : x[2] === "pl");
  const [name, gesicht, k, p] = pick(pool), [emo, ding] = pick(KARTEN_DINGE), hat = regel !== "have.not";
  const P = cap(p), k3 = k === "3", acc = [];
  for (const s of [name, P]) {
    if (hat) { acc.push(`${s} ${k3 ? "has" : "have"} got ${ding}.`); if (k3) acc.push(`${s}'s got ${ding}.`); else if (s === P) acc.push(`${P}'ve got ${ding}.`); }

  const richtig = hat ? `${name} ${k3 ? "has" : "have"} got ${ding}.` : `${name} ${k3 ? "hasn't" : "haven't"} got ${ding}.`;
  return { typ: "karte", regel, name, gesicht, emo, hat, accept: acc, satz: true, ctx: { s: name, p, k },

GEN["have.not"] = () => {

  if (r < 0.4) return luecke("have.not", `${S} ___ got ${O}.`, [kurz, lang], `${grund(sub, kurz + " got")}`, { ctx: sub, hinweis: "(not)" });

for (const regel of regelnVon("plural")) {

function impTauschen(s) { return s.startsWith("Don't ") ? cap(s.slice(6)) : "Don't " + s.charAt(0).toLowerCase() + s.slice(1); }

  const plan = []; for (let i = 0; plan.length < n; i++) plan.push(rs[i % rs.length]);
  return shuffle(plan).map(neueAufgabe);
}
function probetest() {
  const plan = [];
  for (const th of THEMEN) plan.push(...shuffle(regelnVon(th.id)).slice(0, 4).concat(regelnVon(th.id)).slice(0, 4));
  return plan.map(neueAufgabe);
}
function lernzettel() {
  zeige(`<div class="leiste"><button class="zurueck" data-go="home">← Übersicht</button><h2>Lernzettel</h2></div>
   ${THEMEN.map((th) => `<h2>${th.icon} ${esc(th.name)}</h2><div class="regeln">${regelnVon(th.id).map(regelKarte).join("")}</div>${th.id === "prep" ? `<div class="bildleiste">${PREPS.map((p) => `<figure>${szene(p.id, DINGE[0], p.obj[0])}<figcaption><b>${p.wort}</b> the ${p.obj[0]}</figcaption></figure>`).join("")}</div>` : ""}`).join("")}
   <h2>📋 be – alle Formen</h2>
   <table class="tab gross"><tr><th></th><th>positiv</th><th>Kurzform</th><th>negativ</th></tr>
   ${[["I", "am", "I'm", "I'm not"], ["you", "are", "you're", "you aren't"], ["he / she / it", "is", "he's / she's / it's", "he isn't"], ["we", "are", "we're", "we aren't"], ["they", "are", "they're", "they aren't"]].map((z) => `<tr><td>${z[0]}</td><td><b>${z[1]}</b></td><td>${z[2]}</td><td>${z[3]}</td></tr>`).join("")}</table>
   <h2>📋 have got – alle Formen</h2>
   <table class="tab gross"><tr><th></th><th>positiv</th><th>Kurzform</th><th>negativ</th></tr>
   ${[["I / you / we / they", "have got", "'ve got", "haven't got"], ["he / she / it", "has got", "'s got", "hasn't got"]].map((z) => `<tr><td>${z[0]}</td><td><b>${z[1]}</b></td><td>${z[2]}</td><td>${z[3]}</td></tr>`).join("")}</table>
   <div class="btns"><button class="pri" data-go="home">Zur Übersicht</button></div>`);
}

// =====================================================
// SITZUNG
// =====================================================
let SES = null;
function starte(titel, tasks, opt = {}) {
  SES = { titel, tasks: tasks.map((t) => ({ ...t, versuch: 0 })), gesamt: tasks.length, fertig: 0, erstRichtig: 0, fehler: [], test: !!opt.test, nochmal: opt.nochmal, mod: opt.mod || titel };
  zeige(`<div class="leiste"><button class="zurueck" id="abbruch">✕ Beenden</button><h2>${esc(titel)}</h2><div class="stand" id="stand"></div></div>
   <div class="pbar"><div id="pb"></div></div><div id="aufgabe"></div><div id="fb"></div>`);
  $("#abbruch").onclick = () => { if (SES && SES.fertig > 0) { S.log.push({ t: Date.now(), mod: SES.mod, r: SES.erstRichtig, g: SES.fertig }); save(); } home(); };
  weiter();
}
function weiter() {
  $("#fb").innerHTML = "";
  if (!SES.tasks.length) return ende();
  SES.cur = SES.tasks.shift();
  $("#pb").style.width = (100 * SES.fertig / SES.gesamt) + "%";
  $("#stand").textContent = `${Math.min(SES.fertig + 1, SES.gesamt)} / ${SES.gesamt}`;
  const a = $("#aufgabe"); a.innerHTML = ""; a.className = "aufgabe";
  if (SES.cur.versuch > 0) a.insertAdjacentHTML("beforeend", `<div class="nochmal">🔁 Gleiche Regel, neue Aufgabe</div>`);
  RENDER[SES.cur.typ](a, SES.cur);
}
function antwort(res, html, hinweis) {
  const t = SES.cur, ok = res === "ok";
  rec(t.regel, ok);
  if (t.versuch === 0) { SES.fertig++; if (ok) SES.erstRichtig++; else SES.fehler.push(t.regel); }
  // Nachbessern über die Regel: neue Aufgabe zur selben Regel, nicht dieselbe Aufgabe
  if (!ok && !SES.test && t.versuch < 2) SES.tasks.splice(Math.min(3, SES.tasks.length), 0, { ...neueAufgabe(t.regel), versuch: t.versuch + 1 });
  ton(ok);
  const kopf = ok ? pick(["Right!", "Great!", "Well done!", "Super!", "Excellent!"]) : res === "fast" ? "Fast!" : "Leider falsch.";
  $("#fb").innerHTML = `<div class="feedback ${res}"><div class="fk">${ok ? "✓" : res === "fast" ? "≈" : "✗"} ${kopf}</div><div class="ft">${hinweis ? `<div class="hinw">💡 ${hinweis}</div>` : ""}${html || ""}</div>
    <div class="fbtns">${ok ? "" : `<button id="rbtn">Regel ansehen</button>`}<button class="pri" id="wbtn">Weiter →</button></div><div id="rbox"></div></div>`;
  $("#pb").style.width = (100 * SES.fertig / SES.gesamt) + "%";
  $$("#aufgabe input, #aufgabe button").forEach((e) => e.disabled = true);
  $("#aufgabe").classList.add("beantwortet");
  const b = $("#wbtn"); b.onclick = weiter; setTimeout(() => b.isConnected && b.focus(), 30);
  const rb = $("#rbtn"); if (rb) rb.onclick = () => { $("#rbox").innerHTML = regelKarte(t.regel); rb.remove(); };
  $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function ende() {
  const s = SES; S.log.push({ t: Date.now(), mod: s.mod, r: s.erstRichtig, g: s.gesamt }); save();
  const q = s.erstRichtig / s.gesamt; if (q >= 0.8) konfetti();
  const satz = q === 1 ? "Alles beim ersten Versuch richtig – brilliant!" : q >= 0.8 ? "Very good!" : q >= 0.5 ? "Gut! Die schwierigen Regeln kommen in der nächsten Runde wieder." : "Dranbleiben – mit jeder Runde wird es leichter.";
  const fehl = [...new Set(s.fehler)];
  $("#pb").style.width = "100%"; $("#fb").innerHTML = "";
  $("#aufgabe").innerHTML = `<div class="ende"><div class="gross">${s.erstRichtig} von ${s.gesamt}</div><div>beim ersten Versuch richtig</div><p>${satz}</p>
   ${fehl.length ? `<h3>Diese Regeln übst du noch:</h3><div class="regeln links">${fehl.map(regelKarte).join("")}</div>` : ""}
   <div class="btns mitte"><button id="nochR">Noch eine Runde</button><button class="pri" id="zurR">Zur Übersicht</button></div></div>`;
  $("#nochR").onclick = () => s.nochmal ? s.nochmal() : home();
  $("#zurR").onclick = home; setTimeout(() => $("#zurR")?.focus(), 30);
}

// ---------- Renderer ----------
const RENDER = {};
function feld(platz, breite) { return `<input class="luecke" type="text" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" style="width:${breite}ch" placeholder="${esc(platz || "")}">`; }
function mitPruefen(a, input, onSubmit) {
  a.insertAdjacentHTML("beforeend", `<div class="btns"><button class="pri" id="pruef">Prüfen</button></div>`);
  const los = () => { if (!input.value.trim()) { input.classList.add("wackel"); setTimeout(() => input.classList.remove("wackel"), 400); return; } onSubmit(input.value); };
  $("#pruef", a).onclick = los; input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); los(); } });
  setTimeout(() => input.focus(), 30);
}
function ergebnisText(r, erklaer) {
  if (r.res === "ok") return erklaer;
  if (r.res === "fast") return `${r.grund || ""} Richtig: <span class="wort">${diffHTML(r.eingabe, r.best)}</span><br>${erklaer}`;
  return erklaer;
}
RENDER.luecke = (a, t) => {
  const breite = Math.max(...t.accept.map((x) => x.trim().length)) + 3;
  a.insertAdjacentHTML("beforeend", `<div class="frage klein">Fill in the gap. ${t.hinweis ? `<span class="tag">${t.hinweis}</span>` : ""}</div><div class="satz">${t.bild ? `<span class="emo-gross">${t.bild}</span> ` : ""}${esc(t.satz).replace("___", feld("", breite))}</div>`);
  const i = $("input", a);
  mitPruefen(a, i, (v) => {
    let r = pruefe(v, t.accept, false);
    if (t.ichLuecke && /^'m not$/i.test(norm(v))) r = { res: "ok" };
    if (r.res === "fast" && fehlerHinweis(t.regel, t.satz.replace("___", v), t.ctx || {})) r = { ...r, res: "falsch" };
    i.classList.add(r.res === "ok" ? "ok" : "bad");
    antwort(r.res, ergebnisText(r, t.erklaer), r.res === "ok" ? "" : fehlerHinweis(t.regel, t.satz.replace("___", v), t.ctx || {}));
  });
};
RENDER.frei = (a, t) => {
  a.insertAdjacentHTML("beforeend", `<div class="frage">${t.frage}</div>${t.beispiel ? `<div class="beispiel">Beispiel: ${esc(t.beispiel)}</div>` : ""}
   ${t.bild ? `<div class="bildzeile">${figur(t.bild, t.bildName)}<div class="quelle">${esc(t.quelle)}</div></div>` : t.quelle ? `<div class="quelle">${esc(t.quelle)}</div>` : ""}
   <div class="satzfeld">${feld(t.satz ? "Schreib den ganzen Satz …" : "", t.satz ? 40 : 14).replace('class="luecke"', 'class="luecke lang"')}</div>`);
  const i = $("input", a);
  mitPruefen(a, i, (v) => {
    let r = pruefe(v, t.accept, t.satz);
    const h = r.res === "ok" ? "" : fehlerHinweis(t.regel, v, t.ctx || {});
    if (r.res === "fast" && (h || !kernStimmt(v, t))) r = { ...r, res: "falsch" };
    i.classList.add(r.res === "ok" ? "ok" : "bad");
    antwort(r.res, ergebnisText(r, t.erklaer), r.res === "falsch" ? h : "");
  });
};
RENDER.wahl = (a, t) => {
  const frage = t.satzLuecke ? `<div class="frage klein">Choose the right word.</div><div class="satz">${t.emoji ? `<span class="emo-gross">${t.emoji}</span> ` : ""}${esc(t.frage).replace("___", `<span class="gap">___</span>`)}</div>` : `<div class="frage">${t.frage}</div>`;
  a.insertAdjacentHTML("beforeend", `${frage}<div class="wahl ${t.opts.length === 3 ? "drei" : ""}">${t.opts.map(([o, r], i) => `<button data-r="${r ? 1 : 0}"><span class="nr">${i + 1}</span>${esc(o)}</button>`).join("")}</div>`);
  $$(".wahl button", a).forEach((b) => b.onclick = () => {
    const ok = b.dataset.r === "1"; b.classList.add(ok ? "ok" : "bad"); if (!ok) $(".wahl button[data-r='1']", a).classList.add("ok");
    if (t.satzLuecke) { const g = $(".gap", a); if (g) { g.textContent = t.richtig; g.classList.add("gefuellt"); } }
    antwort(ok ? "ok" : "falsch", t.erklaer, ok ? "" : fehlerHinweis(t.regel, b.textContent.slice(1), t.ctx || {}));
  });
};
RENDER.plural = (a, t) => {
  a.insertAdjacentHTML("beforeend", `<div class="frage">Write the plural.</div><div class="beispiel">Schreib nur das Wort in der Mehrzahl – das Zahlwort steht schon da.</div>
   <div class="plural"><div class="pl-teil"><div class="emo-gross">${t.emo}</div><div>one <b>${esc(t.sg)}</b></div></div><div class="pfeil">→</div>
   <div class="pl-teil"><div class="emo-gross">${Array(t.n).fill(t.emo).join("")}</div><div>${t.z} ${feld("", t.pl.length + 7)}</div></div></div>`);
  const i = $("input", a);
  mitPruefen(a, i, (v) => {
    // Hat sie das Zahlwort trotzdem dazugeschrieben, ist das nicht falsch
    const ohneZahl = norm(v).replace(new RegExp("^" + t.z + "\\s+", "i"), "");
    const r = pruefe(ohneZahl, [t.pl], false); i.classList.add(r.res === "ok" ? "ok" : "bad");
    const h = r.res === "ok" ? "" : pluralHinweis(t, norm(v).toLowerCase());
    if (r.res === "fast" && h) r.res = "falsch";
    antwort(r.res, ergebnisText(r, t.erklaer), h);
  });
};
RENDER.prep = (a, t) => {
  const subj = "It's", ende = `the ${t.obj}`;
  a.insertAdjacentHTML("beforeend", `<div class="frage">Where's the ${esc(t.ding.n)}?</div><div class="bildgross">${szene(t.prep.id, t.ding, t.obj)}</div>
   <div class="satz">${subj} ${t.tippen ? feld("", 13) : `<span class="gap">______</span>`} ${ende}.</div>
   ${t.tippen ? "" : `<div class="wahl prepwahl">${shuffle(PREPS).map((p) => `<button data-p="${p.id}">${p.wort}</button>`).join("")}</div>`}`);
  if (t.tippen) {
    const i = $("input", a);
    mitPruefen(a, i, (v) => { const r = pruefe(v, [t.prep.wort], false); i.classList.add(r.res === "ok" ? "ok" : "bad"); antwort(r.res, ergebnisText(r, `${subj} <b>${t.prep.wort}</b> ${ende}. – ${t.erklaer}`), r.res === "ok" ? "" : (/^(next|in front)$/i.test(norm(v)) ? "Achtung: <b>next to</b> und <b>in front of</b> bestehen aus mehreren Wörtern." : "")); });
  } else {
    $$(".prepwahl button", a).forEach((b) => b.onclick = () => {
      const ok = b.dataset.p === t.prep.id; b.classList.add(ok ? "ok" : "bad"); if (!ok) $(`.prepwahl button[data-p="${t.prep.id}"]`, a).classList.add("ok");
      const g = $(".gap", a); g.textContent = t.prep.wort; g.classList.add("gefuellt");
      antwort(ok ? "ok" : "falsch", `${subj} <b>${t.prep.wort}</b> ${ende}. – ${t.erklaer}`);
    });
  }
};
RENDER.bildwahl = (a, t) => {
  const ende = `the ${t.obj}`;
  a.insertAdjacentHTML("beforeend", `<div class="frage">Click the right picture:<br><span class="quelle inl">The ${esc(t.ding.n)} is ${t.prep.wort} ${ende}.</span></div>
   <div class="bildwahl">${t.bilder.map((b, i) => `<button data-p="${b.q.id}">${szene(b.q.id, t.ding, b.obj)}</button>`).join("")}</div>`);
  $$(".bildwahl button", a).forEach((b) => b.onclick = () => {
    const ok = b.dataset.p === t.prep.id; b.classList.add(ok ? "ok" : "bad"); if (!ok) $(`.bildwahl button[data-p="${t.prep.id}"]`, a).classList.add("ok");
    const gew = PREPS.find((p) => p.id === b.dataset.p);
    antwort(ok ? "ok" : "falsch", ok ? t.erklaer : `Dein Bild zeigt <b>${gew.wort}</b>. Gesucht war <b>${t.prep.wort}</b>.`);
  });
};
RENDER.ordnen = (a, t) => {
  const ziel = norm(t.ziel), woerter = ziel.split(" ").map((w) => (w === "I" ? w : w.toLowerCase()));
  let gew = [];
  a.insertAdjacentHTML("beforeend", `<div class="frage">Put the words in the right order.</div><div class="gebaut"></div><div class="kacheln">${shuffle(woerter.map((w, i) => [w, i])).map(([w, i]) => `<button data-i="${i}">${esc(w)}</button>`).join("")}</div><div class="btns"><button id="zur">↺ Neu</button><button class="pri" id="pruef" disabled>Prüfen</button></div>`);
  const zeichne = () => { $(".gebaut", a).innerHTML = gew.map((i) => `<span>${esc(woerter[i])}</span>`).join(" ") || `<span class="leer">Klicke die Wörter in der richtigen Reihenfolge an.</span>`; $$(".kacheln button", a).forEach((b) => b.disabled = gew.includes(+b.dataset.i)); $("#pruef", a).disabled = gew.length !== woerter.length; };
  $$(".kacheln button", a).forEach((b) => b.onclick = () => { gew.push(+b.dataset.i); zeichne(); });
  $("#zur", a).onclick = () => { gew = []; zeichne(); };
  $("#pruef", a).onclick = () => {
    const ein = gew.map((i) => woerter[i]).join(" "), ok = ein.toLowerCase() === ziel.toLowerCase();
    $(".gebaut", a).classList.add(ok ? "ok" : "bad");
    antwort(ok ? "ok" : "falsch", `Richtig: <b>${esc(t.ziel)}</b>`, ok ? "" : fehlerHinweis(t.regel, ein));
  };
  zeichne();
};
// gemeinsamer Ablauf für Aufgaben, bei denen ein ganzer Satz geschrieben wird
function satzEingabe(a, t, platz) {
  a.insertAdjacentHTML("beforeend", `<div class="satzfeld">${feld(platz, 40).replace('class="luecke"', 'class="luecke lang"')}</div>`);
  const i = $("input", a);
  mitPruefen(a, i, (v) => {
    let r = pruefe(v, t.accept, true);
    const h = r.res === "ok" ? "" : fehlerHinweis(t.regel, v, t.ctx || {});
    if (r.res === "fast" && (h || !kernStimmt(v, t))) r = { ...r, res: "falsch" };
    i.classList.add(r.res === "ok" ? "ok" : "bad");
    antwort(r.res, ergebnisText(r, t.erklaer), r.res === "falsch" ? h : "");
  });
}
RENDER.zaehlen = (a, t) => {
  a.insertAdjacentHTML("beforeend", `<div class="frage">Zähle und schreib das <b>Zahlwort</b> und die <b>Mehrzahl</b>.</div><div class="beispiel">Beispiel: book (4) → four books</div>
   <div class="zaehlbild">${Array(t.n).fill(`<span class="emo">${t.emo}</span>`).join("")}</div><div class="quelle">${esc(t.sg)} (${t.n})</div>
   <div class="satzfeld">${feld("z. B. four books", 26).replace('class="luecke"', 'class="luecke lang"')}</div>`);
  const i = $("input", a);
  mitPruefen(a, i, (v) => {
    let r = pruefe(v, t.accept, false); let h = "";
    const e = norm(v).toLowerCase();
    if (r.res !== "ok") {
      if (/^\d/.test(e)) { h = "Schreib die Zahl als <b>Wort</b>: " + ZAHLWORT[t.n] + "."; if (e.replace(/^\d+\s*/, "") === t.pl) r = { res: "fast", best: t.accept[0], eingabe: e, grund: "" }; }
      else if (e === t.pl) { h = `Schreib auch das Zahlwort davor: <b>${ZAHLWORT[t.n]} ${t.pl}</b>.`; r = { res: "fast", best: t.accept[0], eingabe: e, grund: "" }; }
      else if (!e.startsWith(ZAHLWORT[t.n] + " ")) h = `${t.n} heißt <b>${ZAHLWORT[t.n]}</b>.`;
      else { const w = e.slice(ZAHLWORT[t.n].length + 1); h = pluralHinweis(t, w); if (h) r = { ...r, res: "falsch" }; }
    }
    i.classList.add(r.res === "ok" ? "ok" : "bad"); antwort(r.res, ergebnisText(r, t.erklaer), h);
  });
};
RENDER.karte = (a, t) => {
  a.insertAdjacentHTML("beforeend", `<div class="frage">Wer hat was? Schreib den ganzen Satz.</div><div class="beispiel">Beispiel: Sheila 🐈 ✓ → Sheila has got a cat. · Ken 🎩 ✗ → Ken hasn't got a hat.</div>
   <div class="bildzeile">${figur(t.gesicht, t.name)}<div class="pfeil">→</div>${figur(t.emo)}<div class="haken ${t.hat ? "ja" : "nein"}">${t.hat ? "✓" : "✗"}</div></div>`);
  satzEingabe(a, t, `${t.name} …`);
};
RENDER.impbild = (a, t) => {
  a.insertAdjacentHTML("beforeend", `<div class="frage">Was sagt die Lehrerin? Schreib die Anweisung auf Englisch.</div>
   <div class="bildzeile"><div class="impicon">${t.emo}${t.neg ? `<span class="verbot">🚫</span>` : ""}</div><div class="quelle">${esc(t.de)}</div></div>`);
  satzEingabe(a, t, t.neg ? "Don't …" : "");
};
document.addEventListener("keydown", (e) => {
  if (!SES || e.target.tagName === "INPUT") return;
  if (/^[1-9]$/.test(e.key)) { const b = $$("#aufgabe .wahl button:not(:disabled)")[+e.key - 1]; if (b) b.click(); }
});

// ---------- Navigation ----------
function geh(z) {
  const [a, b] = z.split(":");
  if (a === "home") return home();
  if (a === "thema") return themaStart(b);
  if (a === "los") { const th = THEMEN.find((x) => x.id === b); const f = () => starte(th.name, themaAufgaben(b), { nochmal: f }); return f(); }
  if (a === "mix") { const f = () => starte("Alles gemischt", mixAufgaben(12), { nochmal: f }); return f(); }
  if (a === "schwach") { const f = () => starte("Schwierige Regeln", mixAufgaben(10, true), { nochmal: f }); return f(); }
  if (a === "probetest") { const f = () => starte("Probetest", probetest(), { test: true, nochmal: f }); return f(); }
  if (a === "zettel") return lernzettel();
  if (a === "ton") { S.ton = !S.ton; save(); return home(); }
  if (a === "reset") { if (confirm("Wirklich den ganzen Fortschritt löschen?")) { S = { r: {}, log: [], ton: S.ton }; save(); } return home(); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); geh(b.dataset.go); } });
home();
