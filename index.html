<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gymnasium Fitness</title>
<!-- Erzeugt von tools/bauen.js am 2026-08-10. Nicht direkt bearbeiten —
     Änderungen gehören in index.html und data/*.js. -->

<!-- Als App auf den Home-Bildschirm: iPad und iPhone starten dann ohne
     Safari-Leisten, mit eigenem Symbol. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Fitness">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#160b33">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
/* ══════════════════════════════════════════════════════════════════
   Gymnasium Fitness — Erscheinungsbild
   Ziel: fühlt sich an wie ein Spiel, nicht wie ein Schulbuch.
   Für eine Zehnjährige: kräftig und griffig, aber nicht kindisch.
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* Kosmisches Violett: Sternenhimmel, Kristalle, Polarlicht. */
  --bg:#160b33; --bg2:#221049;
  --card:#2d1560; --card2:#3d1f7d; --line:#5c2fb0;
  --txt:#f8f2ff; --dim:#c0a8ee;
  --de:#a855f7; --de-d:#7c2fc9;        /* Deutsch: Violett   */
  --en:#f472b6; --en-d:#c2478b;        /* Englisch: Pink     */
  --ok:#4ade80; --ok-d:#26a55c;        /* Richtig: Mint      */
  --no:#fb7185; --no-d:#d24457;
  --gold:#fbbf24; --gold-d:#d19405;
  --lila:#c084fc; --lila-d:#9333ea;
  --tuerkis:#38bdf8;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--txt);
  background:var(--bg);
  background-image:
    /* Sterne */
    radial-gradient(1.6px 1.6px at 12% 8%, #ffffffcc, transparent),
    radial-gradient(1.4px 1.4px at 28% 22%, #e9d5ffaa, transparent),
    radial-gradient(1.8px 1.8px at 47% 6%, #ffffffbb, transparent),
    radial-gradient(1.3px 1.3px at 63% 17%, #c4b5fd99, transparent),
    radial-gradient(1.7px 1.7px at 81% 4%, #ffffffcc, transparent),
    radial-gradient(1.4px 1.4px at 92% 26%, #f0abfc99, transparent),
    radial-gradient(1.5px 1.5px at 8% 41%, #ffffffaa, transparent),
    radial-gradient(1.3px 1.3px at 35% 52%, #ddd6fe88, transparent),
    radial-gradient(1.6px 1.6px at 71% 44%, #ffffff99, transparent),
    radial-gradient(1.4px 1.4px at 96% 58%, #e9d5ff88, transparent),
    radial-gradient(1.5px 1.5px at 19% 71%, #ffffff88, transparent),
    radial-gradient(1.3px 1.3px at 55% 83%, #c4b5fd77, transparent),
    radial-gradient(1.6px 1.6px at 87% 76%, #ffffff88, transparent),
    /* Polarlicht */
    radial-gradient(1200px 620px at 12% -10%, #7c3aed4d, transparent 62%),
    radial-gradient(1000px 560px at 96% 6%, #db277744, transparent 64%),
    radial-gradient(900px 700px at 50% 105%, #38bdf833, transparent 62%);
  background-attachment:fixed;
  font:16px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI Variable",
    "Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}

/* ---------- Kopfzeile ---------- */
.hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.hdr h1{font-size:21px;margin:0;flex:1;letter-spacing:-.4px;font-weight:800}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:15px;font-weight:800;white-space:nowrap;
  box-shadow:0 3px 0 #0003}
.chip.fire{color:var(--gold);border-color:#ffc53155}
.chip.fire.aktiv{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bar{height:14px;background:#0003;border-radius:99px;overflow:hidden;margin:6px 0 18px;
  border:2px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--lila),var(--en),var(--tuerkis));
  transition:width .8s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 0 14px #c084fc77}

/* ---------- Karten ---------- */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:2px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:14px;box-shadow:0 6px 0 #0002,0 12px 26px #0004;
  animation:rein .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes rein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.card p.sub{margin:0;color:var(--dim);font-size:15px}

/* ---------- Knöpfe: dick, mit Druckpunkt ---------- */
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:800;
  background:var(--de);color:#0b1030;text-align:center;font-size:17px;
  box-shadow:0 5px 0 var(--de-d);transition:transform .06s,box-shadow .06s;
  letter-spacing:-.2px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--de-d)}
.btn:disabled{opacity:.4;box-shadow:0 5px 0 #0003;cursor:default}
.btn:disabled:active{transform:none}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:0 5px 0 #1b1550}
.btn.ghost:active{box-shadow:0 1px 0 #1b1550}
.btn.ok{background:var(--ok);color:#052c18;box-shadow:0 5px 0 var(--ok-d)}
.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.sm{padding:12px;font-size:15px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- Lernpfad als Spielkarte ---------- */
.day{display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,var(--card),var(--bg2));
  border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;
  box-shadow:0 5px 0 #0002;transition:transform .08s,box-shadow .08s;position:relative}
.day:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}
.day.locked{opacity:.4;filter:saturate(.4)}
.day.done{border-color:#3ddc8455;background:linear-gradient(180deg,#1e4d3a,#17323a)}
.day.today{border-color:var(--gold);box-shadow:0 5px 0 #0002,0 0 0 4px #ffc53125}
/* Lektionsnummer als geschliffener Kristall statt schlichtem Kreis */
.dnum{width:58px;height:58px;flex:none;display:grid;place-items:center;
  font-weight:900;font-size:21px;background:var(--card2);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  position:relative;text-shadow:0 2px 4px #0006}
.dnum::after{content:"";position:absolute;inset:0;
  background:linear-gradient(145deg,#ffffff33,transparent 45%);
  clip-path:inherit;pointer-events:none}
.day.done .dnum{background:linear-gradient(160deg,#86efac,var(--ok));color:#04301a}
.day.today .dnum{background:linear-gradient(160deg,#fcd34d,var(--gold));color:#3d2800;
  animation:funkeln 2.8s ease-in-out infinite}
@keyframes funkeln{0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.06);filter:brightness(1.25) drop-shadow(0 0 10px #fbbf2488)}}
.dinfo{flex:1;min-width:0}
.dinfo b{display:block;font-size:16px;font-weight:800}
.dinfo span{color:var(--dim);font-size:14px;display:block}
.tags{display:flex;gap:6px;margin-top:5px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:800}
.tag.de{background:#5b8cff33;color:#9fbcff}
.tag.en{background:#ff914233;color:#ffbf91}

/* ---------- Übungen ---------- */
.q{font-size:21px;font-weight:800;margin:0 0 10px;line-height:1.35;letter-spacing:-.3px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);
  border:3px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;
  font-size:17px;font-weight:600;box-shadow:0 4px 0 #1b1550;
  transition:transform .07s,box-shadow .07s,border-color .12s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1550}
.opt.sel{border-color:var(--de);background:#5b8cff22}
.opt.good{border-color:var(--ok);background:#3ddc8422;box-shadow:0 4px 0 var(--ok-d)}
.opt.bad{border-color:var(--no);background:#ff5c7222;box-shadow:0 4px 0 var(--no-d)}
input[type=text],textarea{width:100%;background:#0f0b2b;border:3px solid var(--line);
  border-radius:18px;padding:16px;color:var(--txt);font:inherit;font-size:18px;
  font-weight:600;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--de);
  box-shadow:0 0 0 4px #5b8cff2a}
.spellwort{font-size:38px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(180deg,#fff,#e9d5ff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;padding:6px 0}
textarea{resize:none;min-height:76px;line-height:1.6;overflow:hidden}
#eingabe{font-size:19px}
.uml{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.uml button{background:var(--card2);border:2px solid var(--line);border-radius:12px;
  padding:9px 14px;font-size:18px;min-width:46px;font-weight:700;
  box-shadow:0 3px 0 #1b1550}
.uml button:active{transform:translateY(2px);box-shadow:0 1px 0 #1b1550}

/* Wort-Chips */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.chip2{background:var(--card2);border:3px solid var(--line);border-radius:15px;
  padding:11px 15px;font-size:17px;font-weight:700;box-shadow:0 4px 0 #1b1550;
  transition:transform .07s,box-shadow .07s}
.chip2:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1550}
.chip2.sel{border-color:var(--de);background:#5b8cff2e;transform:scale(1.04)}
.chip2.good{border-color:var(--ok);background:#3ddc8426;box-shadow:0 4px 0 var(--ok-d)}
.chip2.bad{border-color:var(--no);background:#ff5c7226;box-shadow:0 4px 0 var(--no-d)}
.chip2.used{opacity:.22}
.slot{min-height:62px;background:#0f0b2b;border:3px dashed var(--line);
  border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}

/* Körbe */
.buckets{display:flex;gap:10px;margin-top:14px}
.bucket{flex:1;background:#0f0b2b;border:3px dashed var(--line);border-radius:18px;
  padding:11px;min-height:110px;transition:border-color .15s,background .15s}
.bucket.act{border-color:var(--de);background:#5b8cff14}
.bucket b{display:block;font-size:13px;color:var(--dim);margin-bottom:9px;
  text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.bucket .chip2{width:100%;text-align:center;padding:9px;font-size:15px;margin-bottom:7px}
.pairs{display:flex;gap:10px}
.pairs>div{flex:1}

/* ---------- Rückmeldung: kräftig, von unten ---------- */
.fb{border-radius:20px;padding:16px;margin-top:14px;font-size:16px;font-weight:600;
  animation:hoch .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes hoch{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fb.good{background:#3ddc841f;border:3px solid var(--ok)}
.fb.bad{background:#ff5c721f;border:3px solid var(--no)}
.fb b{display:block;margin-bottom:5px;font-size:20px;font-weight:900}
.fb.good b{color:#7bf0ad}
.fb.bad b{color:#ff9aa8}
.strat{margin-top:10px;padding-top:10px;border-top:2px solid #ffffff1a;
  font-size:15px;color:var(--dim)}

/* ---------- Diktat ---------- */
.dict-sent{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px;align-items:center}
.dict-sent button{background:var(--card2);border:2px solid var(--line);border-radius:15px;
  padding:12px 15px;font-size:16px;font-weight:700;white-space:nowrap;flex:1 1 auto;
  min-width:0;box-shadow:0 4px 0 #1b1550}
.dict-sent button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1550}
.diff{background:#0f0b2b;border-radius:16px;padding:14px;margin-top:11px;
  line-height:2.2;font-size:17px;border:2px solid var(--line)}
.w-ok{color:#7bf0ad}
.w-typo{color:var(--gold);text-decoration:underline wavy}
.w-bad{color:#ff9aa8;font-weight:800}
.w-bad small{color:#7bf0ad;font-weight:600}
.lsatz{font-size:19px;line-height:2.5;margin:14px 0;font-weight:600}
input.gap{display:inline-block;width:auto;min-width:96px;padding:6px 11px;
  border-radius:12px;border:3px solid var(--de);background:#0f0b2b;
  font:inherit;font-size:18px;font-weight:700;color:var(--txt);text-align:center}
.tonhinweis{background:#ffc5311a;border:2px solid var(--gold);border-radius:16px;
  padding:12px;margin-bottom:11px;font-size:15px}

/* ---------- Abzeichen, Banner, Zeilen ---------- */
.badge{display:flex;gap:13px;align-items:center;background:var(--card2);
  border-radius:16px;padding:13px;margin-bottom:9px;border:2px solid var(--line)}
.badge.off{opacity:.28;filter:grayscale(1)}
.badge i{font-size:30px;font-style:normal}
.badge b{display:block;font-size:16px;font-weight:800}
.badge span{color:var(--dim);font-size:14px}
.banner{background:linear-gradient(135deg,var(--lila),#5b3ad4);
  border:3px solid #c690ff;border-radius:var(--r);padding:17px;margin-bottom:14px;
  box-shadow:0 6px 0 #0002,0 0 30px #b06bff33}
.wk{display:flex;justify-content:space-between;align-items:center;font-size:15px;
  padding:10px 0;border-bottom:2px solid #ffffff12;gap:10px}
.wk:last-child{border:none}
.wk b{font-weight:700}
.mini{height:12px;width:88px;background:#0004;border-radius:99px;overflow:hidden;
  flex:none;border:2px solid var(--line)}
.mini>i{display:block;height:100%;border-radius:99px;
  transition:width .8s cubic-bezier(.2,.9,.3,1)}
.center{text-align:center}
.big{font-size:64px;margin:8px 0;line-height:1;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.muted{color:var(--dim);font-size:15px}
.hidden{display:none}

/* ---------- Lernkarten ---------- */
.lk{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:3px solid var(--line);border-radius:var(--r);padding:22px 18px;
  margin-bottom:14px;min-height:220px;box-shadow:0 6px 0 #0002,0 12px 26px #0004;
  animation:rein .35s cubic-bezier(.2,.9,.3,1) both}
.lk .kicker{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:9px}
.lk h2{margin:0 0 13px;font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.4px}
.lk p{margin:0 0 13px;font-size:17px;line-height:1.6}
.merke{background:#5b8cff1f;border-left:5px solid var(--de);border-radius:14px;
  padding:13px 15px;font-size:17px;font-weight:600}
.merke b{color:#9fbcff}
.bsp{display:flex;gap:12px;padding:11px 0;border-bottom:2px solid #ffffff12;
  font-size:16px;align-items:baseline}
.bsp:last-child{border:none}
.bsp .l{flex:0 0 42%;color:var(--dim)}
.bsp .r{flex:1;font-weight:600}
.wrd{display:flex;align-items:center;gap:12px;background:var(--card2);
  border:2px solid var(--line);border-radius:15px;padding:13px;margin-bottom:8px;
  width:100%;text-align:left;box-shadow:0 3px 0 #1b1550}
.wrd:active{transform:translateY(2px);box-shadow:0 1px 0 #1b1550}
.wrd b{font-size:18px;flex:0 0 42%;font-weight:800}
.wrd span{color:var(--dim);font-size:15px;flex:1}
.wrd i{font-style:normal;opacity:.6;font-size:19px}
.probe-a{background:#3ddc841f;border:3px solid var(--ok);border-radius:16px;
  padding:15px;margin-top:13px;animation:hoch .3s both}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0 6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;
  transition:width .25s,background .25s}
.dots i.on{background:var(--gold);width:26px;border-radius:99px}

/* ---------- Overlay ---------- */
.ovl{position:fixed;inset:0;background:#0a0722d9;z-index:50;
  display:flex;align-items:flex-end;justify-content:center;padding:14px;
  backdrop-filter:blur(3px);animation:rein .2s both}
.ovl>div{background:var(--bg2);border:3px solid var(--line);border-radius:var(--r);
  padding:18px;max-width:620px;width:100%;max-height:86vh;overflow:auto}

/* ---------- Kristall ---------- */
.kristall{display:block;margin:0 auto;
  filter:drop-shadow(0 8px 22px #7c3aed66);
  animation:schweben 4.5s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-9px) rotate(1.5deg)}}
.kristall .k-funken{animation:blinken 3.2s ease-in-out infinite}
@keyframes blinken{0%,100%{opacity:.25}50%{opacity:1}}
.jubel .kristall{animation:jubeln .8s cubic-bezier(.2,1.6,.4,1),
  schweben 4.5s ease-in-out .8s infinite}
@keyframes jubeln{0%{transform:scale(.4) rotate(-18deg);opacity:0}
  60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.kmini{width:34px;height:44px;flex:none}
.kmini .kristall{animation:none;filter:drop-shadow(0 3px 8px #7c3aed88);margin:0}

/* ---------- Konfetti ---------- */
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.kf{position:absolute;width:11px;height:16px;border-radius:3px;
  animation:fall linear forwards}
@keyframes fall{
  from{transform:translateY(-20px) rotate(0)}
  to{transform:translateY(105vh) rotate(720deg);opacity:.7}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ── data/regeln.js ── */
/* Gymnasium Fitness — Regel-Taxonomie
 *
 * Jede Übungsaufgabe verweist über `rules` auf eine oder mehrere dieser Regeln.
 * Der adaptive Loop rechnet ausschließlich auf dieser Ebene: Mastery, Schwächen,
 * Wiederholung und die Wochenanalyse beziehen sich immer auf eine Regel-ID.
 *
 * Felder:
 *   id        eindeutige Regel-ID, dreistufig: fach.bereich.regel
 *   fach      "de" | "en"
 *   bereich   Gruppierung für Auswertungen und Reports
 *   name      Klartext für Kind und Elternreport
 *   introDay  Tag im 21-Tage-Plan, ab dem die Regel als "eingeführt" gilt.
 *             Vorher zählen Fehler NICHT als Schwäche.
 *   strategie kurzer Merksatz, wird bei Fehlern eingeblendet
 */

const REGELN = [

  /* ===================== DEUTSCH — Wortarten ===================== */
  { id: "de.gr.wortart.nomen", fach: "de", bereich: "Wortarten", introDay: 1,
    name: "Nomen erkennen",
    strategie: "Vor ein Nomen passt ein Artikel: der, die, das." },
  { id: "de.gr.wortart.artikel", fach: "de", bereich: "Wortarten", introDay: 1,
    name: "Artikel (Begleiter)",
    strategie: "Bestimmt: der, die, das. Unbestimmt: ein, eine." },
  { id: "de.gr.wortart.verb", fach: "de", bereich: "Wortarten", introDay: 1,
    name: "Verben erkennen",
    strategie: "Ein Verb sagt, was jemand tut. Man kann es beugen: ich laufe, du läufst." },
  { id: "de.gr.wortart.adjektiv", fach: "de", bereich: "Wortarten", introDay: 2,
    name: "Adjektive erkennen",
    strategie: "Ein Adjektiv sagt, WIE etwas ist. Frage: Wie ist es?" },
  { id: "de.gr.adjektiv.steigerung", fach: "de", bereich: "Wortarten", introDay: 2,
    name: "Adjektive steigern",
    strategie: "schnell – schneller – am schnellsten. Achtung bei gut, viel, gern." },
  { id: "de.gr.wortart.pronomen", fach: "de", bereich: "Wortarten", introDay: 3,
    name: "Pronomen (Fürwörter)",
    strategie: "Ein Pronomen steht STATT eines Nomens: Anna → sie." },
  { id: "de.gr.wortart.praeposition", fach: "de", bereich: "Wortarten", introDay: 3,
    name: "Präpositionen (Vorwörter)",
    strategie: "Präpositionen sagen, wo oder wann etwas ist: auf, unter, vor, nach." },

  /* ===================== DEUTSCH — Nomen und Fälle ===================== */
  { id: "de.gr.nomen.faelle", fach: "de", bereich: "Fälle", introDay: 4,
    name: "Die vier Fälle",
    strategie: "1. Fall: Wer oder was? · 2. Fall: Wessen? · 3. Fall: Wem? · 4. Fall: Wen oder was?" },

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   1. STATE
   ══════════════════════════════════════════════════════════════════ */

const KEY = "gymfit_v2";
const ALPHA = 0.3;          // Lerngewicht: wie stark die neueste Antwort zählt
const DECAY = 0.02;         // Zerfall pro Tag ohne Übung
const SCHWELLE = 0.7;       // darunter gilt eine Regel als Schwäche
const MIN_SEEN = 4;         // erst ab so vielen Begegnungen wird gewertet

/* Eine Lektion ist ein Thema, kein Tag. Sie wird so lange wiederholt,
   bis sie sitzt — mindestens zweimal an zwei verschiedenen Tagen. */
const MIN_DURCHGAENGE = 2;
const MIN_TAGE        = 2;    // erzwingt Abstand: nie zwei Durchgänge am selben Tag
const MAX_DURCHGAENGE = 5;    // Obergrenze, damit sich niemand festbeißt
const GRAD_MASTERY    = 0.75; /* ab hier gilt eine Lektion als gemeistert.
                                 Bewusst nicht höher: die Beherrschung pendelt sich
                                 auf die Trefferquote ein, und 75 % richtig ist bei
                                 neuem Stoff für ein zehnjähriges Kind gut. */
const AUFGABEN_PRO_DURCHGANG = 10;

/* Testnaht: erlaubt der Verlaufssimulation, Tage vorzuspulen.
   Im Browser immer null — dort gilt das echte Datum. */
let _datumHook = null;
const heute = () => _datumHook ? _datumHook() : new Date().toISOString().slice(0, 10);
const tageZwischen = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function leerState() {
  return {
    version: 1, xp: 0, level: 1,
    streak: { count: 0, lastDay: null, jokersLeft: 1, wochenStart: heute() },
    completed: {}, rules: {}, srs: [], log: [], badges: [],
    /* Fortschritt je Lektion:  { passes, tage[], gesehen[] } */
    lektionen: {},
    /* Diktate:  { erledigt[], letzterTag } */
    diktat: { erledigt: [], letzterTag: null },
    stats: { perfekteDiktate: 0, sessions: 0 },
    settings: { satzzeichenSprechen: true, tempo: 0.85, umlautLeiste: false, klang: true },
    lastExport: null, schwaechenBeiExport: 0, startDatum: heute()
  };
}

/* Alle Speicherschlüssel, die es je gab — neueste zuerst. Wird die App
   aktualisiert und ändert sich die Struktur, findet sie so den letzten Stand
   trotzdem und rechnet ihn um, statt bei null anzufangen.

   Muss VOR dem ersten laden() stehen — sonst greift die Umwandlung ins Leere. */
const ALTE_KEYS = ["gymfit_v1"];
const BACKUP_KEY = KEY + "_backup";
/* Ein importiertes Aufgabenpaket wurde bisher nur als Skript-Element in die
   laufende Seite gehängt. Nach dem Neuladen war es weg — und der Fortschritt verwies auf
   Aufgaben-IDs, die es nicht mehr gab. Deshalb liegt es jetzt im Gerätespeicher
   und wird beim Start wieder eingespielt. */
const PAKET_KEY = KEY + "_paket";

/**
 * Doppelte Aufgaben entfernen, erste Fassung gewinnt.
 *
 * Ein Paket hängt Aufgaben an die Lektionen an. Wird dasselbe Paket zweimal
 * eingespielt — beim Import und dann noch einmal beim Start —, stünde jede
 * Aufgabe doppelt im Vorrat und würde doppelt so oft gezogen.
 */
function entdoppeln() {
  let entfernt = 0;
  for (const q of [LEKTIONEN_DE, LEKTIONEN_EN]) {
    for (const k in q) {
      const gesehen = new Set();
      q[k].items = (q[k].items || []).filter(it => {
        if (gesehen.has(it.id)) { entfernt++; return false; }
        gesehen.add(it.id);
        return true;
      });
    }
  }
  return entfernt;
}

/** Ein gespeichertes Aufgabenpaket wieder einspielen. */
function paketAnwenden() {
  let roh;
  try { roh = localStorage.getItem(PAKET_KEY); } catch (e) { return false; }
  if (!roh) return false;
  try {
    const sc = document.createElement("script");
    sc.textContent = roh;
    document.body.appendChild(sc);
    entdoppeln();
    return true;
  } catch (e) {
    console.warn("Paket konnte nicht geladen werden:", e);
    return false;
  }
}

/** Wie viele Aufgaben stammen aus einem Paket? Für die Anzeige im Profil. */
function paketInfo() {
  try {
    const roh = localStorage.getItem(PAKET_KEY);
    if (!roh) return null;
    const m = roh.match(/id:\s*"/g);
    return { zeichen: roh.length, aufgaben: m ? m.length : 0 };
  } catch (e) { return null; }
}

let S = laden();

function laden() {
  try {
    let raw = localStorage.getItem(KEY), herkunft = KEY;

    // Nichts unter dem aktuellen Schlüssel? Dann in älteren nachsehen.
    if (!raw) {
      for (const alt of ALTE_KEYS) {
        const a = localStorage.getItem(alt);
        if (a) { raw = a; herkunft = alt; break; }
      }
    }
    if (!raw) return leerState();

    const gespeichert = JSON.parse(raw);

    /* Vor jeder Umwandlung eine Sicherung anlegen. Geht beim Umrechnen etwas
       schief, sind Wochen an Übung nicht verloren — sie lassen sich im Profil
       wiederherstellen. */
    if (herkunft !== KEY) {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({
          gesichertAm: new Date().toISOString(), ausSchluessel: herkunft, daten: gespeichert
        }));
      } catch (e) {}
    }

    const s = Object.assign(leerState(), gespeichert);
    // Einstellungen zusammenführen, damit neue Optionen ihren Standard behalten
    s.settings = Object.assign(leerState().settings, gespeichert.settings || {});
    return umwandeln(s, gespeichert);
  } catch (e) {
    return leerState();
  }
}

/**
 * Alte Stände auf die aktuelle Struktur bringen.
 *
 * Hier kommt bei künftigen Umbauten die Umrechnung hinein — statt den
 * Speicherschlüssel zu wechseln und damit den Fortschritt wegzuwerfen.
 */
function umwandeln(s, roh) {
  // v1 kannte nur Tages-Lektionen ("de-01") und keine Durchgänge.
  if (roh.completed && !roh.lektionen) {
    s.lektionen = {};
    for (const alt in roh.completed) {
      const m = alt.match(/^(de|en)-0?(\d+)$/);
      if (!m) continue;
      const neu = `${m[1]}-l${m[2]}`;
      s.lektionen[neu] = {
        passes: 1, tage: [roh.completed[alt].date || heute()], gesehen: []
      };
    }
  }
  if (!s.diktat) s.diktat = { erledigt: [], letzterTag: null };
  if (!s.lektionen) s.lektionen = {};
  return s;
}

/** Gibt es eine Sicherung aus einer Umwandlung? */
function backupInfo() {
  try {
    const b = localStorage.getItem(BACKUP_KEY);
    return b ? JSON.parse(b) : null;
  } catch (e) { return null; }
}

function backupWiederherstellen() {
  const b = backupInfo();
  if (!b) return;
  if (!confirm("Den gesicherten Stand von " + b.gesichertAm.slice(0, 10) +
               " wiederherstellen? Der aktuelle Fortschritt wird ersetzt.")) return;
  localStorage.setItem(KEY, JSON.stringify(b.daten));
  location.reload();
}

function sichern() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* ══════════════════════════════════════════════════════════════════
   2. ADAPTIVER LOOP — Mastery, Schwächen, Auswahl
   ══════════════════════════════════════════════════════════════════ */

const pad = n => String(n).padStart(2, "0");

/* ---------- Lektionen ---------- */

const LEK = fach => fach === "de" ? LEKTIONEN_DE : LEKTIONEN_EN;
const lektionsIds = fach =>
  Object.keys(LEK(fach)).sort((a, b) => (LEK(fach)[a].nr || 0) - (LEK(fach)[b].nr || 0));

/** Alle Regeln, die in einer Lektion vorkommen. */
function lektionsRegeln(lekId, fach) {
  const lek = LEK(fach)[lekId];
  const set = new Set();
  (lek?.items || []).forEach(i => (i.rules || []).forEach(r => set.add(r)));
  return [...set];
}

/**
 * Durchschnittliche Beherrschung der Regeln einer Lektion.
 *
 * Gemittelt wird nur über Regeln, die tatsächlich schon drankamen. Eine noch
 * nie geübte Regel als „null Prozent" zu zählen wäre falsch — sie zöge den
 * Schnitt so weit herunter, dass die Lektion nie graduieren könnte.
 */
function lektionsMastery(lekId, fach) {
  const geuebt = lektionsRegeln(lekId, fach).filter(r => (S.rules[r]?.seen || 0) > 0);
  if (!geuebt.length) return 0;
  return geuebt.reduce((a, r) => a + S.rules[r].mastery, 0) / geuebt.length;
}

/**
 * Status einer Lektion.
 *
 * Gemeistert ist sie, wenn sie mindestens zweimal an zwei verschiedenen
 * Tagen geübt wurde UND die Regeln sitzen. Wer sich festbeißt, wird nach
 * sechs Durchgängen trotzdem weitergelassen — dann übernimmt der
 * Schwächenpool, der die Regeln ohnehin weiter einstreut.
 */
function lektionsStatus(lekId, fach) {
  const p = S.lektionen[lekId] || { passes: 0, tage: [], gesehen: [] };
  const mastery = lektionsMastery(lekId, fach);
  const regeln = lektionsRegeln(lekId, fach);

  // Jede Regel der Lektion muss mindestens zweimal drangekommen sein …
  const alleGeuebt = regeln.every(r => (S.rules[r]?.seen || 0) >= 2);
  // … und höchstens eine darf noch richtig wackeln.
  const wacklig = regeln.filter(r => (S.rules[r]?.mastery ?? 0) < 0.6).length;

  const geschafft = p.passes >= MIN_DURCHGAENGE &&
                    (p.tage || []).length >= MIN_TAGE &&
                    mastery >= GRAD_MASTERY &&
                    alleGeuebt && wacklig <= 1;
  const ausgereizt = p.passes >= MAX_DURCHGAENGE;
  return {
    passes: p.passes, tage: p.tage || [], gesehen: p.gesehen || [],
    mastery, fertig: geschafft || ausgereizt, ausgereizt,
    heuteSchon: (p.tage || []).includes(heute())
  };
}

/**
 * Fortschrittsbalken einer Lektion — nur fürs Anzeigen.
 *
 * Bewusst nicht dasselbe wie `lektionsMastery`: Lektionen teilen sich Regeln
 * (Lektion 2 übt nebenbei Nomen aus Lektion 1). Der Durchschnitt über die
 * bereits geübten Regeln würde deshalb Fortschritt in einer Lektion anzeigen,
 * die noch nie gelaufen ist. Vor dem ersten Durchgang bleibt der Balken leer.
 */
function anzeigeFortschritt(lekId, fach) {
  const p = S.lektionen[lekId];
  if (!p || !p.passes) return 0;
  return lektionsMastery(lekId, fach);
}

/** Die Lektion, an der gerade gearbeitet wird — die erste unfertige. */
function aktiveLektion(fach) {
  for (const id of lektionsIds(fach)) {
    if (!(LEK(fach)[id].items || []).length) continue;
    if (!lektionsStatus(id, fach).fertig) return id;
  }
  return null;   // alles gemeistert
}

/** Freigeschaltet ist eine Lektion, wenn die vorige mindestens einmal lief. */
function freigeschaltet(lekId, fach) {
  const ids = lektionsIds(fach);
  const i = ids.indexOf(lekId);
  if (i <= 0) return true;
  return (S.lektionen[ids[i - 1]]?.passes || 0) >= 1;
}

/**
 * Die nächste Lektion, die heute noch keinen Durchgang hatte.
 *
 * Für freiwilliges Weiterarbeiten: Neues Material ist anderes Material —
 * dagegen spricht didaktisch nichts. Den Abstand erzwingt die Graduierung
 * ohnehin weiter, weil sie zwei verschiedene Übungstage verlangt.
 */
function naechsteOffene(fach) {
  for (const id of lektionsIds(fach)) {
    if (!(LEK(fach)[id].items || []).length) continue;
    const st = lektionsStatus(id, fach);
    if (!st.fertig && !st.heuteSchon && freigeschaltet(id, fach)) return id;
  }
  return null;
}

/** Was heute ansteht. */
function tagesplan() {
  const de = aktiveLektion("de"), en = aktiveLektion("en");
  return {
    de, en,
    deOffen: de && !lektionsStatus(de, "de").heuteSchon,
    enOffen: en && !lektionsStatus(en, "en").heuteSchon,
    diktatOffen: S.diktat.letzterTag !== heute(),
    fertig: (!de || lektionsStatus(de, "de").heuteSchon) &&
            (!en || lektionsStatus(en, "en").heuteSchon) &&
            S.diktat.letzterTag === heute()
  };
}

/** Programmtag — nur noch für die Anzeige, nicht mehr für die Steuerung. */
function programmTag() {
  return S.startDatum ? tageZwischen(S.startDatum, heute()) + 1 : 1;
}

/** Zerfall anwenden: Wissen verblasst leicht, damit es wieder auftaucht. */
function zerfallAnwenden() {
  const h = heute();
  for (const id in S.rules) {
    const r = S.rules[id];
    if (!r.lastSeen) continue;
    const d = tageZwischen(r.lastSeen, h);
    if (d > 0) {
      r.mastery = Math.max(0, r.mastery - DECAY * d);
      r.lastSeen = h;
    }
  }
}

/** Mastery einer Regel nach einer Antwort fortschreiben. */
/**
 * Beherrschung fortschreiben.
 *
 * `ergebnis` ist normalerweise true oder false. Ein Diktat liefert aber eine
 * Quote: Wer 22 von 24 Wörtern richtig schreibt, hat nicht versagt. Als
 * Alles-oder-nichts gewertet wäre ein einziger Fehler dasselbe wie ein leeres
 * Blatt — und die Diagnose, auf der die ganze Anpassung beruht, wäre falsch.
 */
function masteryUpdate(regelId, ergebnis) {
  const r = S.rules[regelId] || (S.rules[regelId] = {
    seen: 0, correct: 0, mastery: 0.5, lastSeen: null, days: 0, tage: []
  });
  const q = Math.min(1, Math.max(0, typeof ergebnis === "number" ? ergebnis : (ergebnis ? 1 : 0)));
  r.seen++;
  if (q >= 0.999) r.correct++;
  r.mastery = r.mastery + ALPHA * (q - r.mastery);
  r.mastery = Math.min(1, Math.max(0, r.mastery));
  const h = heute();
  if (r.lastSeen !== h) { r.tage = r.tage || []; if (!r.tage.includes(h)) r.tage.push(h); }
  r.lastSeen = h;
  r.days = (r.tage || []).length;
}

/**
 * Gilt eine Regel als eingeführt?
 *
 * Ja, sobald sie in den Lernkarten einer Lektion erklärt wurde, die
 * mindestens einmal gelaufen ist. Vorher ist ein Fehler kein Defizit,
 * sondern schlicht Unkenntnis — und darf nicht als Schwäche zählen.
 */
function regelEingefuehrt(regelId) {
  for (const lekId in LERNKARTEN) {
    if (!(S.lektionen[lekId]?.passes >= 1)) continue;
    if (LERNKARTEN[lekId].some(k => (k.rules || []).includes(regelId))) return true;
  }
  return false;
}

/** Regeln, die als echte Schwäche gelten — mit allen drei Bedingungen. */
function schwaechen() {
  return Object.entries(S.rules)
    .filter(([id, r]) => {
      if (!REGEL_MAP[id]) return false;
      if (!regelEingefuehrt(id)) return false;     // noch nicht gelernt ≠ Schwäche
      if (r.seen < MIN_SEEN) return false;         // zu wenig Daten
      return r.mastery < SCHWELLE;
    })
    .sort((a, b) => a[1].mastery - b[1].mastery)
    .map(([id, r]) => ({ id, ...r, def: REGEL_MAP[id] }));
}

/** Regeln, die als gemeistert gelten. */
function gemeistert() {
  return Object.entries(S.rules)
    .filter(([id, r]) => r.mastery >= 0.9 && r.seen >= 10 && (r.days || 0) >= 3)
    .map(([id]) => id);
}

/* --- Aufgabenpool über alle Lektionen --- */
function alleItems(fach) {
  const q = fach === "de" ? LEKTIONEN_DE : LEKTIONEN_EN;
  const out = [];
  for (const k in q) (q[k].items || []).forEach(it => out.push(it));
  return out;
}
function itemById(id) {
  return [...alleItems("de"), ...alleItems("en")].find(i => i.id === id);
}

/**
 * Schwierigkeitsstufe einer Aufgabe — aus dem Typ abgeleitet.
 *   1 Wiedererkennen · 2 Anwenden · 3 Selbst produzieren
 * An einer Aufgabe mit `difficulty` überschreibbar.
 */
function schwierigkeit(it) {
  if (it.difficulty) return it.difficulty;
  return { mc: 1, tf: 1, match: 1, sort: 1,
           tap: 2, order: 2,
           type: 3, fehler: 3, diktat: 3,
           /* spell zeigt das Wort vorher — geführtes Produzieren, Stufe 2.
              Auf Stufe 3 käme es erst im zweiten Durchgang, und gerade die
              Rechtschreibung soll sie von Anfang an üben. */
           spell: 2 }[it.type] || 2;
}

/** Welche Stufen in welchem Durchgang drankommen. */
function stufenFuerDurchgang(n) {
  if (n <= 1) return [1, 2];        // erster Kontakt: erkennen und anwenden
  if (n === 2) return [1, 2, 3];    // gemischt
  return [2, 3];                    // ab dem dritten: selbst produzieren
}

/**
 * Einen Durchgang zusammenstellen.
 *
 * Der Durchgang bestimmt die Schwierigkeit: erst Wiedererkennen, später
 * selbst schreiben. Innerhalb der Lektion kommen Aufgaben dran, die sie noch
 * nicht gesehen hat — deshalb braucht eine Lektion rund 35 Aufgaben. Dazu
 * Schwächen aus früheren Lektionen und fällige Wiederholungen.
 */
function baueSession(lekId, fach) {
  const lek = LEK(fach)[lekId];
  if (!lek) return [];

  const st = lektionsStatus(lekId, fach);
  const stufen = stufenFuerDurchgang(st.passes + 1);
  const gesehen = new Set(st.gesehen);
  const LAENGE = lek.anzahlUebungen ?? AUFGABEN_PRO_DURCHGANG;

  const gewaehlt = [];
  const proRegel = {};
  const nimm = (it, pflicht) => {
    if (!it || gewaehlt.some(g => g.id === it.id)) return false;
    const rs = it.rules || [];
    if (!pflicht && rs.some(r => (proRegel[r] || 0) >= 3)) return false;
    rs.forEach(r => proRegel[r] = (proRegel[r] || 0) + 1);
    gewaehlt.push(it);
    return true;
  };

  /* 1. Aufgaben der Lektion — passende Stufe, Ungesehenes zuerst. */
  const eigene = [...(lek.items || [])];
  const passend = eigene.filter(i => stufen.includes(schwierigkeit(i)));
  const frisch  = shuffle(passend.filter(i => !gesehen.has(i.id)));
  const bekannt = shuffle(passend.filter(i => gesehen.has(i.id)));
  const reserve = shuffle(eigene.filter(i => !passend.includes(i)));
  const ziel = Math.round(LAENGE * 0.75);
  [...frisch, ...bekannt, ...reserve].forEach(it => {
    if (gewaehlt.length < ziel) nimm(it, true);
  });

  /* 2. Schwächen aus früheren Lektionen einstreuen — gewichtet gezogen,
        nicht stur die schlimmste Regel. */
  const schw = schwaechen().filter(s => s.def.fach === fach);
  const pool = alleItems(fach);
  let versuche = 0;
  while (gewaehlt.length < LAENGE - 2 && schw.length && versuche++ < 30) {
    const s = schw[Math.floor(Math.pow(Math.random(), 1.6) * schw.length)];
    const kand = pool.filter(it => (it.rules || []).includes(s.id));
    // Dieselbe Regel, aber möglichst in einem neuen Gewand: ungesehene
    // Aufgaben zuerst. Sonst sieht sie dieselbe Frage mehrfach.
    const neu = kand.filter(it => !gesehen.has(it.id));
    const quelle = neu.length ? neu : kand;
    if (quelle.length) nimm(quelle[Math.floor(Math.random() * quelle.length)]);
  }

  /* 3. Fällige Wiederholungen. */
  const h = heute();
  S.srs.filter(e => e.due <= h).forEach(e => {
    if (gewaehlt.length < LAENGE) nimm(itemById(e.item));
  });

  /* 4. Rest mit Aufgaben der Lektion auffüllen. */
  eigene.forEach(it => { if (gewaehlt.length < LAENGE) nimm(it, true); });

  /* Leitplanke: nie mit einer Schwäche-Aufgabe starten. */
  const schwIds = new Set(schw.map(s => s.id));
  const istSchwer = it => (it.rules || []).some(r => schwIds.has(r));
  if (gewaehlt.length > 1 && istSchwer(gewaehlt[0])) {
    const i = gewaehlt.findIndex(it => !istSchwer(it));
    if (i > 0) { const t = gewaehlt[0]; gewaehlt[0] = gewaehlt[i]; gewaehlt[i] = t; }
  }
  return gewaehlt;
}

/* --- Spaced Repetition --- */
const SRS_STUFEN = [1, 3, 7];
function srsPlanen(itemId, ok) {
  const i = S.srs.findIndex(e => e.item === itemId);
  const h = new Date();
  if (!ok) {
    const e = i >= 0 ? S.srs[i] : { item: itemId, stage: 0 };
    e.stage = 0;
    h.setDate(h.getDate() + 1);
    e.due = h.toISOString().slice(0, 10);
    if (i < 0) S.srs.push(e);
  } else if (i >= 0) {
    const e = S.srs[i];
    e.stage++;
    if (e.stage >= SRS_STUFEN.length) { S.srs.splice(i, 1); return; }
    h.setDate(h.getDate() + SRS_STUFEN[e.stage]);
    e.due = h.toISOString().slice(0, 10);
  }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function norm(s, cs) {
  s = String(s).trim().replace(/\s+/g, " ").replace(/[„“”"']/g, "");
  return cs ? s : s.toLowerCase();
}

/** Levenshtein — für die Tippfehler-Erkennung im Diktat. */
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/**
 * Tippfehler oder echter Rechtschreibfehler?
 *
 * Bewusst eng gefasst — nur zwei Muster gelten als Tippfehler:
 *   1. Buchstabendreher       Hund → Hudn
 *   2. versehentliche Dopplung Hund → Hunnd
 *
 * Alles andere zählt als Rechtschreibfehler. Ein fehlender oder falscher
 * Buchstabe ist im Deutschen meistens ein echter Fehler (Stadt → Stat,
 * Hund → Hunt), und lieber einmal zu streng als eine Schwäche übersehen.
 * Das richtige Wort wird in der Auswertung ohnehin immer angezeigt.
 */
function istTippfehler(soll, ist) {
  const a = String(soll).toLowerCase(), b = String(ist).toLowerCase();
  if (a === b) return false;

  if (a.length === b.length) {
    const diff = [];
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff.push(i);
    return diff.length === 2 && diff[1] === diff[0] + 1 &&
           a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]];
  }
  if (b.length === a.length + 1) {
    for (let i = 1; i < b.length; i++) {
      if (b[i] === b[i - 1] && b.slice(0, i) + b.slice(i + 1) === a) return true;
    }
  }
  return false;
}

/* --- Sprachausgabe --- */
let STIMMEN = [];
function stimmenLaden() {
  STIMMEN = window.speechSynthesis ? speechSynthesis.getVoices() : [];
}
if (window.speechSynthesis) {
  stimmenLaden();
  speechSynthesis.onvoiceschanged = stimmenLaden;
}
function findeStimme(lang) {
  if (!STIMMEN.length) stimmenLaden();
  return STIMMEN.find(v => v.lang === lang) ||
         STIMMEN.find(v => v.lang.startsWith(lang.slice(0, 2))) || null;
}
const hatDeutscheStimme = () => !!findeStimme("de-AT") || !!findeStimme("de-DE");

function sprich(text, lang, tempo) {
  if (!window.speechSynthesis) return false;
  const v = findeStimme(lang || "de-AT");
  if (!v) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang;
  u.rate = tempo || S.settings.tempo;
  speechSynthesis.speak(u);
  return true;
}

/**
 * Kurze Töne über die Web Audio API — keine Dateien, offline, abschaltbar.
 * Belohnung, die man hört, wirkt bei Kindern stärker als eine Zahl.
 */
let _audio = null;
function ton(art) {
  if (!S.settings.klang) return;
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    if (_audio.state === "suspended") _audio.resume();
    const folge = {
      richtig: [[660, 0], [880, .09]],
      falsch:  [[300, 0], [220, .12]],
      fertig:  [[523, 0], [659, .11], [784, .22], [1047, .33]],
      stufe:   [[784, 0], [988, .1], [1319, .2]]
    }[art] || [];
    folge.forEach(([hz, t]) => {
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.type = art === "falsch" ? "sawtooth" : "triangle";
      o.frequency.value = hz;
      const start = _audio.currentTime + t;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(art === "falsch" ? .12 : .18, start + .015);
      g.gain.exponentialRampToValueAtTime(0.0001, start + .22);
      o.connect(g); g.connect(_audio.destination);
      o.start(start); o.stop(start + .25);
    });
  } catch (e) {}
}

/** Konfetti — reines CSS, räumt sich selbst auf. */
function konfetti(anzahl = 60) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div");
  box.id = "konfetti";
  document.body.appendChild(box);
  const farben = ["#c084fc", "#f472b6", "#38bdf8", "#fbbf24", "#4ade80", "#e9d5ff"];
  for (let i = 0; i < anzahl; i++) {

    k.className = "kf";
    k.style.left = Math.random() * 100 + "%";
    k.style.background = farben[Math.floor(Math.random() * farben.length)];

}

/* --- XP, Level, Streak, Abzeichen --- */
function xpGeben(n) {
  S.xp += n;
  const neu = Math.min(LEVEL_NAMEN.length, Math.floor(S.xp / 200) + 1);
  const auf = neu > S.level;
  S.level = neu;
  return auf;
}
function streakPruefen() {
  const h = heute(), l = S.streak.lastDay;
  if (l === h) return;
  if (!l) { S.streak.count = 1; }
  else {
    const d = tageZwischen(l, h);
    if (d === 1) S.streak.count++;
    else if (d === 2 && S.streak.jokersLeft > 0) { S.streak.jokersLeft--; S.streak.count++; }
    else S.streak.count = 1;
  }
  S.streak.lastDay = h;
  if (tageZwischen(S.streak.wochenStart, h) >= 7) {
    S.streak.wochenStart = h; S.streak.jokersLeft = 1;
  }
}
function badgesPruefen() {
  const neu = [];
  BADGES.forEach(b => {
    if (!S.badges.includes(b.id)) {
      let ok = false;
      try { ok = b.check(S); } catch (e) {}
      if (ok) { S.badges.push(b.id); neu.push(b); }
    }
  });
  return neu;
}

/** Sperrfrist: nach einem Export mindestens so viele Tage Ruhe. */
const EXPORT_PAUSE = 5;

/** Soll die Export-Erinnerung erscheinen?
 *
 *  Zwei Dinge waren hier falsch. Erstens kam die Aufforderung schon nach der
 *  ersten gemeisterten Lektion — aus einer Lektion lässt sich aber kaum etwas
 *  ablesen, was nicht auch Zufall sein könnte. Zweitens hatte „viele
 *  Schwächen" keine Sperrfrist: Nach dem Export waren die Schwächen ja noch
 *  da, also erschien der Hinweis sofort wieder. Ein Hinweis, der immer da
 *  steht, wird übersehen — und dann auch dann, wenn er einmal zählt. */
function exportFaellig() {
  /* Frisch exportiert? Dann für ein paar Tage Ruhe, egal was sonst zutrifft. */
  if (S.lastExport && tageZwischen(S.lastExport, heute()) < EXPORT_PAUSE) return false;

  /* Meilenstein: ab der zweiten gemeisterten Lektion in einem Fach. */
  const graduiert = Object.keys(S.lektionen)
    .filter(id => S.lektionen[id].graduiert);
  const proFach = f => graduiert.filter(id => id.startsWith(f)).length;
  const offen = graduiert.some(id => !S.lektionen[id].gemeldet);
  const meilenstein = offen && (proFach("de") >= 2 || proFach("en") >= 2);

  /* Schwächen zählen nur, wenn sie seit dem letzten Export dazugekommen sind. */
  const jetzt = schwaechen().length;
  const neueSchwaechen = jetzt - (S.schwaechenBeiExport || 0) >= 3;

  const langeHer = S.lastExport
    ? tageZwischen(S.lastExport, heute()) >= 10
    : S.stats.sessions >= 6;

  return meilenstein || neueSchwaechen || langeHer;
}

/**
 * Der Lernpfad eines Fachs.
 *
 * Standardmäßig eingeklappt: Nur die aktive und die nächste Lektion sind zu
 * sehen. Sonst verschwindet der zweite Lernweg unter sechs Karten des ersten —
 * auf dem Handy sieht man Englisch dann gar nicht mehr.
 */
function pfad(fach, titel) {
  const aktiv = aktiveLektion(fach);
  const alleIds = lektionsIds(fach);
  const ids = alleIds.filter(id => (LEK(fach)[id].items || []).length);
  const fertig = ids.filter(id => lektionsStatus(id, fach).fertig).length;
  const offen = !!S.settings["pfadOffen_" + fach];

  /* Eingeklappt: aktive Lektion und die eine danach. */
  const i = aktiv ? alleIds.indexOf(aktiv) : 0;
  const sichtbar = offen ? alleIds : alleIds.slice(Math.max(0, i), i + 2);

  let h = `<div class="card" style="padding-bottom:6px">
    <h2>${titel} — dein Lernweg</h2>
    <p class="sub">${ids.length} Lektionen · jede dauert 2 bis 5 Tage.
    ${fertig ? `${fertig} davon schon gemeistert.` :
      "Das ist der Weg bis zum Schulstart, nicht das Tagespensum."}</p>
    <div class="bar" style="margin:10px 0 2px"><i
      style="width:${Math.round(fertig / ids.length * 100)}%"></i></div>
  </div>`;

  sichtbar.forEach(id => {
    const lek = LEK(fach)[id];
    const hatInhalt = (lek.items || []).length > 0;
    const st = lektionsStatus(id, fach);
    const frei = hatInhalt && freigeschaltet(id, fach);
    const cls = st.fertig ? "done" : (id === aktiv ? "today" : (frei ? "" : "locked"));
    const ziel = Math.max(MIN_DURCHGAENGE, Math.min(MAX_DURCHGAENGE,
                  st.passes + (st.fertig ? 0 : 1)));

    h += `<div class="day ${cls}" ${frei ? `onclick="zeige('lektion','${id}')"` : ""}>
      <div class="dnum">${st.fertig ? "✓" : (lek.nr || "?")}</div>

let L = null;   // laufende Lektion
let K = null;   // laufende Lernphase

/**
 * Eine Lektion beginnt mit der Lernphase — beim ersten Mal verpflichtend,
 * danach optional. Erst erklären, dann abprüfen.
 */
function starte(fach, lekId, ohneLernphase, zaehltNicht) {
  let items;
  if (lekId === "dauer") {
    items = baueDauerSession(fach);
    if (!items.length) { alert("Noch keine Aufgaben verfügbar. Übe erst ein paar Lektionen."); return; }
  } else {
    items = baueSession(lekId, fach);
    if (!items.length) { alert("Diese Lektion hat noch keine Aufgaben."); return; }
  }
  L = { fach, lekId, items, i: 0, richtig: 0, falsch: 0, antworten: [], zaehltNicht,
        start: Date.now(), itemStart: Date.now(), regelFehler: {} };

  const karten = LERNKARTEN[lekId];
  if (karten && karten.length && !ohneLernphase) {
    K = { lekId, karten, i: 0, aufgedeckt: false };
    VIEW = "lernen";
  } else {
    VIEW = "uebung";
  }
  render();
}

/* ---------- Lernphase ---------- */

function viewLernen() {

function wortHoeren(i) {

function probeAufdecken() { K.aufgedeckt = true; render(); }

function lernphaseFertig(uebersprungen) {

  VIEW = "uebung";
