<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gymnasium Fitness</title>
<!-- Erzeugt von tools/bauen.js am 2026-08-09. Nicht direkt bearbeiten —
     Änderungen gehören in index.html und data/*.js. -->

<!-- Als App auf den Home-Bildschirm: iPad und iPhone starten dann ohne
     Safari-Leisten, mit eigenem Symbol. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Fitness">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1424">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1424; --card:#1a2138; --card2:#232c48; --line:#2f3a5c;
  --txt:#eef1f8; --dim:#94a0c0;
  --de:#7aa2f7; --en:#f7a072; --ok:#4ade80; --no:#f87171;
  --gold:#fbbf24; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}

/* ---------- Kopfzeile ---------- */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hdr h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.fire{color:var(--gold)}
.bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--de),var(--ok));
  border-radius:99px;transition:width .5s}

/* ---------- Karten ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.card p.sub{margin:0;color:var(--dim);font-size:14px}

/* ---------- Wegkarte ---------- */
.day{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;
  transition:transform .12s}
.day:active{transform:scale(.985)}
.day.locked{opacity:.42}
.day.done{border-color:#2c5c46}
.dnum{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-weight:700;background:var(--card2);font-size:15px}
.day.done .dnum{background:var(--ok);color:#06301b}
.day.today .dnum{background:var(--de);color:#0a1024;box-shadow:0 0 0 4px rgba(122,162,247,.2)}
.dinfo{flex:1;min-width:0}
.dinfo b{display:block;font-size:15px}
.dinfo span{color:var(--dim);font-size:13px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;margin-top:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:600}
.tag.de{background:rgba(122,162,247,.18);color:var(--de)}
.tag.en{background:rgba(247,160,114,.18);color:var(--en)}

/* ---------- Buttons ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;
  background:var(--de);color:#0a1024;text-align:center;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06301b}
.btn.sm{padding:10px;font-size:14px}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* ---------- Übungen ---------- */
.q{font-size:18px;font-weight:600;margin:0 0 4px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;background:var(--card2);
  border:2px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;
  transition:.12s;font-size:16px}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--de)}
.opt.good{border-color:var(--ok);background:rgba(74,222,128,.13)}
.opt.bad{border-color:var(--no);background:rgba(248,113,113,.13)}
input[type=text],textarea{width:100%;background:var(--card2);border:2px solid var(--line);
  border-radius:13px;padding:14px;color:var(--txt);font:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--de)}
textarea{resize:vertical;min-height:66px}
.uml{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.uml button{background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:8px 13px;font-size:17px;min-width:44px}

/* Wort-Chips: Ordnen, Antippen, Fehlersuche */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip2{background:var(--card2);border:2px solid var(--line);border-radius:11px;
  padding:10px 13px;font-size:16px}
.chip2.sel{border-color:var(--de);background:rgba(122,162,247,.15)}
.chip2.good{border-color:var(--ok);background:rgba(74,222,128,.15)}
.chip2.bad{border-color:var(--no);background:rgba(248,113,113,.15)}
.chip2.used{opacity:.25}
.slot{min-height:54px;background:var(--card2);border:2px dashed var(--line);
  border-radius:13px;padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}

/* Körbe (Sortieren) */
.buckets{display:flex;gap:8px;margin-top:12px}
.bucket{flex:1;background:var(--card2);border:2px dashed var(--line);border-radius:13px;
  padding:9px;min-height:96px}
.bucket.act{border-color:var(--de)}
.bucket b{display:block;font-size:12px;color:var(--dim);margin-bottom:7px;text-align:center}
.bucket .chip2{width:100%;text-align:center;padding:7px;font-size:14px;margin-bottom:6px}

/* Paare */
.pairs{display:flex;gap:9px}
.pairs>div{flex:1}

/* Rückmeldung */
.fb{border-radius:13px;padding:13px;margin-top:12px;font-size:15px}
.fb.good{background:rgba(74,222,128,.12);border:1px solid var(--ok)}
.fb.bad{background:rgba(248,113,113,.12);border:1px solid var(--no)}
.fb b{display:block;margin-bottom:3px}
.strat{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);
  font-size:14px;color:var(--dim)}

/* Diktat */
.dict-sent{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.dict-sent button{background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:11px 15px;font-size:15px;white-space:nowrap}
.diff{background:var(--card2);border-radius:11px;padding:12px;margin-top:9px;
  line-height:2.1;font-size:16px}
.lsatz{font-size:18px;line-height:2.4;margin:12px 0}
input.gap{display:inline-block;width:auto;min-width:90px;padding:5px 9px;
  border-radius:8px;border:2px solid var(--de);background:var(--card2);
  font:inherit;font-size:17px;color:var(--txt);text-align:center}
.tonhinweis{background:rgba(251,191,36,.12);border:1px solid var(--gold);
  border-radius:11px;padding:11px;margin-bottom:10px;font-size:15px}
.w-ok{color:var(--ok)}
.w-typo{color:var(--gold);text-decoration:underline wavy}
.w-bad{color:var(--no);font-weight:700}
.w-bad small{color:var(--ok);font-weight:400}

/* Sonstiges */
.badge{display:flex;gap:11px;align-items:center;background:var(--card2);
  border-radius:13px;padding:11px;margin-bottom:8px}
.badge.off{opacity:.3}
.badge i{font-size:26px;font-style:normal}
.badge b{display:block;font-size:15px}
.badge span{color:var(--dim);font-size:13px}
.banner{background:linear-gradient(135deg,#3b2f6b,#2a3a6b);border:1px solid #5b4fa8;
  border-radius:var(--r);padding:15px;margin-bottom:12px}
.wk{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;
  border-bottom:1px solid var(--line)}
.wk:last-child{border:none}
.wk b{font-weight:600}
.mini{height:6px;width:70px;background:var(--card2);border-radius:99px;overflow:hidden;
  align-self:center}
.mini>i{display:block;height:100%;border-radius:99px}
.center{text-align:center}
.big{font-size:46px;margin:6px 0}
.muted{color:var(--dim);font-size:14px}
.hidden{display:none}

/* ---------- Lernkarten ---------- */
.lk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 17px;margin-bottom:12px;min-height:210px}
.lk .kicker{color:var(--de);font-size:12px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;margin-bottom:7px}
.lk h2{margin:0 0 11px;font-size:21px;line-height:1.3;letter-spacing:-.3px}
.lk p{margin:0 0 12px;font-size:16px;line-height:1.6}
.merke{background:rgba(122,162,247,.13);border-left:3px solid var(--de);
  border-radius:9px;padding:11px 13px;font-size:16px}
.merke b{color:var(--de)}
.bsp{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:15px;align-items:baseline}
.bsp:last-child{border:none}
.bsp .l{flex:0 0 42%;color:var(--dim)}
.bsp .r{flex:1}
.wrd{display:flex;align-items:center;gap:11px;background:var(--card2);
  border-radius:11px;padding:11px 13px;margin-bottom:7px;width:100%;text-align:left}
.wrd b{font-size:17px;flex:0 0 42%}
.wrd span{color:var(--dim);font-size:14px;flex:1}
.wrd i{font-style:normal;opacity:.55}
.probe-a{background:rgba(74,222,128,.12);border:1px solid var(--ok);
  border-radius:11px;padding:13px;margin-top:11px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--de);width:20px;border-radius:99px}

/* ---------- Overlay „Nochmal erklären" ---------- */
.ovl{position:fixed;inset:0;background:rgba(8,11,20,.82);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;padding:14px}
.ovl>div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;max-width:620px;width:100%;max-height:86vh;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ── data/regeln.js ── */
/* Gymnasium Fitness — Regel-Taxonomie
 *
 * Jede Übungsaufgabe verweist über `rules` auf eine oder mehrere dieser Regeln.
 * Der adaptive Loop rechnet ausschließlich auf dieser Ebene: Mastery, Schwächen,
 * Wiederholung und die Wochenanalyse beziehen sich immer auf eine Regel-ID.
 *
 * Felder:
 *   id        eindeutige Regel-ID, dreistufig: fach.bereich.regel
 *   fach      "de" | "en"
 *   bereich   Gruppierung für Auswertungen und Reports
 *   name      Klartext für Kind und Elternreport
 *   introDay  Tag im 21-Tage-Plan, ab dem die Regel als "eingeführt" gilt.
 *             Vorher zählen Fehler NICHT als Schwäche.
 *   strategie kurzer Merksatz, wird bei Fehlern eingeblendet
 */

const REGELN = [

  { id: "de.gr.wortart.nomen", fach: "de", bereich: "Wortarten", introDay: 1,

  { id: "de.gr.wortart.artikel", fach: "de", bereich: "Wortarten", introDay: 1,

    strategie: "Bestimmt: der, die, das. Unbestimmt: ein, eine." },
  { id: "de.gr.wortart.verb", fach: "de", bereich: "Wortarten", introDay: 1,
    name: "Verben erkennen",
    strategie: "Ein Verb sagt, was jemand tut. Man kann es beugen: ich laufe, du läufst." },
  { id: "de.gr.wortart.adjektiv", fach: "de", bereich: "Wortarten", introDay: 2,
    name: "Adjektive erkennen",
    strategie: "Ein Adjektiv sagt, WIE etwas ist. Frage: Wie ist es?" },
  { id: "de.gr.adjektiv.steigerung", fach: "de", bereich: "Wortarten", introDay: 2,
    name: "Adjektive steigern",
    strategie: "schnell – schneller – am schnellsten. Achtung bei gut, viel, gern." },
  { id: "de.gr.wortart.pronomen", fach: "de", bereich: "Wortarten", introDay: 3,
    name: "Pronomen (Fürwörter)",
    strategie: "Ein Pronomen steht STATT eines Nomens: Anna → sie." },
  { id: "de.gr.wortart.praeposition", fach: "de", bereich: "Wortarten", introDay: 3,
    name: "Präpositionen (Vorwörter)",
    strategie: "Präpositionen sagen, wo oder wann etwas ist: auf, unter, vor, nach." },

  /* ===================== DEUTSCH — Nomen und Fälle ===================== */
  { id: "de.gr.nomen.faelle", fach: "de", bereich: "Fälle", introDay: 4,
    name: "Die vier Fälle",
    strategie: "1. Fall: Wer oder was? · 2. Fall: Wessen? · 3. Fall: Wem? · 4. Fall: Wen oder was?" },
  { id: "de.gr.nomen.plural", fach: "de", bereich: "Fälle", introDay: 4,
    name: "Mehrzahl bilden",
    strategie: "Die Mehrzahl hilft auch beim Rechtschreiben: Hund → Hunde." },

  /* ===================== DEUTSCH — Satzglieder ===================== */
  { id: "de.gr.satzglied.subjekt", fach: "de", bereich: "Satzglieder", introDay: 8,
    name: "Subjekt",
    strategie: "Frage: Wer oder was tut etwas?" },
  { id: "de.gr.satzglied.praedikat", fach: "de", bereich: "Satzglieder", introDay: 8,
    name: "Prädikat",
    strategie: "Das Prädikat ist das gebeugte Verb. Frage: Was tut das Subjekt?" },
  { id: "de.gr.satzglied.objekt3", fach: "de", bereich: "Satzglieder", introDay: 9,
    name: "Objekt im 3. Fall",
    strategie: "Frage: Wem? — Ich gebe DER FREUNDIN das Buch." },
  { id: "de.gr.satzglied.objekt4", fach: "de", bereich: "Satzglieder", introDay: 9,
    name: "Objekt im 4. Fall",
    strategie: "Frage: Wen oder was? — Ich gebe der Freundin DAS BUCH." },
  { id: "de.gr.satzglied.adverbial", fach: "de", bereich: "Satzglieder", introDay: 10,
    name: "Adverbiale Bestimmung",
    strategie: "Frage: Wann? Wo? Wie? Warum?" },
  { id: "de.gr.satzglied.verschiebeprobe", fach: "de", bereich: "Satzglieder", introDay: 8,
    name: "Verschiebeprobe",
    strategie: "Was man gemeinsam verschieben kann, ist EIN Satzglied." },

  /* ===================== DEUTSCH — Zeitformen ===================== */
  { id: "de.gr.zeit.praesens", fach: "de", bereich: "Zeitformen", introDay: 11,
    name: "Präsens (Gegenwart)",
    strategie: "Jetzt gerade: ich gehe." },
  { id: "de.gr.zeit.praeteritum", fach: "de", bereich: "Zeitformen", introDay: 11,
    name: "Präteritum (Mitvergangenheit)",
    strategie: "Erzählzeit: ich ging, ich machte." },
  { id: "de.gr.zeit.praeteritum-stark", fach: "de", bereich: "Zeitformen", introDay: 13,
    name: "Starke Verben im Präteritum",
    strategie: "Bei starken Verben ändert sich der Selbstlaut: gehen → ging, trinken → trank." },
  { id: "de.gr.zeit.perfekt", fach: "de", bereich: "Zeitformen", introDay: 12,
    name: "Perfekt (Vergangenheit)",
    strategie: "haben oder sein + Partizip: ich bin gegangen." },
  { id: "de.gr.zeit.plusquamperfekt", fach: "de", bereich: "Zeitformen", introDay: 12,
    name: "Plusquamperfekt (Vorvergangenheit)",
    strategie: "hatte oder war + Partizip: ich war gegangen. Das Vor-Vorher." },
  { id: "de.gr.zeit.futur", fach: "de", bereich: "Zeitformen", introDay: 13,
    name: "Futur (Zukunft)",
    strategie: "werden + Grundform: ich werde gehen." },

  /* ===================== DEUTSCH — Rechtschreibung ===================== */
  // introDay 1: Volksschulstoff, der zum Gymnasium-Start vorausgesetzt wird.
  // Wird deshalb von Anfang an mitgemessen — das ist die eigentliche Diagnose.
  { id: "de.rs.gross-klein.nomen", fach: "de", bereich: "Rechtschreibung", introDay: 1,
    name: "Nomen großschreiben",
    strategie: "Artikelprobe: Passt der, die oder das davor? Dann groß." },
  { id: "de.rs.gross-klein.satzanfang", fach: "de", bereich: "Rechtschreibung", introDay: 1,
    name: "Satzanfang großschreiben",

  // Das ist der neue Teil: Nominalisierung wird erst an Tag 5 eingeführt.
  { id: "de.rs.gross-klein.nominalisierung", fach: "de", bereich: "Rechtschreibung", introDay: 5,
    name: "Nominalisierung",

  { id: "de.rs.umlaut-ableitung", fach: "de", bereich: "Rechtschreibung", introDay: 6,
    name: "ä und äu ableiten",
    strategie: "Ableiten! Bl_tter → Blatt → Blätter. H_user → Haus → Häuser." },
  { id: "de.rs.doppelkonsonant", fach: "de", bereich: "Rechtschreibung", introDay: 6,
    name: "Doppelter Mitlaut",
    strategie: "Kurz gesprochener Selbstlaut → doppelter Mitlaut: Sonne, Ratte." },
  { id: "de.rs.dehnung", fach: "de", bereich: "Rechtschreibung", introDay: 6,
    name: "Lange Selbstlaute (h, ie, Doppelvokal)",
    strategie: "Lang gesprochen → oft Dehnungs-h, ie oder doppelter Selbstlaut: Zahl, Biene, Boot." },
  { id: "de.rs.s-ss-ss", fach: "de", bereich: "Rechtschreibung", introDay: 16,
    name: "s, ss oder ß",
    strategie: "Kurzer Selbstlaut → ss (Fluss). Langer Selbstlaut → ß (Straße)." },
  { id: "de.rs.das-dass", fach: "de", bereich: "Rechtschreibung", introDay: 16,
    name: "das oder dass",
    strategie: "Ersatzprobe: Passt dieses, jenes oder welches? Dann das mit einem s." },
  { id: "de.rs.merkwoerter", fach: "de", bereich: "Rechtschreibung", introDay: 6,
    name: "Merkwörter",
    strategie: "Manche Wörter muss man sich einfach merken: Vater, viel, Vogel." },
  { id: "de.rs.wortfamilie", fach: "de", bereich: "Rechtschreibung", introDay: 6,
    name: "Wortfamilien nutzen",
    strategie: "Verwandte Wörter helfen: fahren, Fahrt, Fahrrad." },

  /* ===================== DEUTSCH — Zeichensetzung ===================== */
  { id: "de.zs.satzschluss", fach: "de", bereich: "Zeichensetzung", introDay: 5,
    name: "Satzschlusszeichen",
    strategie: "Punkt, Fragezeichen oder Rufzeichen — je nachdem, was der Satz will." },
  { id: "de.zs.woertliche-rede", fach: "de", bereich: "Zeichensetzung", introDay: 15,

  { id: "de.zs.komma-aufzaehlung", fach: "de", bereich: "Zeichensetzung", introDay: 16,

  { id: "de.zs.komma-satzverbindung", fach: "de", bereich: "Zeichensetzung", introDay: 16,
    name: "Komma bei Satzverbindungen",

  /* ===================== DEUTSCH — Texte und Lesen ===================== */
  { id: "de.txt.erzaehlung", fach: "de", bereich: "Texte", introDay: 17,

    strategie: "Einleitung, Hauptteil mit Höhepunkt, Schluss." },
  { id: "de.txt.beschreibung", fach: "de", bereich: "Texte", introDay: 19,
    name: "Beschreiben",
    strategie: "Vom Großen zum Kleinen, sachlich, im Präsens." },
  { id: "de.txt.lesestrategie", fach: "de", bereich: "Texte", introDay: 20,
    name: "Lesestrategien",
    strategie: "Überfliegen, Fragen stellen, Schlüsselwörter markieren, zusammenfassen." },
  { id: "de.txt.diktat", fach: "de", bereich: "Texte", introDay: 4,
    name: "Diktat schreiben",
    strategie: "Erst zuhören, dann schreiben, am Schluss nochmal durchlesen." },

  /* ===================== ENGLISCH — Grammatik ===================== */
  { id: "en.gr.to-be", fach: "en", bereich: "Grammar", introDay: 2,
    name: "to be — am, is, are",
    strategie: "I am · you are · he/she/it is · we/you/they are." },
  { id: "en.gr.to-be.negation", fach: "en", bereich: "Grammar", introDay: 2,

    text: "Eine Lektion viermal geübt — so entsteht Können.",
    check: s => Object.values(s.lektionen || {}).some(p => (p.passes || 0) >= 4) },

  { id: "erste-meisterschaft", name: "Erste Meisterschaft", icon: "🏆",
    text: "Die erste Lektion vollständig gemeistert.",
    check: s => Object.values(s.lektionen || {}).some(p => p.graduiert) },

  { id: "halbzeit", name: "Halbzeit", icon: "🎖️",
    text: "Fünf Lektionen gemeistert.",
    check: s => Object.values(s.lektionen || {}).filter(p => p.graduiert).length >= 5 },

  { id: "diktatserie", name: "Diktatserie", icon: "📜",
    text: "Zehn Diktate geschrieben.",
    check: s => (s.diktat?.erledigt || []).length >= 10 },

  { id: "durchhalterin", name: "Durchhalterin", icon: "🔥",
    text: "7 Tage in Folge geübt.",
    check: s => s.streak.count >= 7 },

  { id: "marathon", name: "Marathon", icon: "🏅",
    text: "21 Tage in Folge geübt. Wahnsinn.",
    check: s => s.streak.count >= 21 },

  { id: "datenbotin", name: "Datenbotin", icon: "📮",
    text: "Fortschritt zum ersten Mal exportiert.",
    check: s => !!s.lastExport },

  { id: "gymnasium-ready", name: "Gymnasium-Ready", icon: "🎓",
    text: "Alle Lektionen gemeistert. Du bist bereit.",
    check: s => {
      const ids = Object.keys(s.lektionen || {});
      return ids.length >= 12 && ids.every(k => s.lektionen[k].graduiert);
    } }
];

const LEVEL_NAMEN = [
  "Sprachforscherin", "Wortsammlerin", "Satzbauerin", "Regelkennerin",
  "Textentdeckerin", "Sprachjongleurin", "Wortmeisterin", "Grammatikprofi",
  "Sprachkünstlerin", "Gymnasium-Kandidatin"
];

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   1. STATE
   ══════════════════════════════════════════════════════════════════ */

const KEY = "gymfit_v2";
const ALPHA = 0.3;          // Lerngewicht: wie stark die neueste Antwort zählt
const DECAY = 0.02;         // Zerfall pro Tag ohne Übung
const SCHWELLE = 0.7;       // darunter gilt eine Regel als Schwäche
const MIN_SEEN = 4;         // erst ab so vielen Begegnungen wird gewertet

/* Eine Lektion ist ein Thema, kein Tag. Sie wird so lange wiederholt,
   bis sie sitzt — mindestens zweimal an zwei verschiedenen Tagen. */
const MIN_DURCHGAENGE = 2;
const MIN_TAGE        = 2;    // erzwingt Abstand: nie zwei Durchgänge am selben Tag
const MAX_DURCHGAENGE = 5;    // Obergrenze, damit sich niemand festbeißt
const GRAD_MASTERY    = 0.75; /* ab hier gilt eine Lektion als gemeistert.
                                 Bewusst nicht höher: die Beherrschung pendelt sich
                                 auf die Trefferquote ein, und 75 % richtig ist bei
                                 neuem Stoff für ein zehnjähriges Kind gut. */
const AUFGABEN_PRO_DURCHGANG = 10;

/* Testnaht: erlaubt der Verlaufssimulation, Tage vorzuspulen.
   Im Browser immer null — dort gilt das echte Datum. */
let _datumHook = null;
const heute = () => _datumHook ? _datumHook() : new Date().toISOString().slice(0, 10);
const tageZwischen = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function leerState() {
  return {
    version: 1, xp: 0, level: 1,
    streak: { count: 0, lastDay: null, jokersLeft: 1, wochenStart: heute() },
    completed: {}, rules: {}, srs: [], log: [], badges: [],
    /* Fortschritt je Lektion:  { passes, tage[], gesehen[] } */
    lektionen: {},
    /* Diktate:  { erledigt[], letzterTag } */
    diktat: { erledigt: [], letzterTag: null },
    stats: { perfekteDiktate: 0, sessions: 0 },
    settings: { satzzeichenSprechen: true, tempo: 0.85, umlautLeiste: false },
    lastExport: null, startDatum: heute()
  };
}

/* Alle Speicherschlüssel, die es je gab — neueste zuerst. Wird die App
   aktualisiert und ändert sich die Struktur, findet sie so den letzten Stand
   trotzdem und rechnet ihn um, statt bei null anzufangen.

   Muss VOR dem ersten laden() stehen — sonst greift die Umwandlung ins Leere. */
const ALTE_KEYS = ["gymfit_v1"];
const BACKUP_KEY = KEY + "_backup";

let S = laden();

function laden() {
  try {
    let raw = localStorage.getItem(KEY), herkunft = KEY;

    // Nichts unter dem aktuellen Schlüssel? Dann in älteren nachsehen.
    if (!raw) {
      for (const alt of ALTE_KEYS) {
        const a = localStorage.getItem(alt);
        if (a) { raw = a; herkunft = alt; break; }
      }
    }
    if (!raw) return leerState();

    const gespeichert = JSON.parse(raw);

    /* Vor jeder Umwandlung eine Sicherung anlegen. Geht beim Umrechnen etwas
       schief, sind Wochen an Übung nicht verloren — sie lassen sich im Profil
       wiederherstellen. */
    if (herkunft !== KEY) {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({
          gesichertAm: new Date().toISOString(), ausSchluessel: herkunft, daten: gespeichert
        }));
      } catch (e) {}
    }

    const s = Object.assign(leerState(), gespeichert);
    // Einstellungen zusammenführen, damit neue Optionen ihren Standard behalten
    s.settings = Object.assign(leerState().settings, gespeichert.settings || {});
    return umwandeln(s, gespeichert);
  } catch (e) {
    return leerState();
  }
}

/**
 * Alte Stände auf die aktuelle Struktur bringen.
 *
 * Hier kommt bei künftigen Umbauten die Umrechnung hinein — statt den
 * Speicherschlüssel zu wechseln und damit den Fortschritt wegzuwerfen.
 */
function umwandeln(s, roh) {
  // v1 kannte nur Tages-Lektionen ("de-01") und keine Durchgänge.
  if (roh.completed && !roh.lektionen) {
    s.lektionen = {};
    for (const alt in roh.completed) {
      const m = alt.match(/^(de|en)-0?(\d+)$/);
      if (!m) continue;
      const neu = `${m[1]}-l${m[2]}`;
      s.lektionen[neu] = {
        passes: 1, tage: [roh.completed[alt].date || heute()], gesehen: []
      };
    }
  }
  if (!s.diktat) s.diktat = { erledigt: [], letzterTag: null };
  if (!s.lektionen) s.lektionen = {};
  return s;
}

/** Gibt es eine Sicherung aus einer Umwandlung? */
function backupInfo() {
  try {
    const b = localStorage.getItem(BACKUP_KEY);
    return b ? JSON.parse(b) : null;
  } catch (e) { return null; }
}

function backupWiederherstellen() {
  const b = backupInfo();
  if (!b) return;
  if (!confirm("Den gesicherten Stand von " + b.gesichertAm.slice(0, 10) +
               " wiederherstellen? Der aktuelle Fortschritt wird ersetzt.")) return;
  localStorage.setItem(KEY, JSON.stringify(b.daten));
  location.reload();
}

function sichern() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* ══════════════════════════════════════════════════════════════════
   2. ADAPTIVER LOOP — Mastery, Schwächen, Auswahl
   ══════════════════════════════════════════════════════════════════ */

const pad = n => String(n).padStart(2, "0");

/* ---------- Lektionen ---------- */

const LEK = fach => fach === "de" ? LEKTIONEN_DE : LEKTIONEN_EN;
const lektionsIds = fach =>
  Object.keys(LEK(fach)).sort((a, b) => (LEK(fach)[a].nr || 0) - (LEK(fach)[b].nr || 0));

/** Alle Regeln, die in einer Lektion vorkommen. */
function lektionsRegeln(lekId, fach) {
  const lek = LEK(fach)[lekId];
  const set = new Set();
  (lek?.items || []).forEach(i => (i.rules || []).forEach(r => set.add(r)));
  return [...set];
}

/**
 * Durchschnittliche Beherrschung der Regeln einer Lektion.
 *
 * Gemittelt wird nur über Regeln, die tatsächlich schon drankamen. Eine noch
 * nie geübte Regel als „null Prozent" zu zählen wäre falsch — sie zöge den
 * Schnitt so weit herunter, dass die Lektion nie graduieren könnte.
 */
function lektionsMastery(lekId, fach) {
  const geuebt = lektionsRegeln(lekId, fach).filter(r => (S.rules[r]?.seen || 0) > 0);
  if (!geuebt.length) return 0;
  return geuebt.reduce((a, r) => a + S.rules[r].mastery, 0) / geuebt.length;
}

/**
 * Status einer Lektion.
 *
 * Gemeistert ist sie, wenn sie mindestens zweimal an zwei verschiedenen
 * Tagen geübt wurde UND die Regeln sitzen. Wer sich festbeißt, wird nach
 * sechs Durchgängen trotzdem weitergelassen — dann übernimmt der
 * Schwächenpool, der die Regeln ohnehin weiter einstreut.
 */
function lektionsStatus(lekId, fach) {
  const p = S.lektionen[lekId] || { passes: 0, tage: [], gesehen: [] };
  const mastery = lektionsMastery(lekId, fach);
  const regeln = lektionsRegeln(lekId, fach);

  // Jede Regel der Lektion muss mindestens zweimal drangekommen sein …
  const alleGeuebt = regeln.every(r => (S.rules[r]?.seen || 0) >= 2);
  // … und höchstens eine darf noch richtig wackeln.
  const wacklig = regeln.filter(r => (S.rules[r]?.mastery ?? 0) < 0.6).length;

  const geschafft = p.passes >= MIN_DURCHGAENGE &&
                    (p.tage || []).length >= MIN_TAGE &&
                    mastery >= GRAD_MASTERY &&
                    alleGeuebt && wacklig <= 1;
  const ausgereizt = p.passes >= MAX_DURCHGAENGE;
  return {
    passes: p.passes, tage: p.tage || [], gesehen: p.gesehen || [],
    mastery, fertig: geschafft || ausgereizt, ausgereizt,
    heuteSchon: (p.tage || []).includes(heute())
  };
}

/** Die Lektion, an der gerade gearbeitet wird — die erste unfertige. */
function aktiveLektion(fach) {
  for (const id of lektionsIds(fach)) {
    if (!(LEK(fach)[id].items || []).length) continue;
    if (!lektionsStatus(id, fach).fertig) return id;
  }
  return null;   // alles gemeistert
}

/** Freigeschaltet ist eine Lektion, wenn die vorige mindestens einmal lief. */
function freigeschaltet(lekId, fach) {
  const ids = lektionsIds(fach);
  const i = ids.indexOf(lekId);
  if (i <= 0) return true;
  return (S.lektionen[ids[i - 1]]?.passes || 0) >= 1;
}

/** Was heute ansteht. */
function tagesplan() {
  const de = aktiveLektion("de"), en = aktiveLektion("en");
  return {
    de, en,
    deOffen: de && !lektionsStatus(de, "de").heuteSchon,
    enOffen: en && !lektionsStatus(en, "en").heuteSchon,
    diktatOffen: S.diktat.letzterTag !== heute(),
    fertig: (!de || lektionsStatus(de, "de").heuteSchon) &&
            (!en || lektionsStatus(en, "en").heuteSchon) &&
            S.diktat.letzterTag === heute()
  };
}

/** Programmtag — nur noch für die Anzeige, nicht mehr für die Steuerung. */
function programmTag() {
  return S.startDatum ? tageZwischen(S.startDatum, heute()) + 1 : 1;
}

/** Zerfall anwenden: Wissen verblasst leicht, damit es wieder auftaucht. */
function zerfallAnwenden() {
  const h = heute();
  for (const id in S.rules) {
    const r = S.rules[id];
    if (!r.lastSeen) continue;
    const d = tageZwischen(r.lastSeen, h);
    if (d > 0) {
      r.mastery = Math.max(0, r.mastery - DECAY * d);
      r.lastSeen = h;
    }
  }
}

/** Mastery einer Regel nach einer Antwort fortschreiben. */
function masteryUpdate(regelId, ok) {
  const r = S.rules[regelId] || (S.rules[regelId] = {
    seen: 0, correct: 0, mastery: 0.5, lastSeen: null, days: 0, tage: []
  });
  r.seen++;
  if (ok) r.correct++;
  r.mastery = r.mastery + ALPHA * ((ok ? 1 : 0) - r.mastery);
  r.mastery = Math.min(1, Math.max(0, r.mastery));
  const h = heute();
  if (r.lastSeen !== h) { r.tage = r.tage || []; if (!r.tage.includes(h)) r.tage.push(h); }
  r.lastSeen = h;
  r.days = (r.tage || []).length;
}

/**
 * Gilt eine Regel als eingeführt?
 *
 * Ja, sobald sie in den Lernkarten einer Lektion erklärt wurde, die
 * mindestens einmal gelaufen ist. Vorher ist ein Fehler kein Defizit,
 * sondern schlicht Unkenntnis — und darf nicht als Schwäche zählen.
 */
function regelEingefuehrt(regelId) {
  for (const lekId in LERNKARTEN) {
    if (!(S.lektionen[lekId]?.passes >= 1)) continue;
    if (LERNKARTEN[lekId].some(k => (k.rules || []).includes(regelId))) return true;
  }
  return false;
}

/** Regeln, die als echte Schwäche gelten — mit allen drei Bedingungen. */
function schwaechen() {
  return Object.entries(S.rules)
    .filter(([id, r]) => {
      if (!REGEL_MAP[id]) return false;
      if (!regelEingefuehrt(id)) return false;     // noch nicht gelernt ≠ Schwäche
      if (r.seen < MIN_SEEN) return false;         // zu wenig Daten
      return r.mastery < SCHWELLE;
    })
    .sort((a, b) => a[1].mastery - b[1].mastery)
    .map(([id, r]) => ({ id, ...r, def: REGEL_MAP[id] }));
}

/** Regeln, die als gemeistert gelten. */
function gemeistert() {
  return Object.entries(S.rules)
    .filter(([id, r]) => r.mastery >= 0.9 && r.seen >= 10 && (r.days || 0) >= 3)
    .map(([id]) => id);
}

/* --- Aufgabenpool über alle Lektionen --- */
function alleItems(fach) {
  const q = fach === "de" ? LEKTIONEN_DE : LEKTIONEN_EN;
  const out = [];
  for (const k in q) (q[k].items || []).forEach(it => out.push(it));
  return out;
}
function itemById(id) {
  return [...alleItems("de"), ...alleItems("en")].find(i => i.id === id);
}

/**
 * Schwierigkeitsstufe einer Aufgabe — aus dem Typ abgeleitet.
 *   1 Wiedererkennen · 2 Anwenden · 3 Selbst produzieren
 * An einer Aufgabe mit `difficulty` überschreibbar.
 */
function schwierigkeit(it) {
  if (it.difficulty) return it.difficulty;
  return { mc: 1, tf: 1, match: 1, sort: 1,
           tap: 2, order: 2,
           type: 3, fehler: 3, diktat: 3 }[it.type] || 2;
}

/** Welche Stufen in welchem Durchgang drankommen. */
function stufenFuerDurchgang(n) {
  if (n <= 1) return [1, 2];        // erster Kontakt: erkennen und anwenden
  if (n === 2) return [1, 2, 3];    // gemischt
  return [2, 3];                    // ab dem dritten: selbst produzieren
}

/**
 * Einen Durchgang zusammenstellen.
 *
 * Der Durchgang bestimmt die Schwierigkeit: erst Wiedererkennen, später
 * selbst schreiben. Innerhalb der Lektion kommen Aufgaben dran, die sie noch
 * nicht gesehen hat — deshalb braucht eine Lektion rund 35 Aufgaben. Dazu
 * Schwächen aus früheren Lektionen und fällige Wiederholungen.
 */
function baueSession(lekId, fach) {
  const lek = LEK(fach)[lekId];
  if (!lek) return [];

  const st = lektionsStatus(lekId, fach);
  const stufen = stufenFuerDurchgang(st.passes + 1);
  const gesehen = new Set(st.gesehen);
  const LAENGE = lek.anzahlUebungen ?? AUFGABEN_PRO_DURCHGANG;

  const gewaehlt = [];
  const proRegel = {};
  const nimm = (it, pflicht) => {
    if (!it || gewaehlt.some(g => g.id === it.id)) return false;
    const rs = it.rules || [];
    if (!pflicht && rs.some(r => (proRegel[r] || 0) >= 3)) return false;
    rs.forEach(r => proRegel[r] = (proRegel[r] || 0) + 1);
    gewaehlt.push(it);
    return true;
  };

  /* 1. Aufgaben der Lektion — passende Stufe, Ungesehenes zuerst. */
  const eigene = [...(lek.items || [])];
  const passend = eigene.filter(i => stufen.includes(schwierigkeit(i)));
  const frisch  = shuffle(passend.filter(i => !gesehen.has(i.id)));
  const bekannt = shuffle(passend.filter(i => gesehen.has(i.id)));
  const reserve = shuffle(eigene.filter(i => !passend.includes(i)));
  const ziel = Math.round(LAENGE * 0.75);
  [...frisch, ...bekannt, ...reserve].forEach(it => {
    if (gewaehlt.length < ziel) nimm(it, true);
  });

  /* 2. Schwächen aus früheren Lektionen einstreuen — gewichtet gezogen,
        nicht stur die schlimmste Regel. */
  const schw = schwaechen().filter(s => s.def.fach === fach);
  const pool = alleItems(fach);
  let versuche = 0;
  while (gewaehlt.length < LAENGE - 2 && schw.length && versuche++ < 30) {
    const s = schw[Math.floor(Math.pow(Math.random(), 1.6) * schw.length)];
    const kand = pool.filter(it => (it.rules || []).includes(s.id));
    // Dieselbe Regel, aber möglichst in einem neuen Gewand: ungesehene
    // Aufgaben zuerst. Sonst sieht sie dieselbe Frage mehrfach.
    const neu = kand.filter(it => !gesehen.has(it.id));
    const quelle = neu.length ? neu : kand;
    if (quelle.length) nimm(quelle[Math.floor(Math.random() * quelle.length)]);
  }

  /* 3. Fällige Wiederholungen. */
  const h = heute();
  S.srs.filter(e => e.due <= h).forEach(e => {
    if (gewaehlt.length < LAENGE) nimm(itemById(e.item));
  });

  /* 4. Rest mit Aufgaben der Lektion auffüllen. */
  eigene.forEach(it => { if (gewaehlt.length < LAENGE) nimm(it, true); });

  /* Leitplanke: nie mit einer Schwäche-Aufgabe starten. */
  const schwIds = new Set(schw.map(s => s.id));
  const istSchwer = it => (it.rules || []).some(r => schwIds.has(r));
  if (gewaehlt.length > 1 && istSchwer(gewaehlt[0])) {
    const i = gewaehlt.findIndex(it => !istSchwer(it));
    if (i > 0) { const t = gewaehlt[0]; gewaehlt[0] = gewaehlt[i]; gewaehlt[i] = t; }
  }
  return gewaehlt;
}

/* --- Spaced Repetition --- */
const SRS_STUFEN = [1, 3, 7];
function srsPlanen(itemId, ok) {
  const i = S.srs.findIndex(e => e.item === itemId);
  const h = new Date();
  if (!ok) {
    const e = i >= 0 ? S.srs[i] : { item: itemId, stage: 0 };
    e.stage = 0;
    h.setDate(h.getDate() + 1);
    e.due = h.toISOString().slice(0, 10);
    if (i < 0) S.srs.push(e);
  } else if (i >= 0) {
    const e = S.srs[i];
    e.stage++;
    if (e.stage >= SRS_STUFEN.length) { S.srs.splice(i, 1); return; }
    h.setDate(h.getDate() + SRS_STUFEN[e.stage]);
    e.due = h.toISOString().slice(0, 10);
  }
}

/* ══════════════════════════════════════════════════════════════════
   3. HILFSFUNKTIONEN
   ══════════════════════════════════════════════════════════════════ */

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function norm(s, cs) {
  s = String(s).trim().replace(/\s+/g, " ").replace(/[„“”"']/g, "");
  return cs ? s : s.toLowerCase();
}

/** Levenshtein — für die Tippfehler-Erkennung im Diktat. */
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/**
 * Tippfehler oder echter Rechtschreibfehler?
 *
 * Bewusst eng gefasst — nur zwei Muster gelten als Tippfehler:
 *   1. Buchstabendreher       Hund → Hudn
 *   2. versehentliche Dopplung Hund → Hunnd
 *
 * Alles andere zählt als Rechtschreibfehler. Ein fehlender oder falscher
 * Buchstabe ist im Deutschen meistens ein echter Fehler (Stadt → Stat,
 * Hund → Hunt), und lieber einmal zu streng als eine Schwäche übersehen.
 * Das richtige Wort wird in der Auswertung ohnehin immer angezeigt.
 */
function istTippfehler(soll, ist) {
  const a = String(soll).toLowerCase(), b = String(ist).toLowerCase();
  if (a === b) return false;

  if (a.length === b.length) {
    const diff = [];
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff.push(i);
    return diff.length === 2 && diff[1] === diff[0] + 1 &&
           a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]];
  }
  if (b.length === a.length + 1) {
    for (let i = 1; i < b.length; i++) {
      if (b[i] === b[i - 1] && b.slice(0, i) + b.slice(i + 1) === a) return true;
    }
  }
  return false;
}

/* --- Sprachausgabe --- */
let STIMMEN = [];
function stimmenLaden() {
  STIMMEN = window.speechSynthesis ? speechSynthesis.getVoices() : [];
}
if (window.speechSynthesis) {
  stimmenLaden();
  speechSynthesis.onvoiceschanged = stimmenLaden;
}
function findeStimme(lang) {
  if (!STIMMEN.length) stimmenLaden();
  return STIMMEN.find(v => v.lang === lang) ||
         STIMMEN.find(v => v.lang.startsWith(lang.slice(0, 2))) || null;
}
const hatDeutscheStimme = () => !!findeStimme("de-AT") || !!findeStimme("de-DE");

function sprich(text, lang, tempo) {
  if (!window.speechSynthesis) return false;
  const v = findeStimme(lang || "de-AT");
  if (!v) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang;
  u.rate = tempo || S.settings.tempo;
  speechSynthesis.speak(u);
  return true;
}

/* --- XP, Level, Streak, Abzeichen --- */
function xpGeben(n) {
  S.xp += n;
  const neu = Math.min(LEVEL_NAMEN.length, Math.floor(S.xp / 200) + 1);
  const auf = neu > S.level;
  S.level = neu;
  return auf;
}
function streakPruefen() {
  const h = heute(), l = S.streak.lastDay;
  if (l === h) return;
  if (!l) { S.streak.count = 1; }
  else {
    const d = tageZwischen(l, h);
    if (d === 1) S.streak.count++;
    else if (d === 2 && S.streak.jokersLeft > 0) { S.streak.jokersLeft--; S.streak.count++; }
    else S.streak.count = 1;
  }
  S.streak.lastDay = h;
  if (tageZwischen(S.streak.wochenStart, h) >= 7) {
    S.streak.wochenStart = h; S.streak.jokersLeft = 1;
  }
}
function badgesPruefen() {
  const neu = [];
  BADGES.forEach(b => {
    if (!S.badges.includes(b.id)) {
      let ok = false;
      try { ok = b.check(S); } catch (e) {}
      if (ok) { S.badges.push(b.id); neu.push(b); }
    }
  });
  return neu;
}

/** Soll die Export-Erinnerung erscheinen? */
function exportFaellig() {
  // Meilenstein: gerade wurde eine Lektion gemeistert
  const meilenstein = Object.keys(S.lektionen).some(id => {
    const fach = id.startsWith("de") ? "de" : "en";
    return S.lektionen[id].graduiert && !S.lektionen[id].gemeldet;
  });
  const vieleSchwaechen = schwaechen().length >= 3;
  const langeHer = S.lastExport ? tageZwischen(S.lastExport, heute()) >= 7 : S.stats.sessions >= 3;
  return meilenstein || vieleSchwaechen || langeHer;
}

function kopf() {
  const bis = (S.level) * 200, von = (S.level - 1) * 200;
  const pct = Math.min(100, Math.round((S.xp - von) / (bis - von) * 100));
  return `
    <div class="hdr">
      <h1>Gymnasium Fitness</h1>
      <span class="chip fire">🔥 ${S.streak.count}</span>
      <span class="chip">⚡ ${S.xp}</span>
      <button class="chip" onclick="zeige('profil')">👤</button>

      Rang ${S.level}: ${LEVEL_NAMEN[S.level - 1] || "Profi"}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

/** Der Lernpfad eines Fachs: alle Lektionen mit ihrem Durchgangsstand. */
function pfad(fach, titel) {
  const aktiv = aktiveLektion(fach);
  const ids = lektionsIds(fach).filter(id => (LEK(fach)[id].items || []).length);
  const fertig = ids.filter(id => lektionsStatus(id, fach).fertig).length;

  let h = `<div class="card" style="padding-bottom:6px">
    <h2>${titel} — dein Lernweg</h2>
    <p class="sub">${ids.length} Lektionen · jede dauert 2 bis 5 Tage.
    ${fertig ? `${fertig} davon schon gemeistert.` :
      "Das ist der Weg bis zum Schulstart, nicht das Tagespensum."}</p>
    <div class="bar" style="margin:10px 0 2px"><i
      style="width:${Math.round(fertig / ids.length * 100)}%"></i></div>
  </div>`;

  lektionsIds(fach).forEach(id => {
    const lek = LEK(fach)[id];
    const hatInhalt = (lek.items || []).length > 0;
    const st = lektionsStatus(id, fach);
    const frei = hatInhalt && freigeschaltet(id, fach);
    const cls = st.fertig ? "done" : (id === aktiv ? "today" : (frei ? "" : "locked"));
    const ziel = Math.max(MIN_DURCHGAENGE, Math.min(MAX_DURCHGAENGE,
                  st.passes + (st.fertig ? 0 : 1)));

    h += `<div class="day ${cls}" ${frei ? `onclick="zeige('lektion','${id}')"` : ""}>
      <div class="dnum">${st.fertig ? "✓" : (lek.nr || "?")}</div>
      <div class="dinfo">
        <b>${esc(lek.titel)}</b>
        <span>${hatInhalt
          ? (st.fertig ? "✓ gemeistert" :
             st.passes ? `${st.passes} von etwa ${ziel} Übungstagen` :
             (frei ? "noch nicht begonnen" : "wird später freigeschaltet"))
          : "in Vorbereitung"}</span>
        ${hatInhalt ? `<div class="mini" style="width:100%;margin-top:6px"><i
          style="width:${Math.round(st.mastery * 100)}%;background:${
            st.mastery >= GRAD_MASTERY ? "var(--ok)" :
            st.mastery >= 0.5 ? "var(--gold)" : "var(--de)"}"></i></div>` : ""}
      </div>
    </div>`;
  });
  return h;
}

    h += `<div class="card"><p class="sub">Diese Lektion hast du heute schon geübt.
      <b>Wiederholung wirkt am besten mit einem Tag Abstand</b> — deshalb zählt der

let L = null;   // laufende Lektion
let K = null;   // laufende Lernphase

/**
 * Eine Lektion beginnt mit der Lernphase — beim ersten Mal verpflichtend,
 * danach optional. Erst erklären, dann abprüfen.
 */
function starte(fach, lekId, ohneLernphase, zaehltNicht) {
  let items;
  if (lekId === "dauer") {
    items = baueDauerSession(fach);
    if (!items.length) { alert("Noch keine Aufgaben verfügbar. Übe erst ein paar Lektionen."); return; }
  } else {
    items = baueSession(lekId, fach);
    if (!items.length) { alert("Diese Lektion hat noch keine Aufgaben."); return; }
  }
  L = { fach, lekId, items, i: 0, richtig: 0, falsch: 0, antworten: [], zaehltNicht,
        start: Date.now(), itemStart: Date.now(), regelFehler: {} };

  const karten = LERNKARTEN[lekId];
  if (karten && karten.length && !ohneLernphase) {
    K = { lekId, karten, i: 0, aufgedeckt: false };
    VIEW = "lernen";
  } else {
    VIEW = "uebung";
  }
  render();
}

/* ---------- Lernphase ---------- */

function viewLernen() {
  const k = K.karten[K.i];
  const letzte = K.i === K.karten.length - 1;
  const erstmals = !S.completed[K.lekId];

  let h = `<div class="hdr">
      <button class="chip" onclick="zeige('home')">✕</button>
      <h1 style="text-align:right;font-size:15px">Lernen · ${K.i + 1}/${K.karten.length}</h1>
    </div>
    ${karteHtml(k, K.aufgedeckt)}
    <div class="dots">${K.karten.map((_, i) =>
      `<i class="${i === K.i ? "on" : ""}"></i>`).join("")}</div>`;

  if (k.typ === "probe" && !K.aufgedeckt) {
    h += `<button class="btn" onclick="probeAufdecken()">Antwort zeigen</button>`;
  } else {
    h += `<div class="row">
        ${K.i > 0 ? `<button class="btn ghost" onclick="karteZurueck()">Zurück</button>` : ""}
        <button class="btn ${letzte ? "ok" : ""}" onclick="karteWeiter()">
          ${letzte ? "Jetzt üben →" : "Weiter"}</button>
      </div>`;
  }
  if (!letzte && !erstmals) {
    h += `<div style="height:9px"></div>
      <button class="btn ghost sm" onclick="lernphaseFertig(true)">Überspringen</button>`;
  }
  return h;
}

function karteHtml(k, aufgedeckt) {
  const kicker = { regel: "Regel", beispiele: "Beispiele",
                   woerter: "Wörter", probe: "Probier's aus" }[k.typ] || "";
  let inner = `<div class="kicker">${kicker}</div>`;

  if (k.typ === "probe") {
    inner += `<h2>${k.frage}</h2>`;
    if (aufgedeckt) {
      inner += `<div class="probe-a"><b>${esc(k.antwort)}</b>
        ${k.erklaerung ? `<div style="margin-top:6px;font-size:15px">${k.erklaerung}</div>` : ""}</div>
        <p class="muted" style="margin:11px 0 0">Diese Frage zählt nicht — sie ist nur zum Ausprobieren.</p>`;
    } else {
      inner += `<p class="muted">Überleg kurz, dann deck die Antwort auf.</p>`;
    }
  } else {
    inner += `<h2>${esc(k.titel)}</h2>`;
    if (k.text) inner += `<p>${k.text}</p>`;
    if (k.hinweis) inner += `<p class="muted">${k.hinweis}</p>`;

    if (k.typ === "beispiele") {
      inner += k.zeilen.map(z =>
        `<div class="bsp"><div class="l">${z[0]}</div><div class="r">${z[1]}</div></div>`).join("");
    }
    if (k.typ === "woerter") {
      inner += k.woerter.map((w, i) =>
        `<button class="wrd" onclick="wortHoeren(${i})">
           <b>${esc(w.en)}</b><span>${esc(w.de)}</span><i>🔊</i></button>`).join("");
    }
    if (k.merke) inner += `<div class="merke" style="margin-top:12px">💡 ${k.merke}</div>`;
  }
  return `<div class="lk">${inner}</div>`;
}

function wortHoeren(i) {
  const k = K ? K.karten[K.i] : null;
  const w = k?.woerter?.[i];
  if (w) sprich(w.en, "en-GB", 0.9);
}
function probeAufdecken() { K.aufgedeckt = true; render(); }
function karteZurueck() { K.i--; K.aufgedeckt = false; render(); }
function karteWeiter() {
  if (K.i < K.karten.length - 1) { K.i++; K.aufgedeckt = false; render(); }
  else lernphaseFertig(false);
}
function lernphaseFertig(uebersprungen) {
  if (!uebersprungen && !S.completed[K.lekId]) { xpGeben(5); sichern(); }
  K = null;
  VIEW = "uebung";
  render();
}

/** Findet die Lernkarte, die eine bestimmte Regel erklärt. */
function karteFuerRegel(regelId) {
  for (const lek in LERNKARTEN) {
    const t = LERNKARTEN[lek].find(k =>
      (k.rules || []).includes(regelId) && k.typ !== "probe");
    if (t) return t;
  }
  return null;
}
function erklaerungZeigen(regelId) {
  const k = karteFuerRegel(regelId);
  if (!k) return;
  const d = document.createElement("div");
  d.className = "ovl";
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div>${karteHtml(k, true)}
    <button class="btn ghost" onclick="this.closest('.ovl').remove()">Schließen</button></div>`;
  document.body.appendChild(d);
}

function baueDauerSession(fach) {
  const pool = alleItems(fach);
  const schw = schwaechen().filter(s => s.def.fach === fach);
  const out = [];
  const nimm = it => { if (it && !out.some(o => o.id === it.id)) out.push(it); };

  schw.slice(0, 8).forEach(s => {
    const k = pool.filter(it => (it.rules || []).includes(s.id));
    if (k.length) nimm(k[Math.floor(Math.random() * k.length)]);
  });
  const h = heute();
  S.srs.filter(e => e.due <= h).slice(0, 6).forEach(e => nimm(itemById(e.item)));
  const gem = new Set(gemeistert());
  const frisch = pool.filter(it => (it.rules || []).some(r => gem.has(r)));
  shuffle(frisch); frisch.slice(0, 3).forEach(nimm);
  if (out.length < 6) { shuffle(pool); pool.slice(0, 8).forEach(nimm); }
  return out.slice(0, 14);
}

function render() {
  if (VIEW === "home") app.innerHTML = viewHome();
  else if (VIEW === "profil") app.innerHTML = viewProfil();
  else if (VIEW === "export") app.innerHTML = viewExport();
  else if (VIEW === "lektion") app.innerHTML = viewLektion(window._arg);
  else if (VIEW === "lernen") app.innerHTML = viewLernen();
  else if (VIEW === "uebung") renderItem();
  else if (VIEW === "ergebnis") renderErgebnis();
  window.scrollTo(0, 0);
}
function zeige(v, arg) { VIEW = v; window._arg = arg; render(); }

/* ---------- Eine Aufgabe darstellen ---------- */
function renderItem() {
  const it = L.items[L.i];
  if (!it) { beenden(); return; }
  const pct = Math.round(L.i / L.items.length * 100);

  let h = `<div class="hdr">
      <button class="chip" onclick="if(confirm('Lektion abbrechen?'))zeige('home')">✕</button>
      <h1 style="text-align:right;font-size:15px">${L.i + 1} / ${L.items.length}</h1>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card"><p class="q">${esc(it.prompt)}</p>`;

  h += ({
    mc: rMC, type: rType, tf: rTF, sort: rSort, tap: rTap,
    order: rOrder, match: rMatch, diktat: rDiktat, fehler: rFehler
  }[it.type] || (() => `<p class="muted">Unbekannter Aufgabentyp.</p>`))(it);

  h += `</div><div id="fb"></div>
    <button class="btn" id="pruefen" onclick="pruefen()" disabled>Prüfen</button>`;
  app.innerHTML = h;
  if (it.type === "type") {
    const inp = document.getElementById("eingabe");
    if (inp) { inp.oninput = () => btnAn(inp.value.trim().length > 0); }
  }
  if (it.type === "diktat") diktatInit(it);
}

const btnAn = an => { const b = document.getElementById("pruefen"); if (b) b.disabled = !an; };

/* --- Renderer je Aufgabentyp --- */
let A = {};   // Antwortzustand der laufenden Aufgabe

function rMC(it) {
  A = { wahl: null };
  const o = shuffle([...it.opts]);
  A.opts = o;
  return o.map((x, i) =>
    `<button class="opt" id="o${i}" onclick="mcWahl(${i})">${esc(x.t)}</button>`).join("");
}
function mcWahl(i) {
  A.wahl = i;
  A.opts.forEach((_, j) => document.getElementById("o" + j).classList.toggle("sel", i === j));
  btnAn(true);
}

function rType(it) {
  A = {};
  /* Die Umlaut-Leiste ist standardmäßig aus: Jede deutsche Tastatur kann
     ä ö ü ß ohnehin. Nur für fremde Tastaturlayouts zuschaltbar. */
  const uml = (L.fach === "de" && S.settings.umlautLeiste)
    ? `<div class="uml">${["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"]
        .map(c => `<button onclick="einfuegen('${c}')">${c}</button>`).join("")}</div>` : "";
  return `<input type="text" id="eingabe" autocomplete="off" autocorrect="off"
    autocapitalize="off" spellcheck="false" placeholder="Deine Antwort">${uml}
    ${it.hint ? `<p class="muted" style="margin-top:9px">💡 ${esc(it.hint)}</p>` : ""}`;
}
function einfuegen(c) {
  const i = document.getElementById("eingabe");
  const s = i.selectionStart ?? i.value.length;
  i.value = i.value.slice(0, s) + c + i.value.slice(i.selectionEnd ?? s);

}

function rTF(it) {
  A = { wahl: null };
  return `<p style="font-size:17px;margin:12px 0">${esc(it.statement)}</p>
    <div class="row">
      <button class="opt center" id="o0" onclick="tfWahl(true)">✓ Richtig</button>
      <button class="opt center" id="o1" onclick="tfWahl(false)">✕ Falsch</button>
    </div>`;
}
function tfWahl(v) {
  A.wahl = v;
  document.getElementById("o0").classList.toggle("sel", v);
  document.getElementById("o1").classList.toggle("sel", !v);

function rSort(it) {

  A.words = shuffle([...it.words]);
  return `<div class="chips" id="wpool">${A.words.map((w, i) =>
      `<button class="chip2" id="w${i}" onclick="sortWahl(${i})">${esc(w.w)}</button>`).join("")}</div>
    <div class="buckets">${it.buckets.map((b, i) =>
      `<div class="bucket" id="b${i}" onclick="sortLegen(${i})">
        <b>${esc(b)}</b><div id="bc${i}"></div></div>`).join("")}</div>`;
}
function sortWahl(i) {
  A.aktiv = i;
  A.words.forEach((_, j) => {
    const e = document.getElementById("w" + j);
    if (e) e.classList.toggle("sel", i === j);

}
function sortLegen(bi) {
  if (A.aktiv === null) return;

  A.zuord[A.aktiv] = bi;

function rTap(it) {
  A = { wahl: null };
  return `<div class="chips">${it.tokens.map((t, i) =>
    `<button class="chip2" id="t${i}" onclick="tapWahl(${i})">${esc(t)}</button>`).join("")}</div>`;
}
function tapWahl(i) {
  A.wahl = i;
  L.items[L.i].tokens.forEach((_, j) =>
    document.getElementById("t" + j).classList.toggle("sel", i === j));
  btnAn(true);
}

function rOrder(it) {
  A = { gelegt: [] };
  A.pool = shuffle([...it.words]);
  return `<div class="slot" id="slot"></div>
    <div class="chips" id="pool">${A.pool.map((w, i) =>
      `<button class="chip2" id="p${i}" onclick="ordNimm(${i})">${esc(w)}</button>`).join("")}</div>`;
}
function ordNimm(i) {
  const b = document.getElementById("p" + i);
  if (b.classList.contains("used")) return;

  A.gelegt.push({ w: A.pool[i], i });

function ordZurueck(k) {

  document.getElementById("p" + e.i).classList.remove("used");

}

    `<button class="chip2" onclick="ordZurueck(${k})">${esc(e.w)}</button>`).join("");

}

function rMatch(it) {
  A = { zuord: {}, aktiv: null };
  A.links = it.pairs.map(p => p[0]);
  A.rechts = shuffle(it.pairs.map(p => p[1]));
  return `<div class="pairs">
    <div>${A.links.map((x, i) =>
      `<button class="chip2" style="width:100%;margin-bottom:7px" id="l${i}"

    <div>${A.rechts.map((x, i) =>

        onclick="matchR(${i})">${esc(x)}</button>`).join("")}</div></div>`;
}
function matchL(i) {
  A.aktiv = i;
  A.links.forEach((_, j) => document.getElementById("l" + j).classList.toggle("sel", i === j));
}
function matchR(i) {

  A.zuord[A.aktiv] = i;

  document.getElementById("r" + i).classList.add("used");

function rFehler(it) {
  A = { markiert: new Set() };
  return `<p class="muted" style="margin:0 0 10px">
      ${Object.keys(it.wrong).length} Wörter sind falsch geschrieben.</p>
    <div class="chips">${it.tokens.map((t, i) =>
      `<button class="chip2" id="f${i}" onclick="fehlerTipp(${i})">${esc(t)}</button>`).join("")}</div>`;

function fehlerTipp(i) {

  document.getElementById("f" + i).classList.toggle("sel", A.markiert.has(i));

/* --- Diktat ---
 * Jeder Modus wird vorgelesen. Ein Diktat ohne Ansage wäre Raterei.
 * Ist keine deutsche Stimme da, blendet die App den Satz stattdessen
 * kurz ein (Schleichdiktat) — das funktioniert auf jedem Gerät.
 */
function rDiktat(it) {
  A = { satz: 0, eingaben: [], modus: it.mode || "hoeren", tonDefekt: false };
  const hinweis = {
    hoeren: "Du hörst jeden Satz einzeln und tippst ihn. So oft wiederholen, wie du willst.",
    luecke: "Du hörst den ganzen Satz — tippen musst du nur die fehlenden Wörter.",
    schleich: "Der Satz erscheint kurz. Merk ihn dir und tippe ihn dann."
  }[A.modus];
  return `<div id="dbox">
    <p class="muted">${esc(hinweis)}</p>
    ${it.vorschau ? `<div class="card" style="background:var(--card2);margin:12px 0">
      <b style="font-size:14px">Diese Wörter kommen vor:</b>
      <div class="chips" style="margin:8px 0 0">${it.vorschau.map(w =>
        `<span class="chip2">${esc(w)}</span>`).join("")}</div></div>` : ""}
    <button class="btn ok" onclick="diktatLos()">Los geht's</button>
  </div>`;
}
function diktatInit() {
  btnAn(false);
  const b = document.getElementById("pruefen");
  if (b) b.style.display = "none";        // das Diktat hat eigene Knöpfe
}

function diktatLos() { diktatSatz(); }

function diktatSatz() {
  const it = L.items[L.i];
  const s = it.sentences[A.satz];
  if (!s) return;
  const letzter = A.satz + 1 >= it.sentences.length;

  /* Abspielknöpfe gibt es in JEDEM Modus. */
  let steuer = `<div class="dict-sent">
      <button onclick="diktatHoeren()">🔊 Anhören</button>
      <button onclick="diktatHoeren(0.55)">🐢 Langsam</button>
      ${A.modus !== "luecke" ? `<button onclick="diktatBlitz()">👁 Kurz zeigen</button>` : ""}
    </div>
    <div id="blitz" class="muted" style="min-height:26px"></div>`;

  let feld;
  if (A.modus === "luecke") {
    feld = `<div class="lsatz">${lueckeHtml(s)}</div>`;
  } else {
    feld = `<input type="text" id="eingabe" autocomplete="off" autocorrect="off"
      autocapitalize="sentences" spellcheck="false" placeholder="Satz hier tippen">`;
  }

  document.getElementById("dbox").innerHTML = `
    <p class="muted">Satz ${A.satz + 1} von ${it.sentences.length}</p>
    ${A.tonDefekt ? `<div class="tonhinweis">🔇 Auf diesem Gerät ist keine deutsche
      Sprachausgabe installiert. Nutze stattdessen <b>👁 Kurz zeigen</b>.</div>` : ""}
    ${steuer}${feld}
    ${S.settings.umlautLeiste ? `<div class="uml">${["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"]
      .map(c => `<button onclick="einfuegen('${c}')">${c}</button>`).join("")}</div>` : ""}
    <div style="height:12px"></div>
    <button class="btn ok" onclick="diktatWeiter()">
      ${letzter ? "Diktat abgeben" : "Nächster Satz"}</button>`;

  setTimeout(() => diktatHoeren(), 400);
}

/** Satz mit Eingabefeldern an den Lückenstellen. */
function lueckeHtml(s) {
  let rest = s.text, out = "", gi = 0;
  (s.luecken || []).forEach(w => {
    const i = rest.indexOf(w);
    if (i < 0) return;
    out += esc(rest.slice(0, i)) +
      `<input type="text" class="gap" id="g${gi}" autocomplete="off" autocorrect="off"
        spellcheck="false" style="width:${Math.max(6, w.length + 2)}ch">`;
    rest = rest.slice(i + w.length);
    gi++;
  });
  return out + esc(rest);
}

/** @returns {boolean} ob tatsächlich etwas abgespielt wurde */
function diktatHoeren(tempo) {
  const it = L.items[L.i];
  let t = it.sentences[A.satz].text;
  if (S.settings.satzzeichenSprechen) {
    t = t.replace(/,/g, " Komma").replace(/\.$/, " Punkt")
         .replace(/\?$/, " Fragezeichen").replace(/!$/, " Rufzeichen");
  }
  const ok = sprich(t, "de-AT", tempo || S.settings.tempo);
  if (!ok && !A.tonDefekt) {
    A.tonDefekt = true;
    // Ohne Stimme darf das Diktat nicht zur Raterei werden: Satz einblenden.
    if (A.modus === "hoeren") A.modus = "schleich";
    diktatSatz();
    setTimeout(diktatBlitz, 300);
  }
  return ok;
}

function diktatBlitz() {
  const it = L.items[L.i];
  const el = document.getElementById("blitz");
  if (!el) return;
  el.textContent = it.sentences[A.satz].text;
  el.style.color = "var(--txt)";
  setTimeout(() => {
    el.textContent = "…jetzt tippen";
    el.style.color = "var(--dim)";
  }, 5000);
}

function diktatWeiter() {
  const it = L.items[L.i];
  if (A.modus === "luecke") {
    const s = it.sentences[A.satz];
    A.eingaben[A.satz] = (s.luecken || []).map((_, i) =>
      (document.getElementById("g" + i)?.value || "").trim());
  } else {
    A.eingaben[A.satz] = document.getElementById("eingabe").value;
  }
  A.satz++;
  if (A.satz < it.sentences.length) diktatSatz();
  else {
    if (window.speechSynthesis) speechSynthesis.cancel();
    const b = document.getElementById("pruefen");
    if (b) b.style.display = "";
    btnAn(true);
    pruefen();
  }
}

/* ══════════════════════════════════════════════════════════════════
   6. AUSWERTUNG
   ══════════════════════════════════════════════════════════════════ */

function pruefen() {
  const it = L.items[L.i];
  let ok = false, miss = null, loesung = "", extra = "";

  switch (it.type) {
    case "mc": {
      const w = A.opts[A.wahl];
      ok = w.t === it.correct; miss = ok ? null : w.miss;
      loesung = it.correct;
      A.opts.forEach((x, i) => {
        const e = document.getElementById("o" + i);
        if (x.t === it.correct) e.classList.add("good");
        else if (i === A.wahl) e.classList.add("bad");
      });
      break;
    }
    case "type": {
      const v = document.getElementById("eingabe").value;
      const cs = it.caseSensitive !== false;
      const kand = [it.answer, ...(it.alt || [])];
      ok = kand.some(k => norm(k, cs) === norm(v, cs));
      loesung = it.answer;
      break;
    }
    case "tf":
      ok = A.wahl === it.answer;
      loesung = it.answer ? "Richtig" : "Falsch";
      extra = it.erklaerung || "";
      break;
    case "sort": {
      ok = true;
      A.words.forEach((w, i) => {
        const soll = it.buckets.indexOf(w.b);
        if (A.zuord[i] !== soll) ok = false;
      });
      loesung = A.words.map(w => `${w.w} → ${w.b}`).join(" · ");
      break;
    }
    case "tap":
      ok = A.wahl === it.correctIndex;
      loesung = it.tokens[it.correctIndex];
      it.tokens.forEach((_, i) => {
        const e = document.getElementById("t" + i);
        if (i === it.correctIndex) e.classList.add("good");
        else if (i === A.wahl) e.classList.add("bad");
      });
      break;
    case "order":
      ok = A.gelegt.map(e => e.w).join(" ") === it.solution.join(" ");
      loesung = it.solution.join(" ");
      break;
    case "match": {
      ok = true;
      A.links.forEach((l, i) => {
        const soll = it.pairs.find(p => p[0] === l)[1];
        if (A.rechts[A.zuord[i]] !== soll) ok = false;
      });
      loesung = it.pairs.map(p => `${p[0]} → ${p[1]}`).join(" · ");
      break;
    }
    case "fehler": {
      const sollIdx = new Set(Object.keys(it.wrong).map(Number));
      ok = sollIdx.size === A.markiert.size &&
           [...sollIdx].every(i => A.markiert.has(i));
      it.tokens.forEach((_, i) => {
        const e = document.getElementById("f" + i);
        if (sollIdx.has(i)) e.classList.add("good");
        else if (A.markiert.has(i)) e.classList.add("bad");
      });
      loesung = Object.entries(it.wrong).map(([i, w]) => `${it.tokens[i]} → ${w}`).join(" · ");
      break;
    }
    case "diktat": {
      const res = diktatAuswerten(it);
      ok = res.fehler === 0;
      extra = res.html;
      if (ok) S.stats.perfekteDiktate = (S.stats.perfekteDiktate || 0) + 1;
      break;
    }
  }

  /* --- Mastery und Protokoll fortschreiben --- */
  (it.rules || []).forEach(r => masteryUpdate(r, ok));
  srsPlanen(it.id, ok);
  S.log.push({ item: it.id, ok, rules: it.rules || [], miss: miss || null,
               ms: Date.now() - (L.itemStart || L.start), tag: programmTag(),
               lektion: L.lekId });
  if (S.log.length > 300) S.log = S.log.slice(-300);

  if (ok) { L.richtig++; xpGeben(10); }
  else {
    L.falsch++;
    (it.rules || []).forEach(r => L.regelFehler[r] = (L.regelFehler[r] || 0) + 1);
  }

  /* --- Notbremse: dreimal dieselbe Regel falsch ---
     Weiterbohren bringt nichts. Die Regel fliegt für heute raus und die
     Erklärkarte kommt stattdessen von selbst. */
  const gesperrt = Object.entries(L.regelFehler).filter(([, n]) => n >= 3).map(([r]) => r);
  if (gesperrt.length) {
    L.items = L.items.filter((x, idx) =>
      idx <= L.i || !(x.rules || []).some(r => gesperrt.includes(r)));
    const neuGesperrt = gesperrt.find(r => !(L.gezeigt || []).includes(r));
    if (neuGesperrt && karteFuerRegel(neuGesperrt)) {
      L.gezeigt = [...(L.gezeigt || []), neuGesperrt];
      setTimeout(() => erklaerungZeigen(neuGesperrt), 600);
    }
  }

  /* --- Rückmeldung --- */
  const strat = (it.rules || []).map(r => REGEL_MAP[r]?.strategie).filter(Boolean)[0];
  const erklRegel = ok ? null : (it.rules || []).find(r => karteFuerRegel(r));
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ Richtig!" : "✕ Noch nicht"}</b>
      ${!ok && loesung ? `Richtig wäre: <b style="display:inline">${esc(loesung)}</b>` : ""}
      ${extra ? `<div style="margin-top:7px">${extra}</div>` : ""}
      ${!ok && strat ? `<div class="strat">💡 ${esc(strat)}</div>` : ""}
      ${erklRegel ? `<button class="btn ghost sm" style="margin-top:10px"
          onclick="erklaerungZeigen('${erklRegel}')">📖 Nochmal erklären</button>` : ""}
    </div>`;

  const b = document.getElementById("pruefen");
  b.textContent = L.i + 1 < L.items.length ? "Weiter" : "Fertig";
  b.className = "btn ok";
  b.onclick = weiter;
  b.disabled = false;
  sichern();
}

function diktatAuswerten(it) {
  let fehler = 0, tippfehler = 0;
  const clean = x => String(x).replace(/[.,!?„“”"]/g, "");

  /** Ein Wort vergleichen und als farbiges Stück zurückgeben. */
  const wort = (soll, ist) => {
    if (clean(ist) === clean(soll)) return `<span class="w-ok">${esc(soll)}</span>`;
    if (ist && istTippfehler(clean(soll), clean(ist))) {
      tippfehler++;
      return `<span class="w-typo">${esc(ist)}</span>`;
    }
    fehler++;
    return `<span class="w-bad">${esc(ist || "—")} <small>(${esc(soll)})</small></span>`;
  };

  const zeilen = it.sentences.map((s, si) => {
    /* Lückendiktat: nur die Lücken werden bewertet, der Rest steht ja da. */
    if (A.modus === "luecke" && Array.isArray(A.eingaben[si])) {
      const gaps = s.luecken || [];
      let rest = s.text, out = "";
      gaps.forEach((w, gi) => {
        const i = rest.indexOf(w);
        if (i < 0) return;
        out += esc(rest.slice(0, i)) + wort(w, A.eingaben[si][gi] || "");
        rest = rest.slice(i + w.length);
      });
      return out + esc(rest);
    }
    /* Hör- und Schleichdiktat: der ganze Satz zählt. */
    const soll = s.text.split(/\s+/);
    const ist = String(A.eingaben[si] || "").trim().split(/\s+/).filter(Boolean);
    return soll.map((w, wi) => wort(w, ist[wi] || "")).join(" ");
  });

  return {
    fehler,
    html: `<div class="diff">${zeilen.join("<br>")}</div>
      <div class="muted" style="margin-top:8px">
        ${fehler} Rechtschreibfehler${tippfehler ? ` · ${tippfehler} Tippfehler (zählen nicht)` : ""}</div>`
  };
}

function weiter() {
  L.i++;
  L.itemStart = Date.now();
  if (L.i >= L.items.length) beenden(); else render();
}

function beenden() {
  const score = L.items.length ? L.richtig / L.items.length : 0;
  streakPruefen();
  S.stats.sessions = (S.stats.sessions || 0) + 1;
  S.completed[L.lekId] = { score, date: heute() };

  /* Durchgang verbuchen — aber höchstens einer pro Tag und Lektion.
     Der erzwungene Abstand ist der eigentliche Wirkstoff. */
  if (L.lekId === "diktat") {
    S.diktat.letzterTag = heute();
    if (!S.diktat.erledigt.includes(L.diktatId)) S.diktat.erledigt.push(L.diktatId);
  }

  if (L.lekId !== "dauer" && L.lekId !== "diktat" && !L.zaehltNicht) {
    const p = S.lektionen[L.lekId] || (S.lektionen[L.lekId] = { passes: 0, tage: [], gesehen: [] });
    const h = heute();
    if (!p.tage.includes(h)) {
      p.passes++;
      p.tage.push(h);
    }
    // gesehene Aufgaben merken, damit der nächste Durchgang Neues bringt
    L.items.forEach(it => { if (!p.gesehen.includes(it.id)) p.gesehen.push(it.id); });

    const st = lektionsStatus(L.lekId, L.fach);
    if (st.fertig && !p.graduiert) {
      p.graduiert = true;
      L.graduiert = true;
      xpGeben(60);
    }
    L.status = st;
  }

  if (score >= 0.8) xpGeben(25);
  L.neueBadges = badgesPruefen();
  sichern();
  VIEW = "ergebnis";
  render();
}

/* ---------- Diktat des Tages ---------- */

/** Wählt ein Diktat, das zum aktuellen Stoff und zu den Schwächen passt. */
function waehleDiktat() {
  const erledigt = new Set(S.diktat.erledigt || []);
  const offen = DIKTATE.filter(d => !erledigt.has(d.id));
  const pool = offen.length ? offen : DIKTATE;          // notfalls von vorn

  const schwIds = new Set(schwaechen().map(s => s.id));
  const aktivDe = aktiveLektion("de");
  const aktuelleRegeln = new Set(aktivDe ? lektionsRegeln(aktivDe, "de") : []);

  const punkte = d => {
    let p = 0;
    d.rules.forEach(r => {
      if (schwIds.has(r)) p += 3;              // gezielt an Schwächen arbeiten
      if (aktuelleRegeln.has(r)) p += 2;       // zum laufenden Thema passen
      if (regelEingefuehrt(r)) p += 1;         // nichts abfragen, was noch fehlt
    });
    return p - Math.abs(d.stufe - diktatStufe()) * 2;
  };
  return [...pool].sort((a, b) => punkte(b) - punkte(a))[0];
}

/** Mit wachsender Erfahrung dürfen die Diktate länger werden. */
function diktatStufe() {
  const n = (S.diktat.erledigt || []).length;
  return n < 4 ? 1 : n < 10 ? 2 : 3;
}

function diktatStarten() {
  const d = waehleDiktat();
  if (!d) { alert("Keine Diktate verfügbar."); return; }
  const item = {
    id: "diktat-" + d.id, type: "diktat", mode: "hoeren",
    rules: ["de.txt.diktat", ...d.rules],
    prompt: "Diktat des Tages",
    vorschau: d.vorschau, sentences: d.sentences
  };
  L = { fach: "de", lekId: "diktat", diktatId: d.id, items: [item], i: 0,
        richtig: 0, falsch: 0, start: Date.now(), itemStart: Date.now(), regelFehler: {} };
  VIEW = "uebung";
  render();
}

function renderErgebnis() {
  const score = L.items.length ? L.richtig / L.items.length : 0;
  const pct = Math.round(score * 100);
  const wort = pct >= 90 ? "Fantastisch!" : pct >= 70 ? "Gut gemacht!" :
               pct >= 50 ? "Solide Runde." : "Das üben wir nochmal.";

  let h = `<div class="card center">
    <div class="big">${pct >= 90 ? "🎉" : pct >= 70 ? "👏" : "💪"}</div>
    <h2>${wort}</h2>
    <p class="sub">${L.richtig} von ${L.items.length} richtig · ${pct} %</p>
  </div>`;

  /* Lektion gemeistert? Das ist der eigentliche Meilenstein — nicht ein Tag. */
  if (L.graduiert) {
    h += `<div class="card center" style="border-color:var(--ok)">
      <div class="big">🏆</div>
      <h2>Lektion gemeistert!</h2>
      <p class="sub">„${esc(LEK(L.fach)[L.lekId].titel)}" sitzt.
      Die nächste Lektion ist freigeschaltet.</p></div>`;
  } else if (L.status) {
    const fehlt = [];
    if (L.status.passes < MIN_DURCHGAENGE)
      fehlt.push(`noch ${MIN_DURCHGAENGE - L.status.passes} Durchgang`);
    if (L.status.mastery < GRAD_MASTERY)
      fehlt.push(`Sicherheit bei ${Math.round(L.status.mastery * 100)} von 85 %`);
    h += `<div class="card"><h2>Diese Lektion</h2>
      <div class="wk"><b>Durchgang ${L.status.passes} geschafft</b>
        <div class="mini"><i style="width:${Math.round(L.status.mastery * 100)}%;
          background:${L.status.mastery >= 0.7 ? "var(--ok)" : "var(--gold)"}"></i></div></div>
      <p class="sub" style="margin-top:9px">${fehlt.length
        ? "Bis zum Meistern: " + fehlt.join(" · ") + ". Der nächste Durchgang zählt ab morgen."
        : "Fast geschafft — der nächste Durchgang zählt ab morgen."}</p></div>`;
  }

  const schwach = Object.entries(L.regelFehler).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (schwach.length) {
    h += `<div class="card"><h2>Das üben wir nochmal</h2>` +
      schwach.map(([r, n]) => {
        const d = REGEL_MAP[r];
        return `<div class="wk"><b>${esc(d?.name || r)}</b>
          <span class="muted">${n}×</span></div>`;
      }).join("") +
      `<p class="sub" style="margin-top:9px">Diese Aufgaben kommen in den nächsten
      Tagen automatisch wieder.</p></div>`;
  }

  if (L.neueBadges?.length) {
    h += `<div class="card"><h2>🎁 Neue Abzeichen!</h2>` + L.neueBadges.map(b =>
      `<div class="badge"><i>${b.icon}</i><div><b>${esc(b.name)}</b>
        <span>${esc(b.text)}</span></div></div>`).join("") + `</div>`;
  }

  if (exportFaellig()) {
    h += `<div class="banner"><b>📮 Zeit für neue Aufgaben!</b>
      <p class="sub" style="margin:5px 0 11px">Schick deinen Fortschritt und hol dir
      Übungen, die genau zu deinen Fehlern passen.</p>
      <button class="btn sm" onclick="zeige('export')">Fortschritt senden</button></div>`;
  }

  h += `<button class="btn" onclick="zeige('home')">Weiter zur Übersicht</button>`;
  app.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════
   7. EXPORT / IMPORT
   ══════════════════════════════════════════════════════════════════ */

function exportPaket() {
  zerfallAnwenden();
  return {
    app: "gymnasium-fitness", version: 1, erstellt: new Date().toISOString(),
    tag: programmTag(),
    xp: S.xp, level: S.level, streak: S.streak.count,
    sessions: S.stats.sessions,
    completed: S.completed,
    lektionen: S.lektionen,
    diktate: (S.diktat.erledigt || []).length,
    rules: S.rules,
    schwaechen: schwaechen().map(s => ({ id: s.id, name: s.def.name,
      mastery: +s.mastery.toFixed(2), seen: s.seen, correct: s.correct })),
    gemeistert: gemeistert(),
    log: S.log.slice(-300),
    badges: S.badges
  };
}

function exportName() {
  return `gymfit-fortschritt-${heute()}.json`;
}

function exportDatei() {
  const b = new Blob([JSON.stringify(exportPaket(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = exportName();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  exportNotieren();
}

async function exportTeilen() {
  const json = JSON.stringify(exportPaket());
  const datei = new File([json], exportName(), { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: "Gymnasium Fitness — Fortschritt" });
      exportNotieren(); return;
    }
    if (navigator.share) {
      await navigator.share({ title: "Gymnasium Fitness", text: json });
      exportNotieren(); return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  exportDatei();
}

async function exportKopieren() {
  const json = JSON.stringify(exportPaket());
  try {
    await navigator.clipboard.writeText(json);
    alert("Fortschritt kopiert! Jetzt einfach in eine Nachricht einfügen.");
    exportNotieren();
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = json; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
    alert("Fortschritt kopiert!");
    exportNotieren();
  }
}

function exportNotieren() {
  S.lastExport = heute();
  Object.values(S.lektionen).forEach(p => { if (p.graduiert) p.gemeldet = true; });
  const neu = badgesPruefen();
  sichern();
  if (neu.length) alert("🎁 Neues Abzeichen: " + neu.map(b => b.name).join(", "));
}

/** Neues Übungspaket einlesen (aus der Wochenanalyse). */
function importDialog() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".js,.json,application/json,text/javascript";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const txt = String(r.result);
        // Fortschrittsdatei zurückspielen (Gerätewechsel)
        if (f.name.includes("fortschritt")) {
          const p = JSON.parse(txt);
          if (p.app !== "gymnasium-fitness") throw new Error("falsches Format");
          S.xp = p.xp ?? S.xp; S.level = p.level ?? S.level;
          S.completed = p.completed || S.completed;
          S.lektionen = p.lektionen || S.lektionen;
          S.rules = p.rules || S.rules;
          S.badges = p.badges || S.badges;
          sichern();
          alert("Fortschritt geladen!");
          zeige("home"); return;
        }
        // Neues Aufgabenpaket
        const sc = document.createElement("script");
        sc.textContent = txt;
        document.body.appendChild(sc);
        const n = zaehleItems();
        alert(`🎁 Neues Paket geladen — ${n} Aufgaben verfügbar!`);
        zeige("home");
      } catch (e) {
        alert("Datei konnte nicht gelesen werden: " + e.message);
      }
    };
    r.readAsText(f);
  };
  inp.click();
}
const zaehleItems = () => alleItems("de").length + alleItems("en").length;
