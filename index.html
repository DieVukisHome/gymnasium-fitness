/** Findet die Lernkarte, die eine bestimmte Regel erklärt. */
function karteFuerRegel(regelId) {
  for (const lek in LERNKARTEN) {
    const t = LERNKARTEN[lek].find(k =>
      (k.rules || []).includes(regelId) && k.typ !== "probe");
    if (t) return t;
  }
  return null;
}
function erklaerungZeigen(regelId) {
  const k = karteFuerRegel(regelId);
  if (!k) return;
  const d = document.createElement("div");
  d.className = "ovl";
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div>${karteHtml(k, true)}
    <button class="btn ghost" onclick="this.closest('.ovl').remove()">Schließen</button></div>`;
  document.body.appendChild(d);
}

/**
 * Nachbesser-Runde: gezielt das, was in der letzten Runde falsch war.
 *
 * Nimmt die verpatzten Aufgaben selbst plus weitere zur gleichen Regel, damit
 * es nicht beim Auswendiglernen einer Antwort bleibt. Verbessert die
 * Beherrschung — verbucht aber keinen Durchgang und überschreibt kein Ergebnis.
 * Das ist der Unterschied zwischen „nochmal für eine bessere Zahl" und
 * „das schaue ich mir nochmal an".
 */
function baueNachbesserung(fehler, fach) {
  const pool = alleItems(fach);
  const out = [];
  const nimm = it => { if (it && !out.some(o => o.id === it.id)) out.push(it); };

  /* Zwei Aufrufformen: mit Regeln (aus einer Runde) oder nur mit IDs.
     Fehlen die Regeln, werden sie aus der Aufgabe im Pool geholt — sonst
     gäbe es keine Zusatzübungen und es bliebe beim Auswendiglernen. */
  const liste = (fehler || []).map(f => {
    const roh = typeof f === "string" ? { id: f, rules: [] } : { ...f };
    if (!roh.rules || !roh.rules.length) {
      const imPool = pool.find(i => i.id === roh.id);
      roh.rules = imPool ? (imPool.rules || []) : [];
    }
    return roh;
  });
  const ids = liste.map(f => f.id);

  // Die verpatzten Aufgaben selbst, sofern sie im Pool stehen
  ids.map(id => pool.find(i => i.id === id)).filter(Boolean).forEach(nimm);

  /* Dann über die Regeln — das ist der Weg, der auch für das Diktat
     funktioniert: Es steht in keinem Pool, trägt aber Regeln wie
     „Nomen großschreiben", zu denen es sehr wohl Übungen gibt. */
  const regeln = [...new Set(liste.flatMap(f => f.rules))];
  regeln.forEach(r => {
    const kand = shuffle(pool.filter(i => (i.rules || []).includes(r) && !ids.includes(i.id)));
    kand.slice(0, 2).forEach(nimm);
  });

  return shuffle(out).slice(0, 12);
}

/** Nachbessern starten — aus dem Ergebnis oder von der Lektionsseite. */
function nachbessernStarten(fach, fehler) {
  const items = baueNachbesserung(fehler, fach);
  if (!items.length) { alert("Nichts zum Nachbessern — es war alles richtig!"); return; }
  L = { fach, lekId: "nachbessern", items, i: 0, richtig: 0, falsch: 0,
        zaehltNicht: true, start: Date.now(), itemStart: Date.now(), regelFehler: {} };
  VIEW = "uebung";
  render();
}

/** Freiwillige Übungsrunde aus Schwächen und fälligen Wiederholungen. */
function uebungsrundeStarten(fach) {
  const items = baueDauerSession(fach);
  if (!items.length) { alert("Übe erst ein paar Lektionen, dann gibt es hier Wiederholungen."); return; }
  L = { fach, lekId: "uebungsrunde", items, i: 0, richtig: 0, falsch: 0,
        zaehltNicht: true, start: Date.now(), itemStart: Date.now(), regelFehler: {} };
  VIEW = "uebung";
  render();
}

function baueDauerSession(fach) {
  const pool = alleItems(fach);
  const schw = schwaechen().filter(s => s.def.fach === fach);
  const out = [];
  const nimm = it => { if (it && !out.some(o => o.id === it.id)) out.push(it); };

  schw.slice(0, 8).forEach(s => {
    const k = pool.filter(it => (it.rules || []).includes(s.id));
    if (k.length) nimm(k[Math.floor(Math.random() * k.length)]);
  });
  const h = heute();
  S.srs.filter(e => e.due <= h).slice(0, 6).forEach(e => nimm(itemById(e.item)));
  const gem = new Set(gemeistert());
  const frisch = pool.filter(it => (it.rules || []).some(r => gem.has(r)));
  shuffle(frisch); frisch.slice(0, 3).forEach(nimm);
  if (out.length < 6) { shuffle(pool); pool.slice(0, 8).forEach(nimm); }
  return out.slice(0, 14);
}

function render() {
  if (VIEW === "home") app.innerHTML = viewHome();
  else if (VIEW === "profil") app.innerHTML = viewProfil();
  else if (VIEW === "export") app.innerHTML = viewExport();
  else if (VIEW === "lektion") app.innerHTML = viewLektion(window._arg);
  else if (VIEW === "lernen") app.innerHTML = viewLernen();
  else if (VIEW === "uebung") renderItem();
  else if (VIEW === "ergebnis") renderErgebnis();
  window.scrollTo(0, 0);
}
function zeige(v, arg) { VIEW = v; window._arg = arg; render(); }

/* ---------- Eine Aufgabe darstellen ---------- */
function renderItem() {
  const it = L.items[L.i];
  if (!it) { beenden(); return; }
  const pct = Math.round(L.i / L.items.length * 100);

  let h = `<div class="hdr">
      <button class="chip" onclick="if(confirm('Lektion abbrechen?'))zeige('home')">✕</button>
      <h1 style="text-align:right;font-size:15px">${L.i + 1} / ${L.items.length}</h1>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card"><p class="q">${esc(it.prompt)}</p>`;

  h += ({
    mc: rMC, type: rType, tf: rTF, sort: rSort, tap: rTap,
    order: rOrder, match: rMatch, diktat: rDiktat, fehler: rFehler,
    spell: rSpell
  }[it.type] || (() => `<p class="muted">Unbekannter Aufgabentyp.</p>`))(it);

  h += `</div><div id="fb"></div>
    <button class="btn" id="pruefen" onclick="pruefen()" disabled>Prüfen</button>`;
  app.innerHTML = h;
  if (it.type === "type") {
    const inp = document.getElementById("eingabe");
    if (inp) { inp.oninput = () => btnAn(inp.value.trim().length > 0); }
  }
  if (it.type === "diktat") diktatInit(it);
  if (it.type === "spell") setTimeout(() => sprich(it.word, "en-GB"), 350);
}

const btnAn = an => { const b = document.getElementById("pruefen"); if (b) b.disabled = !an; };

/* --- Renderer je Aufgabentyp --- */
let A = {};   // Antwortzustand der laufenden Aufgabe

function rMC(it) {
  A = { wahl: null };
  const o = shuffle([...it.opts]);
  A.opts = o;
  return o.map((x, i) =>
    `<button class="opt" id="o${i}" onclick="mcWahl(${i})">${esc(x.t)}</button>`).join("");
}
function mcWahl(i) {
  A.wahl = i;
  A.opts.forEach((_, j) => document.getElementById("o" + j).classList.toggle("sel", i === j));
  btnAn(true);
}

function rType(it) {
  A = {};
  /* Die Umlaut-Leiste ist standardmäßig aus: Jede deutsche Tastatur kann
     ä ö ü ß ohnehin. Nur für fremde Tastaturlayouts zuschaltbar. */
  const uml = (L.fach === "de" && S.settings.umlautLeiste)
    ? `<div class="uml">${["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"]
        .map(c => `<button onclick="einfuegen('${c}')">${c}</button>`).join("")}</div>` : "";
  return `<input type="text" id="eingabe" autocomplete="off" autocorrect="off"
    autocapitalize="off" spellcheck="false" placeholder="Deine Antwort">${uml}
    ${it.hint ? `<p class="muted" style="margin-top:9px">💡 ${esc(it.hint)}</p>` : ""}`;
}
function einfuegen(c) {
  const i = document.getElementById("eingabe");
  const s = i.selectionStart ?? i.value.length;
  i.value = i.value.slice(0, s) + c + i.value.slice(i.selectionEnd ?? s);
  i.focus(); i.selectionStart = i.selectionEnd = s + 1;
  btnAn(i.value.trim().length > 0);
}

/**
 * Rechtschreibung: erst sehen, dann aus dem Gedächtnis tippen.
 *
 * Vorher stand hier Multiple Choice — „people / peaple / pepole". Wer die
 * richtige Form noch nicht im Kopf hat, sieht dabei vor allem zwei falsche
 * Schreibweisen und muss raten. Genau das ist passiert: zweimal dasselbe Wort
 * falsch, beide Male anders falsch. Deshalb bekommt sie das Wort jetzt zuerst
 * korrekt zu sehen und zu hören, und ruft es danach selbst ab. Falsche
 * Schreibweisen kommen in dieser Aufgabe überhaupt nicht mehr vor.
 */
function rSpell(it) {
  A = { phase: "zeigen" };
  return `<div id="spellbox">${spellZeigenHtml(it)}</div>`;
}

function spellZeigenHtml(it) {
  return `<div class="center" style="padding:6px 0 2px">
      <div class="spellwort">${esc(it.word)}</div>
      ${it.bedeutung ? `<p class="sub" style="margin:6px 0 0">${esc(it.bedeutung)}</p>` : ""}
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="chip" onclick="sprich('${esc(it.word)}','en-GB')">🔊 Anhören</button>
      </div>
      ${it.hint ? `<p class="muted" style="margin:12px 0 0">💡 ${esc(it.hint)}</p>` : ""}
      <p class="muted" style="margin:14px 0 10px">
        Schau es dir in Ruhe an. Wenn du es dir gemerkt hast, geht es weiter.</p>
      <button class="btn" onclick="spellVerdecken()">Ich kann's — verdecken</button>
    </div>`;
}

/** Wort verdecken und tippen lassen. Ab hier gibt es nur noch den Klang. */
function spellVerdecken() {
  const it = L.items[L.i];
  A.phase = "tippen";
  document.getElementById("spellbox").innerHTML = `
    ${it.bedeutung ? `<p class="sub" style="margin:0 0 10px">${esc(it.bedeutung)}</p>` : ""}
    <div class="row" style="margin-bottom:10px">
      <button class="chip" onclick="sprich('${esc(it.word)}','en-GB')">🔊 Nochmal hören</button>
    </div>
    <input type="text" id="eingabe" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" placeholder="Wort schreiben">
    ${it.hint ? `<p class="muted" style="margin-top:9px">💡 ${esc(it.hint)}</p>` : ""}`;
  const inp = document.getElementById("eingabe");
  if (inp) { inp.oninput = () => btnAn(inp.value.trim().length > 0); inp.focus(); }
  sprich(it.word, "en-GB");
}

function rTF(it) {
  A = { wahl: null };
  return `<p style="font-size:17px;margin:12px 0">${esc(it.statement)}</p>
    <div class="row">
      <button class="opt center" id="o0" onclick="tfWahl(true)">✓ Richtig</button>
      <button class="opt center" id="o1" onclick="tfWahl(false)">✕ Falsch</button>
    </div>`;
}
function tfWahl(v) {
  A.wahl = v;
  document.getElementById("o0").classList.toggle("sel", v);
  document.getElementById("o1").classList.toggle("sel", !v);
  btnAn(true);
}

/**
 * Sortieren in Körbe.
 *
 * Alles bleibt bis zum Prüfen änderbar: Ein Wort im Korb lässt sich antippen
 * und wandert zurück in den Vorrat. Ohne das wäre ein Fehlgriff nicht mehr zu
 * korrigieren — und das ist bei einem Kind der sichere Weg zum Frust.
 */
function rSort(it) {
  A = { zuord: {}, aktiv: null };
  A.words = shuffle([...it.words]);
  return `<div id="sortbox">${sortHtml(it)}</div>
    <p class="muted" id="sorthinweis" style="margin-top:10px">Tippe ein Wort an,
    dann den Korb. Ein Wort im Korb kannst du wieder herausnehmen.</p>`;
}

function sortHtml(it) {
  const offen = A.words.map((w, i) => ({ w, i })).filter(x => A.zuord[x.i] === undefined);
  return `
    <div class="chips" id="wpool">${offen.length
      ? offen.map(x => `<button class="chip2 ${A.aktiv === x.i ? "sel" : ""}"
          onclick="sortWahl(${x.i})">${esc(x.w.w)}</button>`).join("")
      : (A.geprueft ? "" : `<span class="muted">Alle Wörter zugeordnet.</span>`)}</div>
    <div class="buckets">${it.buckets.map((b, bi) => `
      <div class="bucket ${A.aktiv !== null && !A.geprueft ? "act" : ""}"
        ${A.geprueft ? "" : `onclick="sortLegen(${bi})"`}>
        <b>${esc(b)}</b>
        ${A.words.map((w, i) => {
          if (A.zuord[i] !== bi) return "";
          const richtig = it.buckets.indexOf(w.b) === bi;
          const farbe = A.geprueft ? (richtig ? " good" : " bad") : "";
          return `<button class="chip2${farbe}" ${A.geprueft ? "" :
            `onclick="event.stopPropagation();sortRaus(${i})"`}>${esc(w.w)}${
            A.geprueft && !richtig ? ` <small>(${esc(w.b)})</small>` : ""}</button>`;
        }).join("")}
      </div>`).join("")}</div>`;
}

function sortZeichnen() {
  document.getElementById("sortbox").innerHTML = sortHtml(L.items[L.i]);
  btnAn(Object.keys(A.zuord).length === A.words.length);
}

function sortWahl(i) {
  A.aktiv = A.aktiv === i ? null : i;   // nochmal antippen hebt die Auswahl auf
  sortZeichnen();
}
function sortLegen(bi) {
  if (A.aktiv === null) return;
  A.zuord[A.aktiv] = bi;
  A.aktiv = null;
  sortZeichnen();
}
function sortRaus(i) {
  delete A.zuord[i];
  A.aktiv = null;
  sortZeichnen();
}

function rTap(it) {
  A = { wahl: null };
  return `<div class="chips">${it.tokens.map((t, i) =>
    `<button class="chip2" id="t${i}" onclick="tapWahl(${i})">${esc(t)}</button>`).join("")}</div>`;
}
function tapWahl(i) {
  A.wahl = i;
  L.items[L.i].tokens.forEach((_, j) =>
    document.getElementById("t" + j).classList.toggle("sel", i === j));
  btnAn(true);
}

function rOrder(it) {
  A = { gelegt: [] };
  A.pool = shuffle([...it.words]);
  return `<div class="slot" id="slot"></div>
    <div class="chips" id="pool">${A.pool.map((w, i) =>
      `<button class="chip2" id="p${i}" onclick="ordNimm(${i})">${esc(w)}</button>`).join("")}</div>`;
}
function ordNimm(i) {
  const b = document.getElementById("p" + i);
  if (b.classList.contains("used")) return;
  b.classList.add("used");
  A.gelegt.push({ w: A.pool[i], i });
  ordZeichnen();
}
function ordZurueck(k) {
  const e = A.gelegt.splice(k, 1)[0];
  document.getElementById("p" + e.i).classList.remove("used");
  ordZeichnen();
}
function ordZeichnen() {
  document.getElementById("slot").innerHTML = A.gelegt.map((e, k) =>
    `<button class="chip2" onclick="ordZurueck(${k})">${esc(e.w)}</button>`).join("");
  btnAn(A.gelegt.length === A.pool.length);
}

/**
 * Paare zuordnen.
 *
 * Verbundene Paare bekommen dieselbe Nummer, damit sichtbar ist, was
 * zusammengehört. Antippen löst die Verbindung wieder — bis zum Prüfen
 * bleibt alles änderbar.
 */
function rMatch(it) {
  A = { zuord: {}, aktiv: null };
  A.links = it.pairs.map(p => p[0]);
  A.rechts = shuffle(it.pairs.map(p => p[1]));
  return `<div id="matchbox">${matchHtml(it)}</div>
    <p class="muted" id="matchhinweis" style="margin-top:10px">Tippe links ein Wort an,
    dann rechts das passende. Zum Lösen nochmal antippen.</p>`;
}

function matchHtml(it) {
  /* Nummer eines Paares — für die sichtbare Verbindung. */
  const nrLinks = i => A.zuord[i] === undefined ? null
    : Object.keys(A.zuord).sort((a, b) => a - b).indexOf(String(i)) + 1;
  const nrRechts = ri => {
    const l = Object.keys(A.zuord).find(k => A.zuord[k] === ri);
    return l === undefined ? null : nrLinks(+l);
  };
  const richtigL = i => A.rechts[A.zuord[i]] === it.pairs.find(p => p[0] === A.links[i])[1];

  const knopf = (text, nr, sel, klick, zustand) => `
    <button class="chip2${zustand}${sel ? " sel" : ""}"
      style="width:100%;margin-bottom:7px;text-align:left"
      ${klick ? `onclick="${klick}"` : ""}>
      ${nr ? `<b style="opacity:.6">${nr}</b> ` : ""}${esc(text)}</button>`;

  return `<div class="pairs">
    <div>${A.links.map((x, i) => {
      const nr = nrLinks(i);
      const zustand = A.geprueft && nr ? (richtigL(i) ? " good" : " bad") : "";
      return knopf(x, nr, A.aktiv === i, A.geprueft ? "" : `matchL(${i})`, zustand);
    }).join("")}</div>
    <div>${A.rechts.map((x, i) => {
      const nr = nrRechts(i);
      return knopf(x, nr, false, A.geprueft ? "" : `matchR(${i})`, "");
    }).join("")}</div></div>`;
}

function matchZeichnen() {
  document.getElementById("matchbox").innerHTML = matchHtml(L.items[L.i]);
  btnAn(Object.keys(A.zuord).length === A.links.length);
}

function matchL(i) {
  // Schon verbunden? Dann Verbindung lösen statt neu auswählen.
  if (A.zuord[i] !== undefined) { delete A.zuord[i]; A.aktiv = null; }
  else A.aktiv = A.aktiv === i ? null : i;
  matchZeichnen();
}
function matchR(ri) {
  const belegt = Object.keys(A.zuord).find(k => A.zuord[k] === ri);
  if (belegt !== undefined) { delete A.zuord[belegt]; A.aktiv = null; matchZeichnen(); return; }
  if (A.aktiv === null) return;
  A.zuord[A.aktiv] = ri;
  A.aktiv = null;
  matchZeichnen();
}

function rFehler(it) {
  A = { markiert: new Set() };
  return `<p class="muted" style="margin:0 0 10px">
      ${Object.keys(it.wrong).length} Wörter sind falsch geschrieben.</p>
    <div class="chips">${it.tokens.map((t, i) =>
      `<button class="chip2" id="f${i}" onclick="fehlerTipp(${i})">${esc(t)}</button>`).join("")}</div>`;
}
function fehlerTipp(i) {
  A.markiert.has(i) ? A.markiert.delete(i) : A.markiert.add(i);
  document.getElementById("f" + i).classList.toggle("sel", A.markiert.has(i));
  btnAn(A.markiert.size > 0);
}

/* --- Diktat ---
 * Jeder Modus wird vorgelesen. Ein Diktat ohne Ansage wäre Raterei.
 * Ist keine deutsche Stimme da, blendet die App den Satz stattdessen
 * kurz ein (Schleichdiktat) — das funktioniert auf jedem Gerät.
 */
function rDiktat(it) {
  A = { satz: 0, eingaben: [], modus: it.mode || "hoeren", tonDefekt: false };
  const hinweis = {
    hoeren: "Du hörst jeden Satz einzeln und tippst ihn. So oft wiederholen, wie du willst.",
    luecke: "Du hörst den ganzen Satz — tippen musst du nur die fehlenden Wörter.",
    schleich: "Der Satz erscheint kurz. Merk ihn dir und tippe ihn dann."
  }[A.modus];
  return `<div id="dbox">
    <p class="muted">${esc(hinweis)}</p>
    ${it.vorschau ? `<div class="card" style="background:var(--card2);margin:12px 0">
      <b style="font-size:14px">Diese Wörter kommen vor:</b>
      <div class="chips" style="margin:8px 0 0">${it.vorschau.map(w =>
        `<span class="chip2">${esc(w)}</span>`).join("")}</div></div>` : ""}
    <button class="btn ok" onclick="diktatLos()">Los geht's</button>
  </div>`;
}
function diktatInit() {
  btnAn(false);
  const b = document.getElementById("pruefen");
  if (b) b.style.display = "none";        // das Diktat hat eigene Knöpfe
}

function diktatLos() { diktatSatz(); }

function diktatSatz() {
  const it = L.items[L.i];
  const s = it.sentences[A.satz];
  if (!s) return;
  const letzter = A.satz + 1 >= it.sentences.length;

  /* Abspielknöpfe gibt es in JEDEM Modus. */
  let steuer = `<div class="dict-sent">
      <button onclick="diktatHoeren()">🔊 Anhören</button>
      <button onclick="diktatHoeren(0.55)">🐢 Langsam</button>
      ${A.modus !== "luecke" ? `<button onclick="diktatBlitz()">👁 Kurz zeigen</button>` : ""}
    </div>
    <div id="blitz" class="muted" style="min-height:26px"></div>`;

  let feld;
  if (A.modus === "luecke") {
    feld = `<div class="lsatz">${lueckeHtml(s)}</div>`;
  } else {
    /* Mehrzeilig und mitwachsend: Ein einzeiliges Feld schiebt den Satzanfang
       aus dem Bild, sobald er länger wird — dann kann sie vor dem Abschicken
       nicht mehr nachlesen, was sie geschrieben hat. */
    feld = `<textarea id="eingabe" rows="2" autocomplete="off" autocorrect="off"
      autocapitalize="sentences" spellcheck="false"
      placeholder="Satz hier tippen"
      oninput="mitwachsen(this)"></textarea>`;
  }

  document.getElementById("dbox").innerHTML = `
    <p class="muted">Satz ${A.satz + 1} von ${it.sentences.length}</p>
    ${A.tonDefekt ? `<div class="tonhinweis">🔇 Auf diesem Gerät ist keine deutsche
      Sprachausgabe installiert. Nutze stattdessen <b>👁 Kurz zeigen</b>.</div>` : ""}
    ${steuer}${feld}
    ${S.settings.umlautLeiste ? `<div class="uml">${["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"]
      .map(c => `<button onclick="einfuegen('${c}')">${c}</button>`).join("")}</div>` : ""}
    <div style="height:12px"></div>
    <button class="btn ok" onclick="diktatWeiter()">
      ${letzter ? "Diktat abgeben" : "Nächster Satz"}</button>`;

  const feldEl = document.getElementById("eingabe");
  if (feldEl && feldEl.tagName === "TEXTAREA") mitwachsen(feldEl);
  setTimeout(() => diktatHoeren(), 400);
}

/** Textfeld wächst mit dem Inhalt, damit nichts aus dem Bild rutscht. */
function mitwachsen(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 260) + "px";
}

/** Satz mit Eingabefeldern an den Lückenstellen. */
function lueckeHtml(s) {
  let rest = s.text, out = "", gi = 0;
  (s.luecken || []).forEach(w => {
    const i = rest.indexOf(w);
    if (i < 0) return;
    out += esc(rest.slice(0, i)) +
      `<input type="text" class="gap" id="g${gi}" autocomplete="off" autocorrect="off"
        spellcheck="false" style="width:${Math.max(6, w.length + 2)}ch">`;
    rest = rest.slice(i + w.length);
    gi++;
  });
  return out + esc(rest);
}

/** @returns {boolean} ob tatsächlich etwas abgespielt wurde */
function diktatHoeren(tempo) {
  const it = L.items[L.i];
  let t = it.sentences[A.satz].text;
  if (S.settings.satzzeichenSprechen) {
    t = t.replace(/,/g, " Komma").replace(/\.$/, " Punkt")
         .replace(/\?$/, " Fragezeichen").replace(/!$/, " Rufzeichen");
  }
  const ok = sprich(t, "de-AT", tempo || S.settings.tempo);
  if (!ok && !A.tonDefekt) {
    A.tonDefekt = true;
    // Ohne Stimme darf das Diktat nicht zur Raterei werden: Satz einblenden.
    if (A.modus === "hoeren") A.modus = "schleich";
    diktatSatz();
    setTimeout(diktatBlitz, 300);
  }
  return ok;
}

function diktatBlitz() {
  const it = L.items[L.i];
  const el = document.getElementById("blitz");
  if (!el) return;
  el.textContent = it.sentences[A.satz].text;
  el.style.color = "var(--txt)";
  setTimeout(() => {
    el.textContent = "…jetzt tippen";
    el.style.color = "var(--dim)";
  }, 5000);
}

function diktatWeiter() {
  const it = L.items[L.i];
  if (A.modus === "luecke") {
    const s = it.sentences[A.satz];
    A.eingaben[A.satz] = (s.luecken || []).map((_, i) =>
      (document.getElementById("g" + i)?.value || "").trim());
  } else {
    A.eingaben[A.satz] = document.getElementById("eingabe").value;
  }
  A.satz++;
  if (A.satz < it.sentences.length) diktatSatz();
  else {
    if (window.speechSynthesis) speechSynthesis.cancel();
    const b = document.getElementById("pruefen");
    if (b) b.style.display = "";
    btnAn(true);
    pruefen();
  }
}

/* ══════════════════════════════════════════════════════════════════
   6. AUSWERTUNG
   ══════════════════════════════════════════════════════════════════ */

function pruefen() {
  const it = L.items[L.i];
  let ok = false, miss = null, loesung = "", extra = "";
  /* quote bleibt null, solange es nur richtig oder falsch gibt. Das Diktat
     setzt sie auf den Anteil richtig geschriebener Wörter. */
  let quote = null, diktatInfo = null;

  switch (it.type) {
    case "mc": {
      const w = A.opts[A.wahl];
      ok = w.t === it.correct; miss = ok ? null : w.miss;
      loesung = it.correct;
      A.opts.forEach((x, i) => {
        const e = document.getElementById("o" + i);
        if (x.t === it.correct) e.classList.add("good");
        else if (i === A.wahl) e.classList.add("bad");
      });
      break;
    }
    case "type": {
      const v = document.getElementById("eingabe").value;
      const cs = it.caseSensitive !== false;
      const kand = [it.answer, ...(it.alt || [])];
      ok = kand.some(k => norm(k, cs) === norm(v, cs));
      loesung = it.answer;
      break;
    }
    case "spell": {
      const v = (document.getElementById("eingabe")?.value || "").trim();
      ok = v.toLowerCase() === it.word.toLowerCase();
      loesung = it.word;
      /* Kein Tippfehler-Bonus: Bei einer Rechtschreibaufgabe ist der
         Buchstabe genau das, worum es geht. */
      if (!ok && v) extra = `Du hattest: <b>${esc(v)}</b>`;
      break;
    }
    case "tf":
      ok = A.wahl === it.answer;
      loesung = it.answer ? "Richtig" : "Falsch";
      extra = it.erklaerung || "";
      break;
    case "sort": {
      ok = true;
      A.words.forEach((w, i) => {
        const soll = it.buckets.indexOf(w.b);
        if (A.zuord[i] !== soll) ok = false;
      });
      A.geprueft = true;
      sortZeichnen();
      const hinweis = document.getElementById("sorthinweis");
      if (hinweis) hinweis.style.display = "none";
      loesung = "";   // die richtige Zuordnung steht schon farbig in den Körben
      break;
    }
    case "tap":
      ok = A.wahl === it.correctIndex;
      loesung = it.tokens[it.correctIndex];
      it.tokens.forEach((_, i) => {
        const e = document.getElementById("t" + i);
        if (i === it.correctIndex) e.classList.add("good");
        else if (i === A.wahl) e.classList.add("bad");
      });
      break;
    case "order":
      ok = A.gelegt.map(e => e.w).join(" ") === it.solution.join(" ");
      loesung = it.solution.join(" ");
      break;
    case "match": {
      ok = true;
      A.links.forEach((l, i) => {
        const soll = it.pairs.find(p => p[0] === l)[1];
        if (A.rechts[A.zuord[i]] !== soll) ok = false;
      });
      A.geprueft = true;
      matchZeichnen();
      const mh = document.getElementById("matchhinweis");
      if (mh) mh.style.display = "none";
      loesung = ok ? "" : it.pairs.map(p => `${p[0]} → ${p[1]}`).join(" · ");
      break;
    }
    case "fehler": {
      const sollIdx = new Set(Object.keys(it.wrong).map(Number));
      ok = sollIdx.size === A.markiert.size &&
           [...sollIdx].every(i => A.markiert.has(i));
      it.tokens.forEach((_, i) => {
        const e = document.getElementById("f" + i);
        if (sollIdx.has(i)) e.classList.add("good");
        else if (A.markiert.has(i)) e.classList.add("bad");
      });
      loesung = Object.entries(it.wrong).map(([i, w]) => `${it.tokens[i]} → ${w}`).join(" · ");
      break;
    }
    case "diktat": {
      const res = diktatAuswerten(it);
      ok = res.fehler === 0;
      quote = res.quote;                      // anteilig, nicht alles-oder-nichts
      diktatInfo = { fehler: res.fehler, woerter: res.woerter };
      L.diktatQuote = res.quote;
      L.diktatWoerter = res.woerter;
      L.diktatRichtig = res.woerter - res.fehler;
      extra = res.html;
      if (ok) S.stats.perfekteDiktate = (S.stats.perfekteDiktate || 0) + 1;
      break;
    }
  }

  /* --- Mastery und Protokoll fortschreiben --- */
  (it.rules || []).forEach(r => masteryUpdate(r, quote === null ? ok : quote));
  srsPlanen(it.id, ok);
  S.log.push({ item: it.id, ok, rules: it.rules || [], miss: miss || null,
               ms: Date.now() - (L.itemStart || L.start), tag: programmTag(),
               lektion: L.lekId,
               /* Beim Diktat sagt „falsch" allein nichts: ein Fehler oder zehn
                  sind zwei verschiedene Befunde. Deshalb kommt die Zahl mit. */
               ...(diktatInfo ? { fehler: diktatInfo.fehler, woerter: diktatInfo.woerter } : {}) });
  if (S.log.length > 300) S.log = S.log.slice(-300);

  if (ok) { L.richtig++; xpGeben(10); }
  else {
    L.falsch++;
    /* Regeln mitschreiben, nicht nur die ID: Das Diktat des Tages wird zur
       Laufzeit gebaut und steht in keinem Aufgabenpool. Über die ID allein
       ließe sich dafür nichts nachbessern. */
    (L.fehler = L.fehler || []).push({ id: it.id, rules: it.rules || [] });
    (it.rules || []).forEach(r => L.regelFehler[r] = (L.regelFehler[r] || 0) + 1);
  }

  /* --- Notbremse: dreimal dieselbe Regel falsch ---
     Weiterbohren bringt nichts. Die Regel fliegt für heute raus und die
     Erklärkarte kommt stattdessen von selbst. */
  const gesperrt = Object.entries(L.regelFehler).filter(([, n]) => n >= 3).map(([r]) => r);
  if (gesperrt.length) {
    L.items = L.items.filter((x, idx) =>
      idx <= L.i || !(x.rules || []).some(r => gesperrt.includes(r)));
    const neuGesperrt = gesperrt.find(r => !(L.gezeigt || []).includes(r));
    if (neuGesperrt && karteFuerRegel(neuGesperrt)) {
      L.gezeigt = [...(L.gezeigt || []), neuGesperrt];
      setTimeout(() => erklaerungZeigen(neuGesperrt), 600);
    }
  }

  ton(ok ? "richtig" : "falsch");

  /* --- Rückmeldung --- */
  const strat = (it.rules || []).map(r => REGEL_MAP[r]?.strategie).filter(Boolean)[0];
  const erklRegel = ok ? null : (it.rules || []).find(r => karteFuerRegel(r));
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ Richtig!" : "✕ Noch nicht"}</b>
      ${!ok && loesung ? `Richtig wäre: <b style="display:inline">${esc(loesung)}</b>` : ""}
      ${extra ? `<div style="margin-top:7px">${extra}</div>` : ""}
      ${!ok && strat ? `<div class="strat">💡 ${esc(strat)}</div>` : ""}
      ${erklRegel ? `<button class="btn ghost sm" style="margin-top:10px"
          onclick="erklaerungZeigen('${erklRegel}')">📖 Nochmal erklären</button>` : ""}
    </div>`;

  const b = document.getElementById("pruefen");
  b.textContent = L.i + 1 < L.items.length ? "Weiter" : "Fertig";
  b.className = "btn ok";
  b.onclick = weiter;
  b.disabled = false;
  sichern();
}

function diktatAuswerten(it) {
  let fehler = 0, tippfehler = 0;
  const clean = x => String(x).replace(/[.,!?„“”"]/g, "");

  /** Ein Wort vergleichen und als farbiges Stück zurückgeben. */
  const wort = (soll, ist) => {
    if (clean(ist) === clean(soll)) return `<span class="w-ok">${esc(soll)}</span>`;
    if (ist && istTippfehler(clean(soll), clean(ist))) {
      tippfehler++;
      return `<span class="w-typo">${esc(ist)}</span>`;
    }
    fehler++;
    return `<span class="w-bad">${esc(ist || "—")} <small>(${esc(soll)})</small></span>`;
  };

  const zeilen = it.sentences.map((s, si) => {
    /* Lückendiktat: nur die Lücken werden bewertet, der Rest steht ja da. */
    if (A.modus === "luecke" && Array.isArray(A.eingaben[si])) {
      const gaps = s.luecken || [];
      let rest = s.text, out = "";
      gaps.forEach((w, gi) => {
        const i = rest.indexOf(w);
        if (i < 0) return;
        out += esc(rest.slice(0, i)) + wort(w, A.eingaben[si][gi] || "");
        rest = rest.slice(i + w.length);
      });
      return out + esc(rest);
    }
    /* Hör- und Schleichdiktat: der ganze Satz zählt. */
    const soll = s.text.split(/\s+/);
    const ist = String(A.eingaben[si] || "").trim().split(/\s+/).filter(Boolean);
    return soll.map((w, wi) => wort(w, ist[wi] || "")).join(" ");
  });

  /* Wie viele Wörter waren zu schreiben? Beim Lückendiktat nur die Lücken. */
  const woerter = A.modus === "luecke"
    ? it.sentences.reduce((n, s) => n + (s.luecken || []).length, 0)
    : it.sentences.reduce((n, s) => n + s.text.split(/\s+/).length, 0);
  const quote = woerter ? Math.max(0, (woerter - fehler) / woerter) : 0;

  return {
    fehler, tippfehler, woerter, quote,
    html: `<div class="diff">${zeilen.join("<br>")}</div>
      <div class="muted" style="margin-top:8px">
        ${woerter - fehler} von ${woerter} Wörtern richtig${
          fehler ? ` · ${fehler} Rechtschreibfehler` : ""}${
          tippfehler ? ` · ${tippfehler} Tippfehler (zählen nicht)` : ""}</div>`
  };
}

function weiter() {
  L.i++;
  L.itemStart = Date.now();
  if (L.i >= L.items.length) beenden(); else render();
}

function beenden() {
  /* Beim Diktat ist die Wortquote das ehrlichere Maß: Ein Fehler in vier
     Sätzen ergäbe sonst glatte null Prozent. */
  const score = L.lekId === "diktat" && typeof L.diktatQuote === "number"
    ? L.diktatQuote
    : (L.items.length ? L.richtig / L.items.length : 0);
  streakPruefen();
  S.stats.sessions = (S.stats.sessions || 0) + 1;
  S.completed[L.lekId] = { score, date: heute() };

  /* Durchgang verbuchen — aber höchstens einer pro Tag und Lektion.
     Der erzwungene Abstand ist der eigentliche Wirkstoff. */
  if (L.lekId === "diktat") {
    S.diktat.letzterTag = heute();
    if (!S.diktat.erledigt.includes(L.diktatId)) S.diktat.erledigt.push(L.diktatId);
  }

  const SONDER = ["dauer", "diktat", "nachbessern", "uebungsrunde"];
  if (!SONDER.includes(L.lekId) && !L.zaehltNicht) {
    const p = S.lektionen[L.lekId] || (S.lektionen[L.lekId] = { passes: 0, tage: [], gesehen: [] });
    const h = heute();
    if (!p.tage.includes(h)) {
      p.passes++;
      p.tage.push(h);
    }
    // gesehene Aufgaben merken, damit der nächste Durchgang Neues bringt
    L.items.forEach(it => { if (!p.gesehen.includes(it.id)) p.gesehen.push(it.id); });

    const st = lektionsStatus(L.lekId, L.fach);
    if (st.fertig && !p.graduiert) {
      p.graduiert = true;
      L.graduiert = true;
      xpGeben(60);
    }
    L.status = st;
  }

  if (score >= 0.8) xpGeben(25);
  L.neueBadges = badgesPruefen();
  ton(L.graduiert ? "stufe" : "fertig");
  if (L.graduiert || score >= 0.9) setTimeout(() => konfetti(L.graduiert ? 90 : 50), 250);
  sichern();
  VIEW = "ergebnis";
  render();
}

/* ---------- Diktat des Tages ---------- */

/** Wählt ein Diktat, das zum aktuellen Stoff und zu den Schwächen passt. */
function waehleDiktat() {
  const erledigt = new Set(S.diktat.erledigt || []);
  const offen = DIKTATE.filter(d => !erledigt.has(d.id));
  const pool = offen.length ? offen : DIKTATE;          // notfalls von vorn

  const schwIds = new Set(schwaechen().map(s => s.id));
  const aktivDe = aktiveLektion("de");
  const aktuelleRegeln = new Set(aktivDe ? lektionsRegeln(aktivDe, "de") : []);

  const punkte = d => {
    let p = 0;
    d.rules.forEach(r => {
      if (schwIds.has(r)) p += 3;              // gezielt an Schwächen arbeiten
      if (aktuelleRegeln.has(r)) p += 2;       // zum laufenden Thema passen
      if (regelEingefuehrt(r)) p += 1;         // nichts abfragen, was noch fehlt
    });
    return p - Math.abs(d.stufe - diktatStufe()) * 2;
  };
  return [...pool].sort((a, b) => punkte(b) - punkte(a))[0];
}

/** Mit wachsender Erfahrung dürfen die Diktate länger werden. */
function diktatStufe() {
  const n = (S.diktat.erledigt || []).length;
  return n < 4 ? 1 : n < 10 ? 2 : 3;
}

function diktatStarten() {
  const d = waehleDiktat();
  if (!d) { alert("Keine Diktate verfügbar."); return; }
  const item = {
    id: "diktat-" + d.id, type: "diktat", mode: "hoeren",
    rules: ["de.txt.diktat", ...d.rules],
    prompt: "Diktat des Tages",
    vorschau: d.vorschau, sentences: d.sentences
  };
  L = { fach: "de", lekId: "diktat", diktatId: d.id, items: [item], i: 0,
        richtig: 0, falsch: 0, start: Date.now(), itemStart: Date.now(), regelFehler: {} };
  VIEW = "uebung";
  render();
}

function renderErgebnis() {
  /* Beim Diktat zählen Wörter, nicht Aufgaben — sonst stünde nach einem
     einzigen Fehler „0 von 1 richtig" unter vier fehlerfrei getroffenen Sätzen. */
  const diktat = L.lekId === "diktat" && typeof L.diktatQuote === "number";
  const score = diktat ? L.diktatQuote
                       : (L.items.length ? L.richtig / L.items.length : 0);
  const pct = Math.round(score * 100);
  const wort = pct >= 90 ? "Fantastisch!" : pct >= 70 ? "Gut gemacht!" :
               pct >= 50 ? "Solide Runde." : "Das war knifflig.";

  /* Bewusst ohne Prozentzahl: Die Zahl allein lädt zum Punktejagen ein.
     „8 von 10 richtig" sagt dasselbe, ohne nach Note zu klingen. */
  const zustand = pct >= 90 ? "super" : pct >= 70 ? "gut" : "uebung";
  const bilanz = diktat
    ? `${L.diktatRichtig} von ${L.diktatWoerter} Wörtern richtig`
    : `${L.richtig} von ${L.items.length} richtig`;
  let h = `<div class="card center">
    <div class="jubel">${kristall(zustand, 86)}</div>
    <h2 style="margin-top:10px">${wort}</h2>
    <p class="sub">${bilanz}</p>
  </div>`;

  /* Nachbessern anbieten, solange die Fehler frisch sind. Rückmeldung wirkt
     am stärksten, wenn gleich danach die Gelegenheit kommt, sie anzuwenden. */
  /* Nur anbieten, wenn sich daraus auch wirklich eine Runde bauen lässt —
     sonst erschien ein Hinweis „nichts zum Nachbessern", obwohl etwas falsch war. */
  const nachbesserbar = (L.fehler || []).length && L.lekId !== "nachbessern"
    ? baueNachbesserung(L.fehler, L.fach) : [];
  if (nachbesserbar.length) {
    const daten = JSON.stringify(L.fehler).replace(/"/g, "&quot;");
    const n = L.fehler.length;
    h += `<div class="card">
      <h2>Nochmal anschauen?</h2>
      <p class="sub">${n} Aufgabe${n === 1 ? "" : "n"} ${n === 1 ? "hat" : "haben"}
      noch nicht geklappt. ${nachbesserbar.length} passende Übungen warten —
      das verbessert deine Regeln. Dein Ergebnis von eben bleibt, wie es ist.</p>
      <div style="height:11px"></div>
      <button class="btn ok" onclick='nachbessernStarten("${L.fach}", ${daten})'>
        Das üben wir nochmal</button>
    </div>`;
  }

  /* Lektion gemeistert? Das ist der eigentliche Meilenstein — nicht ein Tag. */
  if (L.graduiert) {
    h += `<div class="card center" style="border-color:var(--gold)">
      <div class="jubel">${kristall("super", 100)}</div>
      <h2 style="margin-top:10px">Lektion gemeistert!</h2>
      <p class="sub">„${esc(LEK(L.fach)[L.lekId].titel)}" sitzt.
      Die nächste Lektion ist freigeschaltet.</p></div>`;
  } else if (L.status) {
    const fehlt = [];
    if (L.status.passes < MIN_DURCHGAENGE)
      fehlt.push(`noch ${MIN_DURCHGAENGE - L.status.passes} Durchgang`);
    if (L.status.mastery < GRAD_MASTERY)
      fehlt.push(`Sicherheit bei ${Math.round(L.status.mastery * 100)} von 85 %`);
    h += `<div class="card"><h2>Diese Lektion</h2>
      <div class="wk"><b>Durchgang ${L.status.passes} geschafft</b>
        <div class="mini"><i style="width:${Math.round(L.status.mastery * 100)}%;
          background:${L.status.mastery >= 0.7 ? "var(--ok)" : "var(--gold)"}"></i></div></div>
      <p class="sub" style="margin-top:9px">${fehlt.length
        ? "Bis zum Meistern: " + fehlt.join(" · ") + ". Der nächste Durchgang zählt ab morgen."
        : "Fast geschafft — der nächste Durchgang zählt ab morgen."}</p></div>`;
  }

  const schwach = Object.entries(L.regelFehler).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (schwach.length) {
    h += `<div class="card"><h2>Woran wir arbeiten</h2>` +
      schwach.map(([r, n]) => {
        const d = REGEL_MAP[r];
        return `<div class="wk"><b>${esc(d?.name || r)}</b>
          <span class="muted">${n}×</span></div>`;
      }).join("") +
      `<p class="sub" style="margin-top:9px">Diese Aufgaben kommen in den nächsten
      Tagen automatisch wieder.</p></div>`;
  }

  if (L.neueBadges?.length) {
    h += `<div class="card"><h2>🎁 Neue Abzeichen!</h2>` + L.neueBadges.map(b =>
      `<div class="badge"><i>${b.icon}</i><div><b>${esc(b.name)}</b>
        <span>${esc(b.text)}</span></div></div>`).join("") + `</div>`;
  }

  if (exportFaellig()) {
    h += `<div class="banner"><b>📮 Zeig das kurz deinen Eltern</b>
      <p class="sub" style="margin:5px 0 11px">Sie können deinen Fortschritt sichern.
      Danach gibt es Übungen, die besser zu dir passen.</p>
      <button class="btn sm" onclick="zeige('export')">Fortschritt sichern</button></div>`;
  }

  h += `<button class="btn" onclick="zeige('home')">Weiter zur Übersicht</button>`;
  app.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════
   7. EXPORT / IMPORT
   ══════════════════════════════════════════════════════════════════ */

function exportPaket() {
  zerfallAnwenden();
  return {
    app: "gymnasium-fitness", version: 2, erstellt: new Date().toISOString(),
    tag: programmTag(),
    xp: S.xp, level: S.level, streak: S.streak.count,
    sessions: S.stats.sessions,
    completed: S.completed,
    lektionen: S.lektionen,
    diktate: (S.diktat.erledigt || []).length,
    /* Vollständig, damit ein Gerätewechsel nichts kostet: Ohne den
       Wiederholungsplan begänne das Nachholen bei null, und ohne die
       Diktathistorie käme dasselbe Diktat noch einmal. */
    srsPlan: S.srs, diktatStand: S.diktat, statistik: S.stats,
    streakStand: S.streak,
    rules: S.rules,
    schwaechen: schwaechen().map(s => ({ id: s.id, name: s.def.name,
      mastery: +s.mastery.toFixed(2), seen: s.seen, correct: s.correct })),
    gemeistert: gemeistert(),
    log: S.log.slice(-300),
    badges: S.badges
  };
}

function exportName() {
  return `gymfit-fortschritt-${heute()}.json`;
}

function exportDatei() {
  const b = new Blob([JSON.stringify(exportPaket(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = exportName();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  exportNotieren();
}

async function exportTeilen() {
  const json = JSON.stringify(exportPaket());
  const datei = new File([json], exportName(), { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: "Gymnasium Fitness — Fortschritt" });
      exportNotieren(); return;
    }
    if (navigator.share) {
      await navigator.share({ title: "Gymnasium Fitness", text: json });
      exportNotieren(); return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  exportDatei();
}

async function exportKopieren() {
  const json = JSON.stringify(exportPaket());
  try {
    await navigator.clipboard.writeText(json);
    alert("Fortschritt kopiert! Jetzt einfach in eine Nachricht einfügen.");
    exportNotieren();
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = json; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
    alert("Fortschritt kopiert!");
    exportNotieren();
  }
}

function exportNotieren() {
  S.lastExport = heute();
  Object.values(S.lektionen).forEach(p => { if (p.graduiert) p.gemeldet = true; });
  /* Merken, wie viele Schwächen beim Export offen waren — sonst löst allein
     ihr Fortbestehen die nächste Aufforderung aus. */
  S.schwaechenBeiExport = schwaechen().length;
  const neu = badgesPruefen();
  sichern();
  if (neu.length) alert("🎁 Neues Abzeichen: " + neu.map(b => b.name).join(", "));
}

/** Neues Übungspaket einlesen (aus der Wochenanalyse). */
function importDialog() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".js,.json,application/json,text/javascript";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const txt = String(r.result);
        // Fortschrittsdatei zurückspielen (Gerätewechsel)
        if (f.name.includes("fortschritt")) {
          const p = JSON.parse(txt);
          if (p.app !== "gymnasium-fitness") throw new Error("falsches Format");

          /* Vor dem Überschreiben zeigen, was verlorengeht. Diese Datei ersetzt
             den gesamten Stand — ein Export vom 8., am 12. eingespielt, löscht
             vier Tage. Sobald mehrere ähnlich benannte Dateien nebeneinander
             liegen, passiert genau das. */
          const alt = { xp: S.xp, lek: Object.keys(S.completed || {}).length };
          const neu = { xp: p.xp ?? 0, lek: Object.keys(p.completed || {}).length };
          const datum = (p.erstellt || "").slice(0, 10) || "unbekannt";
          if (alt.xp > 0 && !confirm(
                `Diese Datei ist vom ${datum}:\n` +
                `  ${neu.xp} XP · ${neu.lek} Einheiten\n\n` +
                `Dein jetziger Stand:\n` +
                `  ${alt.xp} XP · ${alt.lek} Einheiten\n\n` +
                `Der jetzige Stand wird ersetzt. Fortfahren?`)) return;

          /* Und vorher sichern, damit ein Fehlgriff umkehrbar bleibt. */
          try {
            localStorage.setItem(BACKUP_KEY, JSON.stringify({
              zeit: new Date().toISOString(), grund: "vor Import", daten: S
            }));
          } catch (e) { /* kein Platz — der Import soll trotzdem gehen */ }

          S.xp = p.xp ?? S.xp; S.level = p.level ?? S.level;
          S.completed = p.completed || S.completed;
          S.lektionen = p.lektionen || S.lektionen;
          S.rules = p.rules || S.rules;
          S.badges = p.badges || S.badges;
          /* Auch Wiederholungsplan, Diktathistorie und Zähler mitnehmen —
             sonst käme nach einem Gerätewechsel dasselbe Diktat noch einmal
             und die Wiederholungen begännen bei null. */
          if (p.srsPlan) S.srs = p.srsPlan;
          if (p.diktatStand) S.diktat = p.diktatStand;
          if (p.statistik) S.stats = { ...S.stats, ...p.statistik };
          if (p.streakStand) S.streak = p.streakStand;
          else if (typeof p.streak === "number") S.streak.count = p.streak;
          sichern();
          alert("Fortschritt geladen!");
          zeige("home"); return;
        }
        // Neues Aufgabenpaket — erst prüfen, dann dauerhaft ablegen
        const vorher = zaehleItems();
        const sc = document.createElement("script");
        sc.textContent = txt;
        document.body.appendChild(sc);
        entdoppeln();
        const n = zaehleItems();
        if (n <= vorher) throw new Error("keine neuen Aufgaben gefunden");
        try {
          localStorage.setItem(PAKET_KEY, txt);
        } catch (e) {
          alert("Das Paket wirkt jetzt, ließ sich aber nicht dauerhaft speichern. " +
                "Nach dem Neuladen wäre es weg.");
        }
        alert(`🎁 Neues Paket geladen — ${n - vorher} neue Aufgaben!`);
        zeige("home");
      } catch (e) {
        alert("Datei konnte nicht gelesen werden: " + e.message);
      }
    };
    r.readAsText(f);
  };
  inp.click();
}
const zaehleItems = () => alleItems("de").length + alleItems("en").length;

      <div class="chips" style="margin:10px 0">${FEHLEND.map(f =>

} else {
